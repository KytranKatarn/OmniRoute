repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=600']
      - id: detect-private-key
      - id: check-merge-conflict

  # gitleaks — secret scanner (entropy + rules). detect-private-key above only
  # catches PEM/SSH keys; gitleaks also catches hardcoded passwords, API keys,
  # tokens, and getenv("X_PASSWORD", "literal") defaults — the leak class behind
  # PR #1429 / KB #270467. Scans staged changes on commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: ['--line-length=120']
        files: ^(platform_v2|ai_bridge|scripts)/

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=120', '--extend-ignore=E203,W503,E501,F401,F811,F841,E402,E741,F541,E722,F821']
        files: ^(platform_v2|ai_bridge|scripts)/

  # K.I.N. single-writer guardrail for the agents table.
  # Fails any commit that introduces a raw UPDATE/INSERT/DELETE on
  # agents outside platform_v2/services/agent_service.py and test
  # fixtures. Locks in Project #241 Tracks A-C.3 lifecycle work.
  - repo: local
    hooks:
      - id: agent-single-writer-guardrail
        name: K.I.N. — agents table single-writer guardrail
        entry: python3 scripts/check_agent_single_writer.py
        language: system
        types: [python]
        pass_filenames: true

      # V.I.G.I.L. dispatch signature guardrail (Project #272 Phase 1 Task
      # #2104). Enforced starting now that drift Classes A/B/C/D have been
      # cleaned up in PRs #134 + #135. Before this registration the hook
      # was runnable on-demand only (per ADR-472 / Decision #471).
      #
      # Fails any commit that calls dispatch / dispatch_json / request_work
      # with kwargs outside the canonical signature in
      # platform_v2/tools/department_hq/services/department_dispatcher.py,
      # or omits required args. Catches rename drift (agent_name →
      # prefer_agent), ghost Ollama-layer kwargs (model/temperature/
      # keep_alive/max_tokens), typos (prefer_model), and calls to
      # non-existent instance methods like dispatcher.dispatch().
      - id: dispatch-signature-guardrail
        name: V.I.G.I.L. — dispatch signature guardrail
        entry: python3 scripts/check_dispatch_signatures.py
        language: system
        types: [python]
        pass_filenames: true

      # Timezone drift guardrail (PR #543, Phase 3).
      # Fails commits that introduce: deprecated datetime.utcnow() OR
      # literal "UTC" suffixes in user-facing strings (rendered to reports,
      # Telegram messages, KB vault notes). Storage stays UTC, display
      # uses services.time_utils.format_local() / now_local_str() so the
      # actual TZ abbreviation (EDT/EST) appears in user output.
      # See .claude/rules/timezone.md for the full convention.
      - id: timezone-drift-guardrail
        name: Timezone — drift guardrail (storage UTC, display EDT)
        entry: python3 scripts/check_timezone_drift.py
        language: system
        types: [python]
        pass_filenames: true
