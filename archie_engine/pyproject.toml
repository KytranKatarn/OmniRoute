[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archie-engine"
version = "0.1.0"
description = "ARCHIE Code CLI — Python engine daemon"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "aiosqlite>=0.19.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
archie-engine = "archie_engine.__main__:main"
