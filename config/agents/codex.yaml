# Codex CLI agent config (Phase A). See .claude/plans/codex-cli-integration-design.md
codex:
  model: "gpt-5-codex"            # set to the model your `codex` CLI exposes; informational for telemetry
  auth_mode: "chatgpt_signin"     # phase A; phase B may use api_key
  max_concurrent: 1
  max_runtime_sec: 1800           # 30 min hard cap per task
  max_files_changed: 25
  # SCOPE = exactly six low-data modules: fitness, family_tree, therapy, faith,
  # brainstorm, doc (+ tests). media_studio/game_studio/media_hub were REMOVED
  # (they hold real prod data — media_library 346, agent_portraits 154 — so they
  # need DB isolation before Codex write-work; tracked as a future task).
  allowed_paths:
    # module code dirs (family_tree + brainstorm keep templates/static under tools/<m>/)
    - "platform_v2/tools/fitness/"
    - "platform_v2/tools/family_tree/"
    - "platform_v2/tools/therapy/"
    - "platform_v2/tools/faith/"
    - "platform_v2/tools/brainstorm/"
    - "platform_v2/tools/doc/"
    # module UI in the shared trees (templates + chat JS/CSS)
    - "platform_v2/templates/tools/fitness.html"
    - "platform_v2/templates/tools/therapy.html"
    - "platform_v2/templates/tools/faith.html"
    - "platform_v2/templates/tools/brainstorm.html"
    - "platform_v2/templates/tools/doc.html"
    - "platform_v2/static/js/fitness-chat.js"
    - "platform_v2/static/js/therapy-chat.js"
    - "platform_v2/static/js/faith-chat.js"
    - "platform_v2/static/js/family-tree-chat.js"
    - "platform_v2/static/js/doc-chat.js"
    - "platform_v2/static/css/fitness.css"
    - "platform_v2/static/css/therapy.css"
    # tests
    - "platform_v2/tests/"
    # versioned Codex skill compatibility layer (owner-authorized)
    - "codex/skills/"
    - "codex/Dockerfile.terminal"
    - "codex/workspace/start-with-skills.sh"
  blocked_globs:                  # always denied even if under an allowed path
    - "*.env"
    - ".env*"
    - "docker-compose*"
    - "scripts/dr/*"
    - ".github/*"
  preflight:
    - "git status --porcelain"    # must be empty in the fresh worktree
  postflight:
    - "git diff --check"          # whitespace / conflict markers
    - "pre-commit run --files {changed}"
  # secrets stripped from Codex's env (allowlist is the default; this list is documentation)
  env_allowlist: ["HOME", "PATH", "TERM", "LANG", "CODEX_HOME"]
