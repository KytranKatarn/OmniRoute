codex:
  allowed_paths:
  - platform_v2/
  - ai_bridge/
  - archie-comms/
  - what-the-fact/
  - mcp-gateway/
  - docs/
  - scripts/
  - config/
  - scripts/agents/codex-delegation-worker.py
  auth_mode: chatgpt_signin
  blocked_globs:
  - '*.env'
  - .env*
  - docker-compose*
  - scripts/dr/*
  - .github/*
  - config/agents/*
  - scripts/agents/*
  - secrets/*
  - platform_v2/services/agent_service.py
  - '**/department_dispatcher.py'
  env_allowlist:
  - HOME
  - PATH
  - TERM
  - LANG
  - CODEX_HOME
  max_concurrent: 1
  max_files_changed: 25
  max_runtime_sec: 1800
  model: gpt-5-codex
  postflight:
  - git diff --check
  - pre-commit run --files {changed}
  preflight:
  - git status --porcelain
