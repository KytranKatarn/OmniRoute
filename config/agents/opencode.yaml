# opencode lane agent config (#6736). Mirrors config/agents/codex.yaml and is read by
# the SAME deny-by-default guard, services/agents/codex_scope.check_diff_paths — the
# guard takes (paths, cfg) and knows nothing about which agent it is guarding, so there
# is one scope implementation rather than two that can drift apart.
#
# The lane itself is credential-free by design (opencode/Dockerfile.terminal: "the
# CONTAINER is the isolation boundary … no host filesystem, no platform DB credentials,
# its own volumes, cap_drop ALL"). scripts/agents/run-opencode-task.sh keeps it that way:
# the container edits, the HOST verifies and ships.
opencode:
  model: "auto/coding:free"       # via OmniRoute; informational for telemetry
  auth_mode: "omniroute"          # no paid key — owner directive, free tier only
  max_concurrent: 1
  max_runtime_sec: 1800           # 30 min hard cap per task
  max_files_changed: 25

  # SCOPE — PLATFORM-WIDE since 2026-09-14, by explicit owner decision.
  #
  # ⚠️ THIS REVERSES A STANDING EXCLUSION. This block previously scoped the lane to
  # six low-data modules and said media_studio/game_studio/media_hub were REMOVED
  # because "they hold real prod data — media_library 346, agent_portraits 154 — so
  # they need DB isolation before write-work". The owner chose full parity with the
  # Claude CLI lane instead, so all three are now IN SCOPE and that DB-isolation
  # prerequisite is knowingly unmet. Recorded rather than deleted: the risk it named
  # did not go away, only the decision about it did.
  #
  # Deny-by-default over PREFIXES, so these are directory roots. What keeps this safe
  # is now blocked_globs below — read that before adding anything here.
  allowed_paths:
    - "website/"           # kytranempowerment.com design-port lane (owner decision 2026-09-23)
    - "platform_v2/"          # whole module tree, services, templates, static, tests
    - "ai_bridge/"            # agent_service + department_dispatcher stay BLOCKED
    - "archie-comms/"         # cockpit + lane surfaces
    - "what-the-fact/"        # WTF consumer/ingest (in-tree, not its own repo)
    - "mcp-gateway/"
    - "docs/"
    - "scripts/"              # scripts/dr/* and scripts/agents/* stay BLOCKED
    - "config/"               # config/agents/* stays BLOCKED (no self-widening)
  blocked_globs:                  # always denied even if under an allowed path
    # With a platform-wide allowlist THIS LIST is the control, not the allowlist.
    - "*.env"
    - ".env*"
    - "docker-compose*"
    - "scripts/dr/*"            # DR flips prod DNS — never from a lane
    - ".github/*"
    # No self-widening. The guard reads a BAKED copy, so an edit here could not take
    # effect until a rebuild — but "needs a rebuild to exploit" is not a reason to
    # leave it open. codex lacked this until 2026-09-14; opencode already had it.
    - "config/agents/*"
    - "scripts/agents/*"
    # Reachable for the FIRST TIME now that scope is platform-wide. Under the old
    # six-module allowlist nothing here was in range, so its absence cost nothing.
    - "secrets/*"
    # Single-writer + dispatch invariants (CLAUDE.md, ADR-013). Guarded elsewhere by
    # pre-commit hooks; blocking here fails EARLIER, at push.
    - "platform_v2/services/agent_service.py"
    - "**/department_dispatcher.py"

  preflight:
    - "git status --porcelain"    # the lane must be clean before a task starts
  postflight:
    - "git diff --check"          # whitespace / conflict markers
    - "pre-commit run --files {changed}"

  # The lane gets NO secrets. Its only outbound reach is OmniRoute on its own
  # network (docker-compose: opencode_terminal_net), and it holds no git credential
  # in either direction — see the runner's header for why that is deliberate.
  env_allowlist: ["HOME", "PATH", "TERM", "LANG", "OPENCODE_HOME", "XDG_CONFIG_HOME", "XDG_DATA_HOME"]
