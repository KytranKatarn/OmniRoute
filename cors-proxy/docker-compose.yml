services:
  cors-proxy:
    image: nginx:1.27-alpine
    container_name: kytran_cors_proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /var/cache/nginx:size=32m
      - /run:size=1m
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8098:80"
    mem_limit: 64m
    cpus: 0.25
