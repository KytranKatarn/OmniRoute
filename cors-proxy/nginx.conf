server {
    listen 80;
    server_name _;

    # Health check
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # CORS proxy — pass target URL as query param: /proxy?url=https://...
    location /proxy {
        # Extract the target URL from query string
        if ($arg_url = '') {
            return 400 '{"error":"Missing url parameter"}';
        }

        # CORS headers — allow any origin
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        add_header 'Access-Control-Max-Age' '86400' always;

        # Handle preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type';
            add_header 'Access-Control-Max-Age' '86400';
            add_header 'Content-Length' '0';
            add_header 'Content-Type' 'text/plain';
            return 204;
        }

        # Proxy the request
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        proxy_pass $arg_url;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header User-Agent 'KytranNews/1.0';
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
