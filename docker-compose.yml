    name: archie_engine_data
  archie_engine_workspace:
    driver: local
    name: archie_engine_workspace
  archie_engine_platform_workspace:
    driver: local
    name: archie_engine_platform_workspace
  codex_terminal_home:
    driver: local
  codex_terminal_work:
    driver: local
  comfyui_user:
    driver: local
    name: archie_comfyui_user
  comfyui_input:
    driver: local
    name: archie_comfyui_input
  comfyui_output:
    driver: local
