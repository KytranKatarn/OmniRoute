services:
  # PostgreSQL Database (with pgvector for semantic embeddings)
  archie_database:
    image: pgvector/pgvector:pg16
    container_name: archie_database
    restart: unless-stopped
    # Docker defaults /dev/shm to 64MB. Postgres allocates dynamic shared memory there for
    # parallel query workers and parallel index builds, so at the default a REINDEX or a large
    # parallel scan fails with "could not resize shared memory segment". The sandbox hit exactly
    # that during a full pg_restore (#5081) — production runs the same 64MB default and has only
    # avoided it because normal OLTP traffic never needs DSM at that scale. Raised so the
    # REINDEX DATABASE that #5082 requires can actually run.
    shm_size: 1gb
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /var/run/postgresql:size=16m
      - /var/log:size=64m
    mem_limit: 8g
    cpus: 2.0
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      TZ: America/Toronto
      POSTGRES_USER: archie
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: archie
      # Allow all connections with password auth (pg_hba.conf equivalent)
      POSTGRES_HOST_AUTH_METHOD: md5
    secrets:
      - db_password
    volumes:
      - archie_db:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d:ro
    ports:
      - "192.168.1.200:5432:5432"  # Local network access for remote nodes
      - "100.64.0.4:5432:5432"      # Mesh access for VPS modules (#2142 wtf-db move)
    networks:
      - archie_internal
    # Entrypoint wrapper removes stale postmaster.pid left by a power cut before
    # PostgreSQL starts — without this, PID collision causes exit 255 on reboot.
    entrypoint: ["/bin/bash", "-c", "rm -f /var/lib/postgresql/data/postmaster.pid && exec /usr/local/bin/docker-entrypoint.sh \"$@\"", "--"]
    command: ["postgres", "-c", "listen_addresses=*", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archie -d archie"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # A.R.C.H.I.E. Platform
  archie_platform:
    build: ./platform_v2
    container_name: archie_platform
    # --workers bumped 1 → 4 once Path C (PR #511) moved APScheduler into
    # the archie_scheduler sidecar. Only the sidecar holds the singleton
    # advisory lock, so multiple gunicorn workers cannot double-fire jobs.
    # Telegram fcntl lock is already worker-safe (LOCK_NB; first worker wins,
    # others fall through). mem_limit raised 4g → 8g to fit 4 workers each
    # ~1.5GB RSS without --preload (avoiding the Telegram daemon-thread fork
    # gotcha that comes with shared imports).
    command: ["gunicorn", "--bind", "0.0.0.0:3000", "--workers", "4", "--threads", "8", "--timeout", "600", "app:app"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /var/run:size=16m
      - /var/log:size=128m
      - /root/.cache:size=1g,exec
      - /root/.local:size=256m     # gunicorn + pip user-install path (read_only rootfs)
      - /root/.gunicorn:size=8m    # gunicorn control socket (avoids EROFS on /root)
      - /mnt/archie_brain/logs:size=64m
    mem_limit: 8g  # bumped from 4g for --workers 4 (each worker ~1.5GB RSS)
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    cpus: 4.0
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - SYS_PTRACE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    env_file:
      - .env
    environment:
      TZ: America/Toronto
      PYTHONPATH: /mnt/archie_brain
      NODE_CLIENT_DIR: /mnt/archie_brain/node_client
      SECRET_KEY: ${SECRET_KEY}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      FLASK_ENV: production
      DB_HOST: archie_database
      DB_PORT: 5432
      DB_NAME: archie
      DB_USER: archie
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_PASSWORD: ""  # Cleared — use Docker secret via DB_PASSWORD_FILE
      # Shared secret for the Claude CLI proxy on the host (:7682). A POST there runs
      # `claude -p --dangerously-skip-permissions` as the host user, so it is gated on
      # this header; the proxy FAILS CLOSED (503) when it is unset. Set it in BOTH .env
      # files, then restart claude-proxy.service BEFORE these containers.
      CLAUDE_PROXY_TOKEN: ${CLAUDE_PROXY_TOKEN}
      OLLAMA_PRIMARY: ${OLLAMA_PRIMARY}
      CODE_SERVER_URL: ${CODE_SERVER_URL}
      OLLAMA_HOST: ${OLLAMA_PRIMARY}
      HOST_IP: "192.168.1.200"  # Host machine IP for System Operations module
      HOSTINGER_API_KEY: ${HOSTINGER_API_KEY:-}
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
      # Path C activation: scheduler runs in archie_scheduler sidecar.
      # See decision_id 558. Set to "1" to bring scheduling back into
      # this container (requires stopping the sidecar first).
      ARCHIE_RUN_SCHEDULER: "0"
      HOSTINGER_DOMAIN: ${HOSTINGER_DOMAIN:-kytranempowerment.com}
      HA_URL: ${HA_URL:-http://192.168.1.200:8123}
      HA_API_TOKEN: ${HA_API_TOKEN:-}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-hub}
      OLLAMA_MODELS: /mnt/llm_drive/ollama/models
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      COMFYUI_HOST: ${COMFYUI_HOST:-http://172.27.0.11:8188}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-KytranKatarn}
    extra_hosts:
      - "host.docker.internal:192.168.1.200"
    secrets:
      - db_password
      - stripe_secret_key
      - stripe_webhook_secret
      - stripe_publishable_key
    volumes:
      # Mount ai-bridge into container (rw for self-improvement deployments)
      - ./ai_bridge:/mnt/archie_brain/ai_bridge:rw
      # Mount documentation (rw for self-improvement deployments)
      - ./docs:/mnt/archie_brain/docs:rw
      # Mount platform code (for development)
      - ./platform_v2:/app:rw
      - ./backups:/backups
      # Mount external USB backup storage
      - /mnt/external-backup:/mnt/external-backup:rw
      # Mount data2 drive (media/backup storage — required by Backup Manager)
      - /mnt/data2:/mnt/data2:rw
      # Mount conversation logs for Claude Code hook capture
      - ./conversation_logs:/mnt/archie_brain/conversation_logs:rw
      # Mount Docker socket for sandbox management
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount sandbox compose file
      - ./docker-compose.sandbox.yml:/mnt/archie_brain/docker-compose.sandbox.yml:ro
      # staging compose + sandbox worktree — self-heal deploy gate (#4930)
      - ./docker-compose.staging.yml:/mnt/archie_brain/docker-compose.staging.yml:ro
      - /mnt/archie_sandbox:/mnt/archie_sandbox:rw
      # Additional mounts for full backup support (rw for self-improvement)
      - ./database/migrations:/mnt/archie_brain/database/migrations:rw
      # Host monitor data file (from host_monitor.py running on host)
      - ./host_monitor_data.json:/mnt/archie_brain/host_monitor_data.json:ro
      # Fleet app catalog (YAML entries for KSO app store)
      - ./fleet/catalog:/mnt/archie_brain/fleet/catalog:ro
      # Fleet SSL cert storage (wildcard cert for *.kytranempowerment.com)
      - /opt/archie-fleet/certs:/opt/archie-fleet/certs:rw
      - ./bandwidth_history.json:/mnt/archie_brain/bandwidth_history.json:ro
      - ./scripts:/mnt/archie_brain/scripts:rw
      - ./nginx:/mnt/archie_brain/nginx:ro
      - ./docker-compose.yml:/mnt/archie_brain/docker-compose.yml:ro
      # Mount Goose orchestration directory (Phase 55)
      - ./goose:/mnt/archie_brain/goose:rw
      # Mount .mcp.json, CLAUDE.md, and .claude/rules for Dev HQ + Skill Sync
      - ./.mcp.json:/mnt/archie_brain/.mcp.json:ro
      - ./CLAUDE.md:/mnt/archie_brain/CLAUDE.md:ro
      - ./.claude/rules:/mnt/archie_brain/.claude/rules:rw
      - ./.claude/skills:/mnt/archie_brain/.claude/skills:rw
      # commands: read by the Living Platform Registry collector (#5230/#5242).
      # Without it the nightly job sees 257 of 275 skills and can NEVER detect a
      # slash-command being added or removed — a deleted one would sit 'present'
      # forever with the disappearance alarm silent. READ-ONLY on purpose: rules/
      # is :rw because Skill Sync writes learned-skills.md into it, but nothing on
      # the platform authors slash-commands, so this stays least-privilege.
      # MUST stay in step with the archie_scheduler block below (KB #263303).
      - ./.claude/commands:/mnt/archie_brain/.claude/commands:ro
      # Mount .git for git operations (CodeRabbit Local Git management)
      - ./.git:/mnt/archie_brain/.git:rw
      # GitHub repo clones — ARCHIE's local copies for reading/modifying/sharing
      - ./repos:/mnt/archie_brain/repos:rw
      - ./secrets:/mnt/archie_brain/secrets:ro
      # Mount node client package for remote node deployment
      - ./node_client:/mnt/archie_brain/node_client:ro
      # Website and standalone product sources (Code Health scanning)
      - ./website:/mnt/archie_brain/website:ro
      # Translation bundle export (#2089) — nested :rw overrides on data/
      # only so _export_bundle can write translations.json while the rest of
      # each site stays :ro for Code Health scan boundary integrity.
      - ./website/kytranempowerment.com/data:/mnt/archie_brain/website/kytranempowerment.com/data:rw
      - ./website/creed-ai.org/data:/mnt/archie_brain/website/creed-ai.org/data:rw
      # Portrait thumbnails — :rw so approve_canonical() writes directly to repo.
      # Hostinger deploy then picks up the complete set via the deploy-website skill.
      - ./website/kytranempowerment.com/assets/portraits:/mnt/archie_brain/website/kytranempowerment.com/assets/portraits:rw
      - ./website/creed-ai.org/assets/portraits:/mnt/archie_brain/website/creed-ai.org/assets/portraits:rw
      - ./kytran-server-manager:/mnt/archie_brain/kytran-server-manager:ro
      # Hub-resident standalone product source (read-only for Code Health
      # scanner). These products live in the hub repo but outside the
      # /mnt/standalone tree, so the resolver's fallback candidate
      # /mnt/archie_brain/<dir> needs the matching bind to find them.
      - ./archie-comms:/mnt/archie_brain/archie-comms:ro
      - ./what-the-fact:/mnt/archie_brain/what-the-fact:ro
      # kbs was missing from this list, so backup_standalone tarred a path that does not
      # exist in-container: all 16 kbs backups were 0 files / 0 bytes (measured 2026-07-20).
      # Must be THIS path — /mnt/standalone/kytran-business-suite is a DIFFERENT directory
      # (different inode) stuck at the v1.0.0 initial release from Apr 14 (754 files) vs
      # the live 1730. Binding that one would archive stale code and report success.
      # Mirrored in archie_scheduler on purpose — volume drift there silently degrades
      # scheduled work (KB #263303).
      - ./kytran-business-suite:/mnt/archie_brain/kytran-business-suite:ro
      - ./standalone/media_hub:/mnt/archie_brain/standalone/media_hub:ro
      # Host command queue (shared with host_monitor.py for storage operations)
      - ./host_commands:/mnt/archie_brain/host_commands:rw
      # Migration compose files for Docker stack management
      - ./migrations:/mnt/archie_brain/migrations:ro
      # Docker stacks directory for System Operations stack management
      - /mnt/stacks:/mnt/stacks:ro
      # Nagios monitoring data (status.dat) for health integration
      - monitoring_nagios_data:/opt/nagios-data:ro
      # SSH key for W.A.R.D.E.N. warden_wtf_rsync job (hub→VPS code sync)
      - /home/kytran/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      # Host config files for STIG compliance scanning (read-only)
      - /etc/ssh:/etc/ssh:ro
      - /etc/docker:/etc/docker:ro
      - /etc/security:/etc/security:ro
      - /etc/pam.d:/etc/pam.d:ro
      - /etc/audit:/etc/audit:ro
      - /etc/login.defs:/etc/login.defs:ro
      - /etc/modprobe.d:/etc/modprobe.d:ro
      - /etc/sysctl.conf:/etc/sysctl.conf:ro
      - /etc/sysctl.d:/etc/sysctl.d:ro
      - /etc/rsyslog.conf:/host/etc/rsyslog.conf:ro
      - /etc/rsyslog.d:/host/etc/rsyslog.d:ro
      - /etc/crontab:/host/etc/crontab:ro
      - /etc/sudoers.d:/host/etc/sudoers.d:ro
      - /etc/sudoers:/host/etc/sudoers:ro
      - /etc/systemd/journald.conf:/host/etc/journald.conf:ro
      - /proc/1/mounts:/host/proc/mounts:ro
      - /etc/ufw:/etc/ufw:ro
      # Media stack configs for Media Hub service discovery (API keys, etc.)
      - /mnt/Plex/config:/mnt/Plex/config:ro
      # Ollama model storage on LLM SSD
      - /mnt/llm_drive/ollama/models:/mnt/llm_drive/ollama/models:ro
      # Google Drive credentials for cloud backup (rw: OAuth token written at runtime)
      - ./credentials:/app/credentials:rw
      # Browser automation screenshots (Project Autonomy Phase 4)
      - ./platform_v2/static/screenshots:/app/static/screenshots:rw
      # ── Standalone Products + Websites (read-only for Code Health scanner) ──
      - /mnt/standalone:/mnt/standalone:ro
      # Translation bundle export (#2089) — nested :rw overrides on data/ only
      # so _export_bundle can write translations.json for standalone sites.
      - /mnt/standalone/websites/what-the-fact.com/data:/mnt/standalone/websites/what-the-fact.com/data:rw
      - ./stalwart-mail:/mnt/archie_brain/stalwart-mail:ro
      # OmniRoute's own call log, READ-ONLY (#6763). services/omniroute_telemetry.py
      # mirrors call_logs -> task_execution_log so the codex/opencode/host-CLI token
      # spend is visible in Token Economy + A.R.M.A.D.A. instead of invisible: those
      # three call the gateway over HTTP and never touch the DHQ dispatcher, so
      # nothing was logging them at all (measured: a 17,399-token run wrote 0 rows).
      # :ro is load-bearing — this is a third-party container's live database and we
      # are a reader of it, never a writer. The collector additionally opens it with
      # immutable=1 so it cannot touch the -wal/-shm sidecars.
      - omniroute_data:/omniroute-data:ro
    ports:
      - "3000:3000"
    networks:
      - archie_internal
      - network_tools_ext
    depends_on:
      archie_database:
        condition: service_healthy
      archie_ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # A.R.C.H.I.E. Scheduler — APScheduler sidecar (Path C, decision_id 557).
  # Runs the same code as archie_platform but with ARCHIE_RUN_SCHEDULER=1
  # (and ARCHIE_RUN_TELEGRAM=0). Owns all 117 scheduled jobs and the
  # AgentLoop. Disabled by default via `profiles: [scheduler]` so this PR
  # is a no-op until activated. Activation:
  #   1) edit archie_platform's environment to set ARCHIE_RUN_SCHEDULER=0
  #   2) docker compose --profile scheduler up -d archie_scheduler
  #   3) verify scheduler_heartbeat row appears every 30s
  #   4) follow-up PR removes `profiles:` and bumps platform --workers
  archie_scheduler:
    profiles: ["scheduler"]
    build: ./platform_v2
    container_name: archie_scheduler
    command: ["python3", "scheduler_daemon.py"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /var/run:size=16m
      - /var/log:size=128m
      - /root/.cache:size=1g,exec
      - /root/.local:size=256m     # pip user-install path (read_only rootfs needs this)
      - /mnt/archie_brain/logs:size=64m
    mem_limit: 2g
    cpus: 2.0
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    env_file:
      - .env
    environment:
      TZ: America/Toronto
      PYTHONPATH: /mnt/archie_brain
      NODE_CLIENT_DIR: /mnt/archie_brain/node_client
      ARCHIE_RUN_SCHEDULER: "1"
      ARCHIE_RUN_TELEGRAM: "0"
      # Shared secret for the Claude CLI proxy on the host (:7682). A POST there runs
      # `claude -p --dangerously-skip-permissions` as the host user, so it is gated on
      # this header; the proxy FAILS CLOSED (503) when it is unset. Set it in BOTH .env
      # files, then restart claude-proxy.service BEFORE these containers.
      CLAUDE_PROXY_TOKEN: ${CLAUDE_PROXY_TOKEN}
      SECRET_KEY: ${SECRET_KEY}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      FLASK_ENV: production
      DB_HOST: archie_database
      DB_PORT: 5432
      DB_NAME: archie
      DB_USER: archie
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_PASSWORD: ""
      OLLAMA_PRIMARY: ${OLLAMA_PRIMARY}
      CODE_SERVER_URL: ${CODE_SERVER_URL}
      OLLAMA_HOST: ${OLLAMA_PRIMARY}
      HOST_IP: "192.168.1.200"
      HOSTINGER_API_KEY: ${HOSTINGER_API_KEY:-}
      HOSTINGER_DOMAIN: ${HOSTINGER_DOMAIN:-kytranempowerment.com}
      HA_URL: ${HA_URL:-http://192.168.1.200:8123}
      HA_API_TOKEN: ${HA_API_TOKEN:-}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-hub}
      OLLAMA_MODELS: /mnt/llm_drive/ollama/models
      # Required so run_triage() (scheduled in this sidecar) can escalate
      # director_reports inbox items to Telegram. ARCHIE_RUN_TELEGRAM=0 above
      # stays — that disables the long-poll bot daemon, not push sends.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      COMFYUI_HOST: ${COMFYUI_HOST:-http://172.27.0.11:8188}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-KytranKatarn}
    extra_hosts:
      - "host.docker.internal:192.168.1.200"
    secrets:
      - db_password
      - stripe_secret_key
      - stripe_webhook_secret
      - stripe_publishable_key
    volumes:
      - ./ai_bridge:/mnt/archie_brain/ai_bridge:rw
      - ./docs:/mnt/archie_brain/docs:rw
      - ./platform_v2:/app:rw
      - ./backups:/backups
      - /mnt/external-backup:/mnt/external-backup:rw
      - /mnt/data2:/mnt/data2:rw
      - ./conversation_logs:/mnt/archie_brain/conversation_logs:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.sandbox.yml:/mnt/archie_brain/docker-compose.sandbox.yml:ro
      # staging compose + sandbox worktree — self-heal deploy gate (#4930)
      - ./docker-compose.staging.yml:/mnt/archie_brain/docker-compose.staging.yml:ro
      - /mnt/archie_sandbox:/mnt/archie_sandbox:rw
      - ./database/migrations:/mnt/archie_brain/database/migrations:rw
      - ./host_monitor_data.json:/mnt/archie_brain/host_monitor_data.json:ro
      - ./fleet/catalog:/mnt/archie_brain/fleet/catalog:ro
      - /opt/archie-fleet/certs:/opt/archie-fleet/certs:rw
      - ./bandwidth_history.json:/mnt/archie_brain/bandwidth_history.json:ro
      - ./scripts:/mnt/archie_brain/scripts:rw
      - ./nginx:/mnt/archie_brain/nginx:ro
      - ./docker-compose.yml:/mnt/archie_brain/docker-compose.yml:ro
      - ./goose:/mnt/archie_brain/goose:rw
      - ./.mcp.json:/mnt/archie_brain/.mcp.json:ro
      - ./CLAUDE.md:/mnt/archie_brain/CLAUDE.md:ro
      - ./.claude/rules:/mnt/archie_brain/.claude/rules:rw
      - ./.claude/skills:/mnt/archie_brain/.claude/skills:rw
      # MUST mirror archie_platform above — the scheduler is where the nightly
      # platform_registry_collect job actually runs, so this is the mount that
      # matters most (#5242). A scheduler whose volumes drift from the platform's
      # degrades silently: a missing /mnt/standalone:ro once cut Code Health by
      # 35% with no error at all (KB #263303).
      - ./.claude/commands:/mnt/archie_brain/.claude/commands:ro
      - ./.git:/mnt/archie_brain/.git:rw
      - ./repos:/mnt/archie_brain/repos:rw
      - ./secrets:/mnt/archie_brain/secrets:ro
      - ./node_client:/mnt/archie_brain/node_client:ro
      - ./website:/mnt/archie_brain/website:ro
      - ./website/kytranempowerment.com/data:/mnt/archie_brain/website/kytranempowerment.com/data:rw
      - ./website/creed-ai.org/data:/mnt/archie_brain/website/creed-ai.org/data:rw
      - ./website/kytranempowerment.com/assets/portraits:/mnt/archie_brain/website/kytranempowerment.com/assets/portraits:rw
      - ./website/creed-ai.org/assets/portraits:/mnt/archie_brain/website/creed-ai.org/assets/portraits:rw
      - ./kytran-server-manager:/mnt/archie_brain/kytran-server-manager:ro
      - ./host_commands:/mnt/archie_brain/host_commands:rw
      - ./migrations:/mnt/archie_brain/migrations:ro
      - /mnt/stacks:/mnt/stacks:ro
      - monitoring_nagios_data:/opt/nagios-data:ro
      # SSH key for W.A.R.D.E.N. warden_wtf_rsync job (hub→VPS code sync)
      - /home/kytran/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - /etc/ssh:/etc/ssh:ro
      - /etc/docker:/etc/docker:ro
      - /etc/security:/etc/security:ro
      - /etc/pam.d:/etc/pam.d:ro
      - /etc/audit:/etc/audit:ro
      - /etc/login.defs:/etc/login.defs:ro
      - /etc/modprobe.d:/etc/modprobe.d:ro
      - /etc/sysctl.conf:/etc/sysctl.conf:ro
      - /etc/sysctl.d:/etc/sysctl.d:ro
      - /etc/rsyslog.conf:/host/etc/rsyslog.conf:ro
      - /etc/rsyslog.d:/host/etc/rsyslog.d:ro
      - /etc/crontab:/host/etc/crontab:ro
      - /etc/sudoers.d:/host/etc/sudoers.d:ro
      - /etc/sudoers:/host/etc/sudoers:ro
      - /etc/systemd/journald.conf:/host/etc/journald.conf:ro
      - /proc/1/mounts:/host/proc/mounts:ro
      - /etc/ufw:/etc/ufw:ro
      # Media stack configs for Media Hub service discovery (mirrors platform)
      - /mnt/Plex/config:/mnt/Plex/config:ro
      # Ollama model storage on LLM SSD (read-only — sidecar jobs may inspect
      # model registry but never mutate files)
      - /mnt/llm_drive/ollama/models:/mnt/llm_drive/ollama/models:ro
      # Google OAuth credentials (rw: token refresh writes back at runtime)
      - ./credentials:/app/credentials:rw
      # Browser automation screenshots — scheduled jobs that screenshot pages
      # write here; mirrors archie_platform mount.
      - ./platform_v2/static/screenshots:/app/static/screenshots:rw
      # Hub-resident standalone product source (read-only for Code Health
      # scanner). Mirrors archie_platform; resolver finds these via the
      # /mnt/archie_brain/<dir> + /mnt/archie_brain/standalone/<dir>
      # fallback candidates in code_metrics_service._resolve_standalone_path.
      - ./archie-comms:/mnt/archie_brain/archie-comms:ro
      - ./what-the-fact:/mnt/archie_brain/what-the-fact:ro
      # kbs was missing from this list, so backup_standalone tarred a path that does not
      # exist in-container: all 16 kbs backups were 0 files / 0 bytes (measured 2026-07-20).
      # Must be THIS path — /mnt/standalone/kytran-business-suite is a DIFFERENT directory
      # (different inode) stuck at the v1.0.0 initial release from Apr 14 (754 files) vs
      # the live 1730. Binding that one would archive stale code and report success.
      # Mirrored in archie_scheduler on purpose — volume drift there silently degrades
      # scheduled work (KB #263303).
      - ./kytran-business-suite:/mnt/archie_brain/kytran-business-suite:ro
      - ./standalone/media_hub:/mnt/archie_brain/standalone/media_hub:ro
      # ── Standalone Products + Websites (read-only for Code Health scanner) ──
      # Mirrors archie_platform line 220. Without this parent mount, scheduled
      # Code Health scans (jobs #40 + #55) silently miss every standalone product
      # and report ~35% fewer files / ~18% fewer lines than reality.
      - /mnt/standalone:/mnt/standalone:ro
      # Translation bundle export (#2089) — nested :rw override on data/ only
      # so _export_bundle can write translations.json for the standalone site.
      - /mnt/standalone/websites/what-the-fact.com/data:/mnt/standalone/websites/what-the-fact.com/data:rw
      - ./stalwart-mail:/mnt/archie_brain/stalwart-mail:ro
      # OmniRoute call log, READ-ONLY. MUST mirror archie_platform: the
      # omniroute_telemetry JOB runs HERE, and a volume that exists on the platform
      # but not the scheduler is a documented way to silently degrade scheduled work
      # (KB #263303 — a missing mount once dropped Code Health by 35% with no error).
      - omniroute_data:/omniroute-data:ro
    networks:
      - archie_internal
      - network_tools_ext
    depends_on:
      archie_database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os, psycopg2; c=psycopg2.connect(host='archie_database', dbname='archie', user='archie', password=open('/run/secrets/db_password').read().strip()); cur=c.cursor(); cur.execute(\\\"SELECT EXTRACT(EPOCH FROM (now()-ts))::int FROM scheduler_heartbeat ORDER BY ts DESC LIMIT 1\\\"); r=cur.fetchone(); assert r and r[0] < 120, 'no recent heartbeat'\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  # A.R.C.H.I.E. Comms — Independent communication layer (Decision #442)
  # Survives platform crashes. Voice, Telegram, chat UI, watchdog.
  archie_comms:
    build:
      context: ./archie-comms
      dockerfile: Dockerfile
    container_name: archie_comms
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - TZ=America/Toronto
      - DB_HOST=archie_database
      - DB_NAME=archie
      - DB_USER=archie
      - ARCHIE_VOICE_MODEL=dolphin3-8k:latest
      - PLATFORM_URL=http://archie_platform:3000
      # Required for the chat→DHQ delegation hand-off (/api/internal/delegation/submit)
      # and the repair-count poll (/api/internal/repair/count). Was missing → empty
      # Bearer → recurring 401. Sibling services set this too (see L1020+).
      # #6657: comms' OWN scoped key (dhq:chat, coo, mail, approvals, delegation, repair:read).
      # Falls back to the legacy flat key until INTERNAL_API_KEY_ARCHIE_COMMS is set in .env.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY_ARCHIE_COMMS:-${INTERNAL_API_KEY}}
      # Same token the engine requires on its ws handshake (#6657) — comms proxies the
      # cockpit's engine status/message calls over ws://archie_engine:9090.
      - ENGINE_WS_TOKEN=${ENGINE_WS_TOKEN}
      - CLAUDE_PROXY_URL=http://host.docker.internal:7682
      # Shared secret for the Claude CLI proxy on the host (:7682). A POST there runs
      # `claude -p --dangerously-skip-permissions` as the host user, so it is gated on
      # this header; the proxy FAILS CLOSED (503) when it is unset. Set it in BOTH .env
      # files, then restart claude-proxy.service BEFORE these containers.
      - CLAUDE_PROXY_TOKEN=${CLAUDE_PROXY_TOKEN}
      - COMMS_PORT=3002
      - SECRET_KEY=${SECRET_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=claude-sonnet-4-20250514
      - KYTRAN_CLIENT_ID=archie-comms
      - KYTRAN_CLIENT_SECRET=${KYTRAN_CLIENT_SECRET}
      # Padlock cockpit (2026-06-17, #4287): browser-facing OAuth over the PUBLIC https
      # hostnames. Mesh clients resolve archie.*/platform.* → hub 100.64.0.4 via Headscale
      # MagicDNS extra_records (client-side, no :53-over-mesh dependency); NPM serves both with
      # real Let's Encrypt certs on 100.64.0.4:443 → padlock, no IP, no port. Server-side
      # token/userinfo exchange stays docker-internal (archie_platform:3000). Cookie = host-only
      # + Secure (https): login + callback are both on archie.kytranempowerment.com, so the OAuth
      # state/PKCE survives (the platform-authorize hop doesn't need the comms cookie). The
      # oauth_clients.archie-comms.redirect_uri DB row must match KYTRAN_REDIRECT_URI.
      # Fallback (page only): http://archie-starbase.mesh.archie:3002 / http://100.64.0.4:3002.
      - KYTRAN_AUTH_URL=https://platform.kytranempowerment.com
      - KYTRAN_AUTH_INTERNAL_URL=http://archie_platform:3000
      - KYTRAN_REDIRECT_URI=https://archie.kytranempowerment.com/auth/kytran/callback
      # #5959 — LAN-origin OAuth client, so the cockpit can be browser-tested from
      # ON the hub. AdGuard split-horizon points archie.kytranempowerment.com at
      # 192.168.1.200, which has no :443 listener (Beacon is the front door), so the
      # SSO hop cannot complete locally. kytran_auth picks this client ONLY when the
      # request ARRIVES on a private/mesh origin — keyed on the request host, never a
      # flag, so the public hostname can never take it. Unset these and behaviour is
      # byte-identical to before. oauth_clients row: archie-comms-lan (id 27).
      - KYTRAN_LAN_CLIENT_ID=${KYTRAN_LAN_CLIENT_ID:-}
      - KYTRAN_LAN_CLIENT_SECRET=${KYTRAN_LAN_CLIENT_SECRET:-}
      - KYTRAN_LAN_REDIRECT_URI=${KYTRAN_LAN_REDIRECT_URI:-}
      # Secure=false: comms sits behind NPM (TLS at the edge) and sees the request as http
      # with no ProxyFix, so a Secure cookie is dropped on the post-login redirect hop → the
      # session is lost → login loops (SSO accepted repeatedly). The padlock comes from NPM's
      # cert, not this flag; the cookie still only travels the WireGuard mesh. (Proper fix:
      # add ProxyFix to trust X-Forwarded-Proto, then this can return to true.)
      - COMMS_COOKIE_SECURE=false
      - ARCHIE_COMMS_SERVICE_TOKEN=${ARCHIE_COMMS_SERVICE_TOKEN}
      - CLAUDE_CLIENT_ID=claude-terminal
      - CLAUDE_CLIENT_SECRET=${CLAUDE_CLIENT_SECRET}
      - CLAUDE_REDIRECT_URI=https://claude.kytranempowerment.com/auth/kytran/callback
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3002:3002"
    networks:
      - archie_internal
    depends_on:
      archie_database:
        condition: service_healthy
    secrets:
      - db_password
      # ⚠️ Do NOT add uid/gid/mode here. Those keys are SWARM-ONLY; in plain
      # `docker compose` a secret is a bind-mount of the host file and they are
      # silently ignored — measured 2026-09-11, the mount stayed 1000:1000 0600.
      # Readability is set by the HOST file's owner, which must be the container
      # user (999 archie). See secrets/archie-comms/.
      - comms_kytran_client_secret
      - comms_claude_client_secret
      - comms_codex_client_secret
      - comms_tui_client_secret
      - comms_opencode_client_secret
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ARCHIE Engine — the "building machine" coding daemon (hub-connected client).
  # Source repo: /mnt/standalone/archie-code (public archie-code). Reconnects to
  # the hub via the internal delegation API (no fleet-node registration).
  archie_engine:
    build:
      context: /mnt/standalone/archie-code
      dockerfile: Dockerfile
    container_name: archie_engine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      - TZ=America/Toronto
      # Mesh IP (Headscale) per the cluster mandate — verified reachable from
      # this container. Dispatch routes through Department HQ via the internal
      # delegation surface (submit -> delegate_task_worker -> department_dispatcher).
      - ARCHIE_HUB_URL=http://100.64.0.4:3000
      - ARCHIE_HUB_API_KEY=${INTERNAL_API_KEY_ARCHIE_ENGINE:-${INTERNAL_API_KEY}}
      # Also expose under the literal name so the engine's INTERNAL_API_KEY-reading
      # paths work (e.g. the engine.py KB-search direct-API fallback when the hub
      # connector is down). Same value as ARCHIE_HUB_API_KEY — the platform's
      # @_require_internal_key bearer.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY_ARCHIE_ENGINE:-${INTERNAL_API_KEY}}
      # Bearer required on EVERY ws://archie_engine:9090 handshake (#6657). The socket
      # is reachable from every container on archie_internal, and its file/shell surface
      # was open to all of them. Independent of INTERNAL_API_KEY on purpose; env-only
      # (no /data key file). Rotate: edit .env → docker compose up -d --no-deps
      # archie_engine archie_comms (restart does NOT re-read env_file, KB #268829).
      - ENGINE_WS_TOKEN=${ENGINE_WS_TOKEN}
      - OLLAMA_HOST=http://100.64.0.4:11434
      - ARCHIE_WS_HOST=0.0.0.0
      - ARCHIE_DATA_DIR=/data
      # GitHub token so the build loop's github_ops.pr_create can open PRs.
      # Fine-grained PAT scoped to archie-code AND archie-platform (engine->platform
      # expansion, #380). Engine-authored PRs are gated from auto-merge platform-side
      # (branch "engine/" -> human merge only); the engine itself never merges.
      - ARCHIE_GITHUB_TOKEN=${GITHUB_TOKEN}
      # Build/test workspace provisioning (#4258). The entrypoint clones archie-code
      # into the writable /workspace volume and points git config at /data (HOME and
      # the rootfs are read-only). The build loop then branches -> edits -> tests
      # (pytest, baked into the image) -> pushes -> opens a PR, all in /workspace.
      - HOME=/data
      - GIT_CONFIG_GLOBAL=/data/.gitconfig
      - ARCHIE_ENGINE_WORKSPACE=/workspace
      - ARCHIE_ENGINE_REPO=https://github.com/KytranKatarn/archie-code.git
      # Hermetic auto-PR test gate (#4258): the build loop gates on the offline
      # tests/ suite (build-loop + tools + scope-guard, green in-container). The
      # archie_engine/tests/* integration tests need a live hub, so the full
      # `pytest -q` (the EngineConfig default) can never gate an offline loop.
      - ARCHIE_ENGINE_TEST_COMMAND=python -m pytest -q tests/
      # Engine->platform expansion (#380): the entrypoint also clones archie-platform
      # into the writable /workspace-platform volume so the engine can build fixes for
      # the platform's Applications/Concepts modules (PLATFORM_SCOPE) and open PRs vs
      # archie-platform. Platform builds use a services-free compile gate (no DB/Ollama).
      - ARCHIE_PLATFORM_WORKSPACE=/workspace-platform
      - ARCHIE_PLATFORM_REPO=KytranKatarn/archie-platform
    # The engine's file/git/shell tools use Path.cwd() as their workspace.
    # Point cwd at an isolated, writable /workspace volume so it can do hands-on
    # coding WITHOUT touching the platform repo or host (read_only rootfs +
    # cap_drop ALL keep everything else off-limits).
    working_dir: /workspace
    volumes:
      - archie_engine_data:/data
      - archie_engine_workspace:/workspace
      - archie_engine_platform_workspace:/workspace-platform
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - archie_internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2"
    healthcheck:
      # Proper WS handshake (not a bare TCP poke) so the engine doesn't log a
      # handshake traceback on every probe.
      test: ["CMD", "python", "-c", "import asyncio,os,websockets\nasync def _():\n    async with websockets.connect('ws://127.0.0.1:9090', additional_headers={'Authorization': 'Bearer ' + os.environ.get('ENGINE_WS_TOKEN', '')}):\n        pass\nasyncio.run(_())"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Ollama LLM Engine (models on Samsung 840 SSD)
  archie_ollama:
    image: ollama/ollama:0.6.2
    container_name: archie_ollama
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=1g
    mem_limit: 96g
    cpus: 8.0
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - TZ=America/Toronto
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=13
      - OLLAMA_NUM_PARALLEL=4
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /mnt/llm_drive/ollama:/root/.ollama
      - /mnt/data2:/mnt/data2:ro
    # No host port binding — platform uses native Ollama via host.docker.internal:11434.
    # Removing the port binding eliminates the conflict with native Ollama on reboot
    # when compose tries to recreate this container. (#3756)
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ComfyUI — Advanced local image generation (SD, FLUX, LoRA, ControlNet)
  archie_comfyui:
    build: ./comfyui
    container_name: archie_comfyui
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /var/run:size=16m
      - /comfyui/temp:size=1g
      - /root/.local:size=256m
      # triton JIT cache — comfy_kitchen imports triton at startup, whose cache
      # manager os.makedirs('/root/.triton') before ComfyUI ever binds a port.
      # Under read_only:true that raised OSError 30 and the container could not
      # boot at all. Cache only (kernels recompile on start) — nothing to persist.
      # exec is REQUIRED: docker mounts tmpfs noexec by default, and triton
      # dlopen()s the cuda_utils.so it just compiled here — noexec turns that
      # into "failed to map segment from shared object".
      - /root/.triton:size=256m,exec
    mem_limit: 8g
    cpus: 2.0
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8188:8188"
    volumes:
      - /mnt/data2/comfyui/models:/comfyui/models
      - comfyui_output:/comfyui/output
      # Writable state under read_only:true. NAMED VOLUMES, not tmpfs — both hold
      # data that must survive a restart, and ComfyUI is stopped/started on every
      # idle cycle (comfyui_service.stop_if_idle), so tmpfs would wipe them constantly.
      #   /comfyui/user  — sqlite DB (comfy/cli_args.py database_default_path =
      #                    <root>/user/comfyui.db) + settings + comfyui_<port>.log.
      #                    Was: "Failed to initialize database ... unable to open
      #                    database file" on every boot.
      #   /comfyui/input — nodes_load_3d mkdir()s /comfyui/input/3d at import; under
      #                    read-only that raised "[Errno 30] Read-only file system:
      #                    '/comfyui/input/3d'" -> "IMPORT FAILED: nodes_load_3d.py".
      #                    Also where uploaded img2img source images land.
      # NOTE: the ./comfyui/workflows bind below targets a path INSIDE /comfyui/user.
      # Docker mounts by ascending destination depth, so the volume lands first and
      # the repo-tracked workflows bind still applies on top. Do not reorder.
      - comfyui_user:/comfyui/user
      - comfyui_input:/comfyui/input
      - ./platform_v2/static/media:/media
      - ./comfyui/workflows:/comfyui/user/default/workflows
      # Image lacks tzdata — bind-mount host zoneinfo so TZ env actually resolves.
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      - TZ=America/Toronto
      - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 3

  # archie_whisper — sovereign STT sidecar (COO Cockpit Slice 3).
  # faster-whisper 'base' on CPU (no GPU contention with the LLM/image workloads);
  # model preloaded/warm at boot. Reached by the platform at http://archie_whisper:8090
  # (Docker-internal only — audio never leaves the cluster).
  archie_whisper:
    build: ./whisper_service
    container_name: archie_whisper
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m
    volumes:
      - whisper_models:/models
    mem_limit: 3g
    cpus: 2.0
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
    environment:
      - WHISPER_MODEL=base
      - PORT=8090
      - HF_HOME=/models
      - TZ=America/Toronto
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

  # llama.cpp server — second LOCAL inference runtime (#5317 / ADR-019 pilot).
  # Serves qwen2.5:1.5b read-only STRAIGHT from Ollama's blob store (Ollama
  # blobs ARE GGUF files — zero duplication). Docker-internal only: reached by
  # the dispatcher at http://archie_llamacpp:8080, no host port. CPU-only by
  # design (never competes for the 8GB GPUs); --parallel 4 is the strategic
  # win over Ollama NUM_PARALLEL=1 (spike: x3.73 concurrency scaling, 24.2
  # tok/s single-stream, ~2s cold start, 330MB RSS). Routing is kill-switched
  # OFF in platform_settings (llamacpp:enabled) — with this container down or
  # unhealthy the dispatcher just falls through to Ollama. No healthcheck: the
  # image ships no python3/curl to probe with, and health here is advisory
  # anyway (failure = fallback, never an outage).
  archie_llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: archie_llamacpp
    restart: unless-stopped
    command: >
      -m /models/sha256-183715c435899236895da3869489cc30ac241476b4971a20285b1a462818a5b4
      --alias qwen2.5:1.5b
      --host 0.0.0.0 --port 8080 --parallel 4 -c 8192 --threads 8
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - /mnt/llm_drive/ollama/models/blobs:/models:ro
    mem_limit: 4g
    cpus: 8.0
    cap_drop:
      - ALL
    environment:
      - TZ=America/Toronto
    networks:
      - archie_internal
  # OmniRoute — self-hosted OpenAI-compatible AI gateway (#6653, master-command Phase 3).
  # A CONTRACTOR provider for the Agent Academy A/B comparison lane and the ask-first
  # cloud CODING lane. Deliberately NOT a roster dispatch path: escalation_mode stays
  # local_only, so nothing auto-escalates here — every call is an explicit selection.
  # The platform reaches it as http://omniroute:20128 on archie_internal. Pinned
  # release — 554 open issues on a 7-month-old repo means never :latest (which follows
  # the newest published SemVer, not git main).
  # Secrets (JWT/API-key/storage encryption/initial password) come from ROOT .env.
  # OMNIROUTE_MEMORY_MB: this deployment uses /v1/chat/completions only (short prompts),
  # not the /v1/responses coding-agent surface that needs 8-12 GB heap — 2 GB suffices.
  omniroute:
    image: diegosouzapw/omniroute:3.8.50
    container_name: omniroute
    ports:
      # Bound to the LAN interface specifically (not 0.0.0.0) — the dashboard gates behind
      # its own login (requireLogin=true, password set, verified live 2026-09-19), but an
      # automated security review flagged binding all-interfaces as unnecessarily broad, so
      # this scopes to the one interface the owner actually reaches (same host+port already
      # used for archie_platform's own dashboard traffic).
      # Widened from 127.0.0.1-only (2026-09-19, owner request — the loopback-only bind made
      # the dashboard reachable only via SSH tunnel, which wasn't workable day-to-day).
      # Host codex CLI keeps using this same published port (was already its reason for
      # existing); the internal lanes are unaffected either way — they use Docker DNS
      # (omniroute:20128). See the read_only note below for why this does not reopen the
      # next 16.3.1 CVE — that reasoning was already independent of network exposure
      # (wrong platform + 404 endpoints), not contingent on the loopback-only bind.
      - "192.168.1.200:20128:20128"
    restart: unless-stopped
    stop_grace_period: 40s
    mem_limit: 4g
    cpus: 2.0
    # #6664 hardening. Compliance baseline (compliance-standards.md) is read_only on every
    # container; this one is also the gateway that will hold PAID upstream keys once Phase 3b
    # lands, and it ships a CRITICAL-rated `next` 16.3.1 (16.0.0-16.3.2, fixed in 16.3.5) for
    # which NO fixed upstream release exists — 3.8.50 IS latest; `main`/`next` are dev branches.
    # The RCE is not reachable here (Linux, so the windows-server path is N/A; /_next/image and
    # /_next/static both 404 on this non-`-web` variant) but read_only bounds the blast radius
    # if a future image variant does serve it.
    #
    # ⚠️ CORRECTED 2026-09-14: this reasoning used to include "the port is unpublished" as one
    # of the grounds. It is now published on LOOPBACK ONLY (127.0.0.1:20128, see ports: below)
    # so the HOST codex CLI can reach the gateway — the lanes use Docker DNS (omniroute:20128)
    # and were never affected. The two PRIMARY grounds above (wrong platform, endpoints 404)
    # are untouched and still carry the argument; loopback publishing is the same exposure the
    # MCP gateway already accepts at 127.0.0.1:17800. It is NOT network-reachable.
    #
    # The alternative was pinning a 172.x bridge IP in the host config, which ai-bridge.md
    # documents as a trap: ComfyUI's pinned .11 was actually .21 after a recreate, because
    # bridge IPs are reassigned per-recreate. A loopback publish is stable; an IP is not.
    #
    # ⚠️ The task's premise was STALE and applying read_only on it would have broken the
    # gateway: it recorded `docker diff omniroute` = ZERO lines at boot on 2026-09-09. Measured
    # 2026-09-12 it is 421 lines. The container genuinely writes OUTSIDE its named volume, so
    # each path below is required, not decorative:
    #   /app/.build/next/cache  Next fetch-cache + image cache (the ONLY written part of
    #                           /app/.build — the other 1.2 GB there is baked image content,
    #                           so tmpfs the cache subdir, never /app/.build itself)
    #   /home/node/.npm         npm _cacache, 64 MB and 410 of the 421 diff lines
    #   /tmp                    scratch
    # Everything durable still lives in the omniroute_data volume at /app/data (storage.sqlite,
    # server.env, logs, db_backups) and is unaffected by read_only.
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /home/node/.npm:size=256m
      - /app/.build/next/cache:size=512m
    volumes:
      - omniroute_data:/app/data
    environment:
      - TZ=America/Toronto
      - NODE_ENV=production
      - PORT=20128
      - OMNIROUTE_SERVER_HOST=0.0.0.0
      - REQUIRE_API_KEY=true
      - AUTH_COOKIE_SECURE=false
      - BASE_URL=http://omniroute:20128
      - OMNIROUTE_MEMORY_MB=2048
      - INPUT_SANITIZER_ENABLED=true
      - INPUT_SANITIZER_MODE=warn
      - PROXY_FAIL_OPEN=false
      - JWT_SECRET=${OMNIROUTE_JWT_SECRET}
      - API_KEY_SECRET=${OMNIROUTE_API_KEY_SECRET}
      - STORAGE_ENCRYPTION_KEY=${OMNIROUTE_STORAGE_ENCRYPTION_KEY}
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD}
    networks:
      - archie_internal
      # The sandboxed opencode coder lane lives on its OWN network and cannot resolve
      # service names on archie_internal. Rather than attach the LANE to the core network
      # (which would also give it the database and platform) or publish 20128 on the host
      # (which is half of why the critical `next` CVE is unreachable — #6664), the GATEWAY
      # joins the lane's network. Narrowest grant that works: opencode resolves omniroute,
      # and still gets ENOTFOUND for archie_platform and archie_database — verified.
      - opencode_terminal_net

  # Headscale — Self-hosted Tailscale coordination server (Fleet Mesh VPN)
      # ...and the codex lane, for the same reason (#6653 follow-on 2026-09-13).
      # codex reached omniroute as ENOTFOUND until this line: it was on neither
      # network, so its config had no provider and it fell back to a dead ChatGPT
      # auth — the lane could reach the platform but could not run inference.
      - codex_terminal_net

  archie_headscale:
    image: headscale/headscale:0.25
    container_name: archie_headscale
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /var/run:size=16m
    mem_limit: 512m
    cpus: 0.5
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
    command: serve
    volumes:
      - headscale_data:/var/lib/headscale
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/acl.json:/etc/headscale/acl.json:ro
    ports:
      - "8095:8095"       # HTTP API + gRPC
      - "3478:3478/udp"   # STUN (NAT traversal)
    environment:
      TZ: America/Toronto
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "headscale", "nodes", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Tailscale client for hub — joins the mesh as archie-hub (100.64.0.1)
  archie_tailscale:
    image: tailscale/tailscale:v1.80.3
    container_name: archie_tailscale
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /var/run:size=16m
    mem_limit: 512m
    cpus: 0.5
    hostname: archie-hub
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - NET_RAW
    environment:
      TZ: America/Toronto
      TS_AUTHKEY: ${HEADSCALE_HUB_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: "--login-server=https://mesh.kytranempowerment.com --ssh --accept-dns=false --advertise-routes=192.168.1.0/24"
      TS_USERSPACE: "false"
    # Split-horizon DNS for the Headscale control plane (#2087; repointed #4998).
    # The client resolves mesh.kytranempowerment.com via Docker DNS, which forwards
    # to the host's Tailscale resolver — that returns SERVFAIL for this zone, so the
    # name MUST be pinned here.
    #
    # It used to pin to the hub LAN IP (192.168.1.200) to reach NPM on :443. NPM was
    # decommissioned 2026-06-27 (ADR-853, PR #1953/#1954) and the hub no longer listens
    # on 443, so every control-plane fetch died with "connect: connection refused".
    # This container restart-looped ever since (RestartCount 219; headscale node 15
    # archie-starbase-subnet last seen 2026-06-27 20:36).
    #
    # Citadel (2.25.133.122) is the front door for mesh.* since 2026-08-28 — Beacon
    # was removed by Hostinger; its role migrated to the 'beacon' docker container on
    # Citadel (project #395), verified serving GET /key?v=118 -> HTTP 200 via the hub
    # reverse tunnel. The URL must stay byte-identical to headscale's config.yaml
    # `server_url: https://mesh.kytranempowerment.com`, so we repoint the pin rather
    # than bypassing to the hub's :8095. Apply with `up -d --no-deps archie_tailscale`
    # (restart does NOT apply extra_hosts).
    extra_hosts:
      - "mesh.kytranempowerment.com:2.25.133.122"
    volumes:
      - tailscale_hub_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    networks:
      - archie_internal
    depends_on:
      archie_headscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Kytran Business Suite — standalone SaaS product
  kytran-business-suite:
    build: ./kytran-business-suite
    container_name: kbs_app
    ports:
      - "8091:8090"
    env_file: ./kytran-business-suite/.env
    dns: 192.168.1.200
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /var/run:size=16m
    depends_on:
      - archie_database
      - kbs-redis
    mem_limit: 512m
    cpus: 1.0
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    restart: unless-stopped
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    environment:
      TZ: America/Toronto
  kbs-redis:
    image: redis:7-alpine
    container_name: kbs_redis
    # read_only not feasible — Redis writes AOF/RDB persistence files to /data volume
    volumes:
      - kbs-redis-data:/data
    tmpfs:
      - /tmp:size=64m
      - /var/run:size=16m
    mem_limit: 128m
    cpus: 0.25
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    restart: unless-stopped
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

    environment:
      TZ: America/Toronto
  kbs-worker:
    build: ./kytran-business-suite
    container_name: kbs_worker
    command: python -m core.worker
    env_file: ./kytran-business-suite/.env
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /var/run:size=16m
    depends_on:
      - archie_database
      - kbs-redis
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    restart: unless-stopped
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    environment:
      TZ: America/Toronto
  kytran_market_api:
    build: ./market-watch
    container_name: kytran_market_api
    ports:
      - "8101:8080"
    volumes:
      - ./market-watch/data:/app/data
    environment:
      - TZ=America/Toronto
      - ARCHIE_HUB_URL=http://192.168.1.200:3000
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-}
      - ALPACA_BASE_URL=https://paper-api.alpaca.markets
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /var/run:size=16m
    mem_limit: 128m
    cpus: 0.5
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # nginx_proxy_manager DECOMMISSIONED 2026-06-27 — replaced by Beacon (2.25.170.252) as the
  # sole front door for hub services. LAN/mesh DNS (AdGuard rewrites) repointed hub-service
  # hostnames -> Beacon; mail kept -> 192.168.1.200 (Stalwart). Removed from compose because the
  # periodic compose-up kept reviving it after `docker stop`. Data retained at /mnt/HomeLab/nginx-proxy
  # for rollback (restore this block + AdGuardHome.yaml.bak-npm-decom-20260627 + `docker compose up -d`).
  # NPM_* env (NPM_API_URL/NPM_ADMIN_EMAIL/NPM_ADMIN_PASSWORD) dropped from platform+scheduler 2026-06-27.
  # Still open: remove the now-dead Security Network 'NPM Proxy' management feature (separate module change).
  security_nmap:
    image: instrumentisto/nmap:7.94
    container_name: security_nmap
    networks:
      - archie_internal
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

    environment:
      TZ: America/Toronto
  security_nikto:
    image: secfigo/nikto:latest
    container_name: security_nikto
    networks:
      - archie_internal
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
      - ALL
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

    environment:
      TZ: America/Toronto
  security_nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: security_nuclei
    networks:
      - archie_internal
    mem_limit: 512m
    cpus: 1.0
    cap_drop:
      - ALL
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

    environment:
      TZ: America/Toronto
  security_testssl:
    image: drwetter/testssl.sh:3.2
    container_name: security_testssl
    networks:
      - archie_internal
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
      - ALL
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

    environment:
      TZ: America/Toronto
  security_zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: security_zap
    networks:
      - archie_internal
    tmpfs:
      - /tmp:size=128m
    mem_limit: 1g
    cpus: 1.0
    cap_drop:
      - ALL
    entrypoint: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8090", "-config", "api.addrs.addr.name=.*", "-config", "api.addrs.addr.regex=true", "-config", "api.disablekey=true"]
    restart: unless-stopped

    environment:
      TZ: America/Toronto
  archie_browser:
    build: ./archie-browser
    container_name: archie_browser
    restart: unless-stopped
    # tini as PID 1 reaps zombie chrome procs — without it a crashed/killed chrome
    # leaks a <defunct> entry (44 had piled up, #3948). Pairs with the skill_runner
    # lock-timeout + force-kill so a hung profile self-recovers instead of wedging.
    init: true
    environment:
      - TZ=America/Toronto
      - DATABASE_URL=postgresql://archie:${DB_PASSWORD}@archie_database:5432/archie
      - BROWSER_ENCRYPTION_KEY=${BROWSER_ENCRYPTION_KEY}
      - BROWSER_API_KEY=${BROWSER_API_KEY}
      - KYTRAN_LOGO_PATH=/app/assets/kytran-logo.png
      - KYTRAN_PORTRAIT_PATH=/app/assets/kytran-portrait.png
      - INTERNAL_API_KEY=${INTERNAL_API_KEY_BROWSER:-${INTERNAL_API_KEY}}
      - ARCHIE_PLATFORM_URL=http://archie_platform:3000
      - BROWSER_PROFILES_DIR=/profiles
      # LinkedIn page slugs (#2599) — single source, .env-overridable. Skills
      # resolve via _linkedin_common.get_company_slug()/get_creed_slug().
      - LINKEDIN_COMPANY_SLUG=${LINKEDIN_COMPANY_SLUG:-kytran-empowerment-inc}
      - LINKEDIN_CREED_SLUG=${LINKEDIN_CREED_SLUG:-115977300}
    volumes:
      # Persistent trusted-session profiles (#3953) — shared with the
      # archie_browser_login sidecar. On /mnt/data2 (root FS is tight).
      - /mnt/data2/browser-profiles:/profiles
    dns:
      - 192.168.1.200
      - 1.1.1.1
    networks:
      - archie_internal
    expose:
      - "4242"

  # One-time human-login surface for persistent trusted sessions (#3953).
  # Idles cheaply (Xvfb + x11vnc + noVNC + supervisor only); a headed
  # Chromium runs ONLY between /start and /stop, holding the shared profile
  # lock while the owner logs in via noVNC at http://192.168.1.200:4280.
  # Driven from the DHQ S.I.G.N.A.L. session panel via :4281 (internal).
  archie_browser_login:
    build:
      context: ./archie-browser
      dockerfile: Dockerfile.login
    container_name: archie_browser_login
    restart: unless-stopped
    environment:
      - TZ=America/Toronto
      - BROWSER_PROFILES_DIR=/profiles
      # LinkedIn page slugs (#2599) — headed skills (#4649) resolve via
      # _linkedin_common; keep in sync with the archie_browser service above.
      - LINKEDIN_COMPANY_SLUG=${LINKEDIN_COMPANY_SLUG:-kytran-empowerment-inc}
      - LINKEDIN_CREED_SLUG=${LINKEDIN_CREED_SLUG:-115977300}
      # REQUIRED (no `:-` default) — entrypoint fails closed without it, so a
      # no-auth VNC can never expose the owner's live LinkedIn session.
      - BROWSER_VNC_PASSWORD=${BROWSER_VNC_PASSWORD:?BROWSER_VNC_PASSWORD must be set in .env}
      # Bearer-token auth on the supervisor API (:4281). Same key the platform
      # already holds, so only archie_platform can drive start/stop/status.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY_BROWSER:-${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in .env}}
      - LOGIN_IDLE_TIMEOUT=900
      # #4006 capture-to-vault: login_browser.py POSTs the captured
      # storage_state to the platform's internal sessions API on stop.
      - PLATFORM_INTERNAL_URL=http://archie_platform:3000
    volumes:
      - /mnt/data2/browser-profiles:/profiles
    dns:
      - 192.168.1.200
      - 1.1.1.1
    networks:
      - archie_internal
    ports:
      - "4280:4280"   # noVNC web client (hub LAN only)
    expose:
      - "4281"

  archie_scraper:
    build:
      context: ./archie-scraper
      dockerfile: Dockerfile
    container_name: archie_scraper
    restart: unless-stopped
    ports:
      - "4243:4243"
    environment:
      - DB_HOST=archie_database
      - DB_NAME=archie
      - DB_USER=archie
      - DB_PASSWORD=${DB_PASSWORD}
      - SCOUT_POOL_SIZE=3
      - SCOUT_VPS_SOCKS=socks5://100.64.0.10:1080
      - SCOUT_PROXY_URL=${SCOUT_PROXY_URL:-}
      # #4007/#4014 browse-from-country: the per-outpost SOCKS5 proxies
      # (node_socks) run UNAUTHENTICATED — Chromium/Playwright (the session_fetch
      # consumer) can't auth to a SOCKS5 proxy. They're firewalled mesh-only on
      # each outpost (DOCKER-USER iptables drop for non-mesh → :1080), so the
      # mesh IS the access control. resolve_session_egress emits
      # socks5://<mesh_ip>:1080 — SCOUT_SOCKS_USER/PASS are intentionally UNSET
      # (the resolver only adds auth when both are present).
      - SCREENSHOT_DIR=/mnt/screenshots
      # session_fetch skill calls the platform's internal sessions route to load
      # imported storage_state cookies (claude/deepseek/…). KB #270262.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY_BROWSER:-${INTERNAL_API_KEY:-}}
      - PLATFORM_INTERNAL_URL=http://archie_platform:3000
    volumes:
      - /mnt/data2/scout/screenshots:/mnt/screenshots
    networks:
      - archie_internal
    depends_on:
      - archie_database
    mem_limit: 2g
    dns:
      - 192.168.1.200
      - 1.1.1.1

  # Read-only MCP HTTP gateway — gives the Codex container live KB access without
  # ever holding DB creds (Codex sends only a read-scoped bearer). Internal-only.
  # Text-search only (no embedding/inference) — stays compliant with ADR-013.
  archie_mcp_gateway:
    build:
      context: .
      dockerfile: mcp-gateway/Dockerfile
    image: archie_brain-archie_mcp_gateway:latest
    container_name: archie_mcp_gateway
    ports:
      - "127.0.0.1:17800:7800"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
      # mcp_server/__init__ sets up a FileHandler at this path on import
      - /mnt/archie_brain/logs:size=16m
    mem_limit: 512m
    cpus: 0.5
    cap_drop:
      - ALL
    environment:
      TZ: America/Toronto
      DB_HOST: archie_database
      DB_NAME: archie
      DB_USER: codex_ro
      DB_PASSWORD_FILE: /run/secrets/codex_db_ro
      DB_PASSWORD: ""
      PYTHONPATH: /app
      # Dev HQ task tools call the hub's INTERNAL HTTP API (never the DB), so the
      # Postgres role above stays read-only. This key is scoped to
      # {tasks:read, tasks:write} — see services/internal_auth.CALLER_SCOPES["opencode"].
      # Empty => the task tools return "not configured" and the KB tools are unaffected.
      ARCHIE_HUB_URL: http://archie_platform:3000
      # Scoped to {tasks, agents, delegation} — see internal_auth.CALLER_SCOPES.
      # Empty => the write tools report "not configured"; read tools are unaffected.
      INTERNAL_API_KEY_CODER_LANES: ${INTERNAL_API_KEY_CODER_LANES:-}
    secrets:
      - codex_db_ro
    networks:
      - archie_internal
      - codex_terminal_net      # so the isolated codex terminal can reach the gateway
      - opencode_terminal_net   # ...and the opencode terminal. The GATEWAY joins THEIR
                                # networks, never the reverse: the lanes still cannot
                                # resolve archie_platform or archie_database.
    depends_on:
      - archie_database
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7800/health').read()==b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Sandboxed Codex web terminal — interactive `codex` in a browser, contained in a
  # container (no host fs/secrets; only a read-only auth.json seed + a read-scoped KB
  # bearer). ttyd bound to localhost; fronted by the admin auth proxy
  # (ttyd-codex-auth-proxy.service :7682) → Beacon codex.kytranempowerment.com.
  archie_opencode_terminal:
    build:
      context: .
      dockerfile: opencode/Dockerfile.terminal
    image: archie_brain-archie_opencode_terminal:latest
    container_name: archie_opencode_terminal
    restart: unless-stopped
    ports:
      # 127.0.0.1 ONLY. The in-container ttyd has no auth of its own — the host
      # auth proxy on :7685 is the only path in. Binding 0.0.0.0 here would publish
      # a writable shell to the LAN, which is exactly how the claude lane was found
      # exposed once before.
      - "127.0.0.1:17685:7681"
    mem_limit: 1g
    cpus: 1.0
    cap_drop:
      - ALL
    # Run as the uid that OWNS the work tree (#6736). Measured 2026-09-12: opencode
    # ran as uid 0 while /work/archie-platform is node:node (uid 1000), and with
    # cap_drop ALL root has no CAP_DAC_OVERRIDE — so it fell into "other" (r-x) and
    # could not write a single file in the repo it was given. `touch` and `mkdir`
    # both denied. It could read the platform and reason about it well, and change
    # nothing.
    #
    # Fixing it HERE rather than by chowning the tree, for two reasons: root inside
    # the container cannot chown its way out either (CAP_CHOWN is dropped too), and
    # dropping to uid 1000 is strictly LESS privilege than running the lane as root.
    # The compose `user:` is applied by the daemon at start, before cap_drop binds,
    # which is why it works where an in-container su/setpriv cannot.
    #
    # ⚠️ TRAP for anyone testing this lane: `docker exec -u node` writes fine, so a
    # check run as the wrong user reports the lane HEALTHY. Test as the user the
    # lane actually runs as — read it from /proc, not from the docker exec default.
    user: "1000:1000"
    environment:
      TZ: America/Toronto
      OPENCODE_HOME: /opencode-home
      ARCHIE_KB_GATEWAY: http://archie_mcp_gateway:7800/mcp
    secrets:
      # uid/mode are load-bearing: this service runs as user "1000:1000" while the host
      # secret is root-owned 0600, so a DEFAULT mount is unreadable by the process that
      # needs it and MCP would silently 401. Same class as the uid-0 write trap above.
      # ⚠️ NO uid/gid/mode HERE — this Compose ignores them on a file-based secret and
      # says so: "secrets `uid`, `gid` and `mode` are not supported, they will be
      # ignored". They were written on 2026-09-13 precisely to let this uid-1000 lane
      # read the file, were silently dropped, and the lane came up unable to open its
      # own bearer (EACCES) — a declared protection that protected nothing, the same
      # shape as the phantom `backups` table.
      #
      # A file secret is BIND-MOUNTED, so the container sees the HOST file's owner and
      # mode. The grant therefore lives on the host file, and this is its only home:
      #     secrets/opencode/mcp_bearer.txt  ->  root:1000, 0640
      # root still owns it; gid 1000 (kytran on the host, node in the container) may
      # READ it and nothing more. `provision_coder_lane_keys.sh` must preserve that —
      # it writes 0600 root:root, which locks this lane out again.
      #
      # codex needs none of this: that lane runs as root (no `user:`), so root:root
      # 0600 is readable there. The difference is the uid, not the secret.
      - source: opencode_kb_bearer
        target: opencode_kb_bearer
      # GitHub PAT so this lane can push an opencode/* branch and open a PR via
      # `opencode-pr`. Same ownership rule as the bearer above: a file secret is
      # BIND-MOUNTED, so the container sees the HOST file's owner/mode and this lane
      # is uid 1000 — a root:root 0600 file locks it out with EACCES. Write it with
      # scripts/set_lane_github_token.sh, which gets that right.
      #
      # ⚠️ The file must EXIST before this service can start; compose errors out on a
      # missing secret source. A 0-byte placeholder is committed-adjacent and fine:
      # `opencode-pr` tests `[ -s ]` and stops with "this lane has no GitHub
      # credential" rather than failing somewhere confusing inside git.
      - source: opencode_github_token
        target: opencode_github_token
    # uid 1000 cannot open a gid-988 0660 socket without being in that group.
    # Read from the host at apply time, never hardcoded. Fails CLOSED if wrong.
    group_add:
      - "988"
    volumes:
      - opencode_terminal_home:/opencode-home
      - opencode_terminal_work:/work
      # ───────────────────────────────────────────────────────────────────────
      # 🔴 HOST-EQUIVALENT. Owner decision 2026-09-13 (option B), applied by
      # scripts/apply_option_b_coder_lane_host_access.sh.
      #
      # /var/run/docker.sock IS ROOT ON THIS HOST. A process holding it can start
      # a privileged container mounting / . cap_drop, read_only and the dedicated
      # network below still look like a boundary and are not one. That is why this
      # lane is labelled HOST in the UI (terminal_lanes.py `contained: False`) —
      # do NOT "tidy" that back to True.
      #
      # /mnt/archie_brain is the LIVE tree archie_platform serves, not a clone. An
      # edit here is served on the next request. Same path as the host so
      # CLAUDE.md, .claude/rules and scripts/ resolve exactly as claude sees them.
      # ───────────────────────────────────────────────────────────────────────
      - /mnt/archie_brain:/mnt/archie_brain
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      # Its own network, like codex — so nothing else on archie_internal can reach
      # the unauthenticated in-container ttyd.
      - opencode_terminal_net

  archie_codex_terminal:
    build:
      context: .
      dockerfile: codex/Dockerfile.terminal
    image: archie_brain-archie_codex_terminal:latest
    container_name: archie_codex_terminal
    restart: unless-stopped
    ports:
      - "127.0.0.1:17682:7681"
    mem_limit: 1g
    cpus: 1.0
    cap_drop:
      - ALL
    environment:
      TZ: America/Toronto
      CODEX_HOME: /codex-home
      ARCHIE_KB_GATEWAY: http://archie_mcp_gateway:7800/mcp
      # Consumed by config.toml's `env_key`, so codex reads the key from the ENVIRONMENT
      # and it is never written into the config file. opencode stores the same credential
      # INLINE in opencode.json; this is the better half of that pair, not a copy of it.
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-http://omniroute:20128/v1}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-auto/coding:free}
    secrets:
      - codex_kb_bearer
      - codex_auth
      - codex_github_token
    volumes:
      - codex_terminal_home:/codex-home
      - codex_terminal_work:/work
      - ./codex/skills:/opt/archie-codex-skills:ro
      # ───────────────────────────────────────────────────────────────────────
      # 🔴 HOST-EQUIVALENT. Owner decision 2026-09-13 (option B), applied by
      # scripts/apply_option_b_coder_lane_host_access.sh.
      #
      # /var/run/docker.sock IS ROOT ON THIS HOST. A process holding it can start
      # a privileged container mounting / . cap_drop, read_only and the dedicated
      # network below still look like a boundary and are not one. That is why this
      # lane is labelled HOST in the UI (terminal_lanes.py `contained: False`) —
      # do NOT "tidy" that back to True.
      #
      # /mnt/archie_brain is the LIVE tree archie_platform serves, not a clone. An
      # edit here is served on the next request. Same path as the host so
      # CLAUDE.md, .claude/rules and scripts/ resolve exactly as claude sees them.
      # ───────────────────────────────────────────────────────────────────────
      - /mnt/archie_brain:/mnt/archie_brain
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      # Dedicated network shared ONLY with the gateway — so no other container on
      # archie_internal can reach the unauthenticated in-container ttyd (HIGH fix).
      - codex_terminal_net
    depends_on:
      - archie_mcp_gateway

secrets:
  codex_db_ro:
    file: ./secrets/codex/db_ro_password.txt
  codex_kb_bearer:
    file: ./secrets/codex/mcp_bearer.txt
  opencode_kb_bearer:
    file: ./secrets/opencode/mcp_bearer.txt
  codex_auth:
    file: ./secrets/codex/codex_auth.json
  codex_github_token:
    file: ./secrets/codex/github_token.txt
  opencode_github_token:
    file: ./secrets/opencode/github_token.txt
  db_password:
    file: ./secrets/database/password.txt
  stripe_secret_key:
    file: ./secrets/stripe/secret_key.txt
  stripe_webhook_secret:
    file: ./secrets/stripe/webhook_secret.txt
  stripe_publishable_key:
    file: ./secrets/stripe/publishable_key.txt
  # archie-comms OAuth client secrets (#4292/#4293) — Docker-secret-first, env fallback.
  # Values live ONLY in these gitignored files + the oauth_clients DB rows, never in git.
  comms_kytran_client_secret:
    file: ./secrets/archie-comms/kytran_client_secret.txt
  comms_claude_client_secret:
    file: ./secrets/archie-comms/claude_client_secret.txt
  comms_codex_client_secret:
    file: ./secrets/archie-comms/codex_client_secret.txt
  comms_tui_client_secret:
    file: ./secrets/archie-comms/tui_client_secret.txt
  comms_opencode_client_secret:
    file: ./secrets/archie-comms/opencode_client_secret.txt

networks:
  opencode_terminal_net:
    driver: bridge
  archie_internal:
    driver: bridge
    name: archie_network
  network_tools_ext:
    external: true
    name: network_tools_network
  # Dedicated net for the Codex web terminal — only the terminal + the read-only
  # gateway join it, so the in-container ttyd is unreachable by other platform
  # containers. NOT internal: the terminal needs outbound internet (OpenAI API);
  # isolation comes from being a separate bridge, not from blocking egress.
  codex_terminal_net:
    driver: bridge

volumes:
  opencode_terminal_home:
    driver: local
    name: archie_opencode_terminal_home
  opencode_terminal_work:
    driver: local
    name: archie_opencode_terminal_work
