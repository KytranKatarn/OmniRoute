services:
  # PostgreSQL Database (with pgvector for semantic embeddings)
  archie_database:
    image: pgvector/pgvector:pg16
    container_name: archie_database
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /var/run/postgresql:size=16m
      - /var/log:size=64m
    mem_limit: 8g
    cpus: 2.0
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      TZ: America/Toronto
      POSTGRES_USER: archie
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: archie
      # Allow all connections with password auth (pg_hba.conf equivalent)
      POSTGRES_HOST_AUTH_METHOD: md5
    secrets:
      - db_password
    volumes:
      - archie_db:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d:ro
    ports:
      - "192.168.1.200:5432:5432"  # Local network access for remote nodes
    networks:
      - archie_internal
    command: ["postgres", "-c", "listen_addresses=*", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archie -d archie"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # A.R.C.H.I.E. Platform
  archie_platform:
    build: ./platform_v2
    container_name: archie_platform
    command: ["gunicorn", "--bind", "0.0.0.0:3000", "--workers", "1", "--threads", "8", "--timeout", "300", "app:app"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /var/run:size=16m
      - /var/log:size=128m
      - /root/.cache:size=1g,exec
      - /mnt/archie_brain/logs:size=64m
    mem_limit: 4g
    cpus: 4.0
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - SYS_PTRACE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    env_file:
      - .env
    environment:
      TZ: America/Toronto
      PYTHONPATH: /mnt/archie_brain
      SECRET_KEY: ${SECRET_KEY}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      FLASK_ENV: production
      DB_HOST: archie_database
      DB_PORT: 5432
      DB_NAME: archie
      DB_USER: archie
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_PASSWORD: ""  # Cleared — use Docker secret via DB_PASSWORD_FILE
      OLLAMA_PRIMARY: ${OLLAMA_PRIMARY}
      CODE_SERVER_URL: ${CODE_SERVER_URL}
      OLLAMA_HOST: ${OLLAMA_PRIMARY}
      HOST_IP: "192.168.1.200"  # Host machine IP for System Operations module
      NPM_API_URL: http://nginx_proxy_manager:81/api
      NPM_ADMIN_EMAIL: ${NPM_ADMIN_EMAIL}
      NPM_ADMIN_PASSWORD: ${NPM_ADMIN_PASSWORD}
      HOSTINGER_API_KEY: ${HOSTINGER_API_KEY:-}
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
      HOSTINGER_DOMAIN: ${HOSTINGER_DOMAIN:-kytranempowerment.com}
      HA_URL: ${HA_URL:-http://192.168.1.200:8123}
      HA_API_TOKEN: ${HA_API_TOKEN:-}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-hub}
      OLLAMA_MODELS: /mnt/llm_drive/ollama/models
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      COMFYUI_HOST: ${COMFYUI_HOST:-http://172.27.0.11:8188}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-KytranKatarn}
    extra_hosts:
      - "host.docker.internal:192.168.1.200"
    secrets:
      - db_password
      - stripe_secret_key
      - stripe_webhook_secret
      - stripe_publishable_key
    volumes:
      # Mount ai-bridge into container (rw for self-improvement deployments)
      - ./ai_bridge:/mnt/archie_brain/ai_bridge:rw
      # Mount documentation (rw for self-improvement deployments)
      - ./docs:/mnt/archie_brain/docs:rw
      # Mount platform code (for development)
      - ./platform_v2:/app:rw
      - ./backups:/backups
      # Mount external USB backup storage
      - /mnt/external-backup:/mnt/external-backup:rw
      # Mount conversation logs for Claude Code hook capture
      - ./conversation_logs:/mnt/archie_brain/conversation_logs:rw
      # Mount Docker socket for sandbox management
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount sandbox compose file
      - ./docker-compose.sandbox.yml:/mnt/archie_brain/docker-compose.sandbox.yml:ro
      # Additional mounts for full backup support (rw for self-improvement)
      - ./database/migrations:/mnt/archie_brain/database/migrations:rw
      # Host monitor data file (from host_monitor.py running on host)
      - ./host_monitor_data.json:/mnt/archie_brain/host_monitor_data.json:ro
      # Fleet app catalog (YAML entries for KSO app store)
      - ./fleet/catalog:/mnt/archie_brain/fleet/catalog:ro
      # Fleet SSL cert storage (wildcard cert for *.kytranempowerment.com)
      - /opt/archie-fleet/certs:/opt/archie-fleet/certs:rw
      - ./bandwidth_history.json:/mnt/archie_brain/bandwidth_history.json:ro
      - ./n8n_workflows:/mnt/archie_brain/n8n_workflows:rw
      - ./persistence/n8n:/mnt/archie_brain/persistence/n8n:ro
      - ./scripts:/mnt/archie_brain/scripts:rw
      - ./nginx:/mnt/archie_brain/nginx:ro
      - ./docker-compose.yml:/mnt/archie_brain/docker-compose.yml:ro
      # Mount Goose orchestration directory (Phase 55)
      - ./goose:/mnt/archie_brain/goose:rw
      # Mount .mcp.json, CLAUDE.md, and .claude/rules for Dev HQ + Skill Sync
      - ./.mcp.json:/mnt/archie_brain/.mcp.json:ro
      - ./CLAUDE.md:/mnt/archie_brain/CLAUDE.md:ro
      - ./.claude/rules:/mnt/archie_brain/.claude/rules:rw
      - ./.claude/skills:/mnt/archie_brain/.claude/skills:rw
      # Mount .git for git operations (CodeRabbit Local Git management)
      - ./.git:/mnt/archie_brain/.git:rw
      # GitHub repo clones — ARCHIE's local copies for reading/modifying/sharing
      - ./repos:/mnt/archie_brain/repos:rw
      - ./secrets:/mnt/archie_brain/secrets:ro
      # Mount node client package for remote node deployment
      - ./node_client:/mnt/archie_brain/node_client:ro
      # Website and standalone product sources (Code Health scanning)
      - ./website:/mnt/archie_brain/website:ro
      # Translation bundle export (#2089) — nested :rw overrides on data/
      # only so _export_bundle can write translations.json while the rest of
      # each site stays :ro for Code Health scan boundary integrity.
      - ./website/kytranempowerment.com/data:/mnt/archie_brain/website/kytranempowerment.com/data:rw
      - ./website/creed-ai.org/data:/mnt/archie_brain/website/creed-ai.org/data:rw
      # Portrait thumbnails — :rw so approve_canonical() writes directly to repo.
      # Hostinger deploy then picks up the complete set via the deploy-website skill.
      - ./website/kytranempowerment.com/assets/portraits:/mnt/archie_brain/website/kytranempowerment.com/assets/portraits:rw
      - ./website/creed-ai.org/assets/portraits:/mnt/archie_brain/website/creed-ai.org/assets/portraits:rw
      - ./kytran-server-manager:/mnt/archie_brain/kytran-server-manager:ro
      # Host command queue (shared with host_monitor.py for storage operations)
      - ./host_commands:/mnt/archie_brain/host_commands:rw
      # Migration compose files for Docker stack management
      - ./migrations:/mnt/archie_brain/migrations:ro
      # Docker stacks directory for System Operations stack management
      - /mnt/stacks:/mnt/stacks:ro
      # Nagios monitoring data (status.dat) for health integration
      - monitoring_nagios_data:/opt/nagios-data:ro
      # Host config files for STIG compliance scanning (read-only)
      - /etc/ssh:/etc/ssh:ro
      - /etc/docker:/etc/docker:ro
      - /etc/security:/etc/security:ro
      - /etc/pam.d:/etc/pam.d:ro
      - /etc/audit:/etc/audit:ro
      - /etc/login.defs:/etc/login.defs:ro
      - /etc/modprobe.d:/etc/modprobe.d:ro
      - /etc/sysctl.conf:/etc/sysctl.conf:ro
      - /etc/sysctl.d:/etc/sysctl.d:ro
      - /etc/rsyslog.conf:/host/etc/rsyslog.conf:ro
      - /etc/rsyslog.d:/host/etc/rsyslog.d:ro
      - /etc/crontab:/host/etc/crontab:ro
      - /etc/sudoers.d:/host/etc/sudoers.d:ro
      - /etc/sudoers:/host/etc/sudoers:ro
      - /etc/systemd/journald.conf:/host/etc/journald.conf:ro
      - /proc/1/mounts:/host/proc/mounts:ro
      - /etc/ufw:/etc/ufw:ro
      # Media stack configs for Media Hub service discovery (API keys, etc.)
      - /mnt/Plex/config:/mnt/Plex/config:ro
      # Ollama model storage on LLM SSD
      - /mnt/llm_drive/ollama/models:/mnt/llm_drive/ollama/models:ro
      # Google Drive credentials for cloud backup (rw: OAuth token written at runtime)
      - ./credentials:/app/credentials:rw
      # Browser automation screenshots (Project Autonomy Phase 4)
      - ./platform_v2/static/screenshots:/app/static/screenshots:rw
      # ── Standalone Products + Websites (read-only for Code Health scanner) ──
      - /mnt/standalone:/mnt/standalone:ro
      # Translation bundle export (#2089) — nested :rw overrides on data/ only
      # so _export_bundle can write translations.json for standalone sites.
      - /mnt/standalone/websites/what-the-fact.com/data:/mnt/standalone/websites/what-the-fact.com/data:rw
      - ./stalwart-mail:/mnt/archie_brain/stalwart-mail:ro
    ports:
      - "3000:3000"
    networks:
      - archie_internal
      - network_tools_ext
    depends_on:
      archie_database:
        condition: service_healthy
      archie_ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # A.R.C.H.I.E. Comms — Independent communication layer (Decision #442)
  # Survives platform crashes. Voice, Telegram, chat UI, watchdog.
  archie_comms:
    build:
      context: ./archie-comms
      dockerfile: Dockerfile
    container_name: archie_comms
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - DB_HOST=archie_database
      - DB_NAME=archie
      - DB_USER=archie
      - OLLAMA_HOST=192.168.1.200:11434
      - ARCHIE_VOICE_MODEL=dolphin3-8k:latest
      - PLATFORM_URL=http://archie_platform:3000
      - CLAUDE_PROXY_URL=http://host.docker.internal:7682
      - COMMS_PORT=3002
      - SECRET_KEY=${SECRET_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=claude-sonnet-4-20250514
      - KYTRAN_CLIENT_ID=archie-comms
      - KYTRAN_CLIENT_SECRET=2e718ace8add43c8a1054b3d80f885bc108074e11be1c43e7bb9747676860dfb
      - KYTRAN_AUTH_URL=http://192.168.1.200:3000
      - KYTRAN_REDIRECT_URI=https://archie.kytranempowerment.com/auth/kytran/callback
      - ARCHIE_COMMS_SERVICE_TOKEN=${ARCHIE_COMMS_SERVICE_TOKEN}
      - CLAUDE_CLIENT_ID=claude-terminal
      - CLAUDE_CLIENT_SECRET=717303c1e78251250c8509245b7e1ac385a5b2bbc684208d328a4423628651e3
      - CLAUDE_REDIRECT_URI=https://claude.kytranempowerment.com/auth/kytran/callback
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3002:3002"
    networks:
      - archie_internal
    depends_on:
      archie_database:
        condition: service_healthy
    secrets:
      - db_password
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Ollama LLM Engine (models on Samsung 840 SSD)
  archie_ollama:
    image: ollama/ollama:0.6.2
    container_name: archie_ollama
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=1g
    mem_limit: 96g
    cpus: 8.0
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=13
      - OLLAMA_NUM_PARALLEL=4
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /mnt/llm_drive/ollama:/root/.ollama
      - /mnt/data2:/mnt/data2:ro
    ports:
      - "192.168.1.200:11434:11434"
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # n8n Workflow Automation
  archie_nginx_n8n:
    image: nginx:1.27-alpine
    container_name: archie_nginx_n8n
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /var/run:size=16m
      - /var/cache/nginx:size=64m
    mem_limit: 512m
    cpus: 0.5
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./n8n_custom_theme.css:/etc/nginx/archie-theme.css:ro
    ports:
      - "0.0.0.0:5679:5679"
    networks:
      - archie_internal
    depends_on:
      - archie_n8n
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5679"]
      interval: 30s
      timeout: 10s
      retries: 3

  archie_n8n:
    image: n8nio/n8n:1.85.4
    container_name: archie_n8n
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /var/run:size=16m
      - /home/node/.cache:size=128m
    mem_limit: 2g
    cpus: 2.0
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-change_this_password}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - GENERIC_TIMEZONE=America/Toronto
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=archie_database
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-archie}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - ./persistence/n8n:/home/node/.n8n
      - ./n8n_workflows:/home/node/.n8n/workflows:rw
      - ./n8n_custom_theme.css:/home/node/.n8n/custom-theme.css:ro
    ports:
      - "0.0.0.0:5678:5678"
    networks:
      - archie_internal
    depends_on:
      archie_database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ComfyUI — Advanced local image generation (SD, FLUX, LoRA, ControlNet)
  archie_comfyui:
    build: ./comfyui
    container_name: archie_comfyui
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /var/run:size=16m
      - /comfyui/temp:size=1g
      - /root/.local:size=256m
    mem_limit: 8g
    cpus: 2.0
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8188:8188"
    volumes:
      - /mnt/data2/comfyui/models:/comfyui/models
      - comfyui_output:/comfyui/output
      - ./platform_v2/static/media:/media
      - ./comfyui/workflows:/comfyui/user/default/workflows
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Headscale — Self-hosted Tailscale coordination server (Fleet Mesh VPN)
  archie_headscale:
    image: headscale/headscale:0.25
    container_name: archie_headscale
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /var/run:size=16m
    mem_limit: 512m
    cpus: 0.5
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
    command: serve
    volumes:
      - headscale_data:/var/lib/headscale
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/acl.json:/etc/headscale/acl.json:ro
    ports:
      - "8095:8095"       # HTTP API + gRPC
      - "3478:3478/udp"   # STUN (NAT traversal)
    environment:
      TZ: America/Toronto
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "headscale", "nodes", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Tailscale client for hub — joins the mesh as archie-hub (100.64.0.1)
  archie_tailscale:
    image: tailscale/tailscale:v1.80.3
    container_name: archie_tailscale
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /var/run:size=16m
    mem_limit: 512m
    cpus: 0.5
    hostname: archie-hub
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - NET_RAW
    environment:
      TS_AUTHKEY: ${HEADSCALE_HUB_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: "--login-server=https://mesh.kytranempowerment.com --ssh --accept-dns=false --advertise-routes=192.168.1.0/24"
      TS_USERSPACE: "false"
    # Split-horizon DNS for DERP endpoint (#2087): the client resolves
    # mesh.kytranempowerment.com via Docker DNS which forwards to the
    # host's Tailscale resolver — that returns SERVFAIL for this zone.
    # Pin it to the hub LAN IP so DERP traffic reaches NPM on 443.
    extra_hosts:
      - "mesh.kytranempowerment.com:192.168.1.200"
    volumes:
      - tailscale_hub_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    networks:
      - archie_internal
    depends_on:
      archie_headscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Kytran Business Suite — standalone SaaS product
  kytran-business-suite:
    build: ./kytran-business-suite
    container_name: kbs_app
    ports:
      - "8091:8090"
    env_file: ./kytran-business-suite/.env
    dns: 192.168.1.200
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /var/run:size=16m
    depends_on:
      - archie_database
      - kbs-redis
    mem_limit: 512m
    cpus: 1.0
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    restart: unless-stopped
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  kbs-redis:
    image: redis:7-alpine
    container_name: kbs_redis
    # read_only not feasible — Redis writes AOF/RDB persistence files to /data volume
    volumes:
      - kbs-redis-data:/data
    tmpfs:
      - /tmp:size=64m
      - /var/run:size=16m
    mem_limit: 128m
    cpus: 0.25
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    restart: unless-stopped
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  kbs-worker:
    build: ./kytran-business-suite
    container_name: kbs_worker
    command: python -m core.worker
    env_file: ./kytran-business-suite/.env
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /var/run:size=16m
    depends_on:
      - archie_database
      - kbs-redis
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    restart: unless-stopped
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  kytran_market_api:
    build: ./market-watch
    container_name: kytran_market_api
    ports:
      - "8101:8080"
    volumes:
      - ./market-watch/data:/app/data
    environment:
      - ARCHIE_HUB_URL=http://192.168.1.200:3000
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-}
      - ALPACA_BASE_URL=https://paper-api.alpaca.markets
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /var/run:size=16m
    mem_limit: 128m
    cpus: 0.5
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Nginx Proxy Manager — Reverse proxy + SSL termination for all subdomains
  nginx_proxy_manager:
    image: 'jc21/nginx-proxy-manager:2.14.0'
    container_name: nginx_proxy_manager
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
    ports:
      - '80:80'
      - '443:443'
      - '127.0.0.1:81:81'
    volumes:
      - /mnt/HomeLab/nginx-proxy/data:/data
      - /mnt/HomeLab/nginx-proxy/letsencrypt:/etc/letsencrypt
    networks:
      - archie_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/api"]
      interval: 30s
      timeout: 10s
      retries: 3

  security_nmap:
    image: instrumentisto/nmap:7.94
    container_name: security_nmap
    networks:
      - archie_internal
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  security_nikto:
    image: secfigo/nikto:latest
    container_name: security_nikto
    networks:
      - archie_internal
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
      - ALL
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  security_nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: security_nuclei
    networks:
      - archie_internal
    mem_limit: 512m
    cpus: 1.0
    cap_drop:
      - ALL
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  security_testssl:
    image: drwetter/testssl.sh:3.2
    container_name: security_testssl
    networks:
      - archie_internal
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
      - ALL
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  security_zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: security_zap
    networks:
      - archie_internal
    tmpfs:
      - /tmp:size=128m
    mem_limit: 1g
    cpus: 1.0
    cap_drop:
      - ALL
    entrypoint: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8090", "-config", "api.addrs.addr.name=.*", "-config", "api.addrs.addr.regex=true", "-config", "api.disablekey=true"]
    restart: unless-stopped

  archie_browser:
    build: ./archie-browser
    container_name: archie_browser
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://archie:${DB_PASSWORD}@archie_database:5432/archie
      - BROWSER_ENCRYPTION_KEY=${BROWSER_ENCRYPTION_KEY}
      - BROWSER_API_KEY=${BROWSER_API_KEY}
      - KYTRAN_LOGO_PATH=/app/assets/kytran-logo.png
      - KYTRAN_PORTRAIT_PATH=/app/assets/kytran-portrait.png
    dns:
      - 192.168.1.200
      - 1.1.1.1
    networks:
      - archie_internal
    expose:
      - "4242"

secrets:
  db_password:
    file: ./secrets/database/password.txt
  stripe_secret_key:
    file: ./secrets/stripe/secret_key.txt
  stripe_webhook_secret:
    file: ./secrets/stripe/webhook_secret.txt
  stripe_publishable_key:
    file: ./secrets/stripe/publishable_key.txt

networks:
  archie_internal:
    driver: bridge
    name: archie_network
  network_tools_ext:
    external: true
    name: network_tools_network

volumes:
  archie_db:
    driver: local
    name: archie_database
  comfyui_output:
    driver: local
    name: archie_comfyui_output
  headscale_data:
    driver: local
    name: archie_headscale_data
  tailscale_hub_data:
    driver: local
    name: archie_tailscale_hub
  monitoring_nagios_data:
    external: true
    name: monitoring_nagios_data
  kbs-redis-data:
