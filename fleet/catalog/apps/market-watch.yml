name: Kytran Market Watch
id: market-watch
description: Autonomous trading intelligence — M.A.R.K.E.T. agent, 8 analysis tabs, paper trading
image: ghcr.io/kytrankatarn/market-watch:latest
version: "1.0.0"
port: 8101
env:
  - name: FLASK_SECRET_KEY
    required: true
    generate: true
  - name: DATABASE_URL
    required: false
    default: "sqlite:///data/market-watch.db"
  - name: ALPHA_VANTAGE_KEY
    required: false
    default: ""
volumes:
  - name: data
    path: /app/data
resources:
  min_ram_mb: 512
  min_disk_mb: 500
  gpu: false
compatible_nodes:
  - starship
category: products
health_endpoint: /api/health
depends_on: []
