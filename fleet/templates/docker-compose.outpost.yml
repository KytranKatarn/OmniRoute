services:
  archie_sync:
    image: python:3.11-slim
    container_name: archie_outpost_sync
    restart: unless-stopped
    working_dir: /app
    command: python3 node_sync.py
    environment:
      - TZ=America/Toronto
      - NODE_ID=${NODE_ID}
      - HUB_URL=${HUB_URL}
      - HUB_API_KEY=${HUB_API_KEY}
      - NODE_TYPE=outpost
      - HEARTBEAT_INTERVAL=60
      - SYNC_POLL_INTERVAL=60
    volumes:
      - ./node_sync.py:/app/node_sync.py:ro
      - ./config.json:/etc/archie-node/config.json
    networks:
      - archie_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  archie_api:
    image: python:3.11-slim
    container_name: archie_outpost_api
    restart: unless-stopped
    working_dir: /app
    command: bash -c "pip install flask requests psutil psycopg2-binary --quiet && python3 node_api.py"
    ports:
      - "3001:3001"
    environment:
      - TZ=America/Toronto
      - NODE_ID=${NODE_ID}
      - HUB_URL=${HUB_URL}
      - HUB_API_KEY=${HUB_API_KEY}
      - NODE_TYPE=outpost
    volumes:
      - ./node_api.py:/app/node_api.py:ro
    networks:
      - archie_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  archie_proxy:
    image: caddy:2-alpine
    container_name: archie_outpost_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - archie_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

    environment:
      TZ: America/Toronto
volumes:
  caddy_data:
  caddy_config:

networks:
  archie_net:
    driver: bridge
