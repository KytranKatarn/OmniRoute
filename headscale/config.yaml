# Headscale 0.25.x — Self-hosted Tailscale coordination server for ARCHIE Fleet Mesh
# Based on official config-example.yaml from juanfont/headscale v0.25.1
# Docs: https://headscale.net/ref/configuration/

# NPM handles TLS termination — Headscale sees HTTP internally
# External nodes connect via https://mesh.kytranempowerment.com (NPM → :8095)
# LAN nodes can also use http://192.168.1.200:8095 directly
server_url: https://mesh.kytranempowerment.com
listen_addr: 0.0.0.0:8095
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

# Noise protocol keys (required since 0.17, auto-generated if file missing)
noise:
  private_key_path: /var/lib/headscale/noise_private.key

# NOTE: top-level "private_key_path" was REMOVED in 0.23+. Do not set it.

# IP address pools for mesh nodes
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# DERP relay — for nodes behind NAT that can't do peer-to-peer
derp:
  server:
    enabled: true
    region_id: 900
    region_code: archie
    region_name: ARCHIE Hub

    # FIX: This was the missing field causing the crash.
    # Required since 0.23 when embedded DERP is enabled.
    # File is auto-generated, but the path MUST be specified.
    private_key_path: /var/lib/headscale/derp_server_private.key

    # STUN is REQUIRED when embedded DERP server is enabled
    stun_listen_addr: "0.0.0.0:3478"

    automatically_add_embedded_derp_region: true

  urls: []
  # Region 901 on Beacon — ADDITIVE, outside the hub failure domain (#5220).
  # Lives in the headscale data VOLUME because config.yaml is mounted as a
  # single file; this avoids a docker-compose change to add another mount.
  paths:
    - /var/lib/headscale/derp-beacon.yaml
  update_frequency: 24h

# Database — local SQLite (no external dependency)
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

# DNS — MagicDNS for node discovery
dns:
  magic_dns: true
  base_domain: mesh.archie
  nameservers:
    global:
      # ⚠️ ORDER AND REACHABILITY BOTH MATTER, and this list had neither right.
      #
      # It was [192.168.1.200, 1.1.1.1]. 192.168.1.200 is a LAN address: a mesh
      # client that is not ALSO on the home LAN cannot reach it (the hub's
      # 192.168.1.0/24 subnet route is disabled), so it times out and falls through
      # to 1.1.1.1 — which answers the lane hostnames with Citadel's PUBLIC ip.
      # The device then leaves the tunnel, arrives with a public source address and
      # is refused by the mesh gate, while appearing to be fully on the mesh.
      #
      # Measured 2026-09-11 from Citadel's access log: the owner's phone reached
      # codex.kytranempowerment.com from 209.107.108.214 — a public address — while
      # shuttle-kytran (100.64.0.9) was online on the tailnet.
      #
      # 100.64.0.4 is the hub's MESH address, reachable from anywhere on the
      # tailnet, and it serves the same AdGuard instance. LAN address kept second
      # for a client whose tunnel is down but which is still on the home network;
      # 1.1.1.1 stays last so DNS survives AdGuard being unavailable — but it is
      # now genuinely a last resort rather than the routine answer.
      # ⚠️ 192.168.1.200 was REMOVED from this list 2026-09-11, the same day it was
      # demoted from first place. The justification for keeping it as a fallback —
      # "a client whose tunnel is down but is still on the home LAN" — does not hold:
      # a client with no tunnel never RECEIVES this list at all, it uses DHCP. So the
      # entry could only ever be consulted by tailnet clients, every one of which can
      # reach 100.64.0.4. Off-LAN it is pure added latency: a timeout before the
      # fallthrough. scripts/mesh_dns_monitor.py flagged it on its first run.
      - 100.64.0.4
      # Last resort so DNS survives AdGuard being down. It answers the lane names
      # with the PUBLIC ip, which is why it must never be reached routinely — a
      # client following it leaves the tunnel and gets the CLEARANCE NOT GRANTED
      # page rather than a terminal. Visible and explained, but wrong.
      - 1.1.1.1
  search_domains: []
  # Padlock-over-mesh (#4287): push these A records via MagicDNS so mesh clients resolve
  # them CLIENT-SIDE (no :53-over-mesh dependency) → https://archie.*/platform.* over mesh
  # hits a real Let's Encrypt cert on :443. Targeted override; all other names still use
  # the nameservers above.
  #
  # ⚠️ THESE OVERRIDE ADGUARD ON EVERY MESH NODE. MagicDNS is the system resolver on a
  # Tailscale-joined machine, so a name listed here is answered from this file no matter
  # what the AdGuard rewrite says. That makes this a SECOND source of truth for the same
  # mapping — and it has now gone stale twice, each time silently:
  #
  #   2026-06-27  hub NPM (100.64.0.4:443) -> Beacon 2.25.170.252   (NPM decommissioned)
  #   2026-08-29  Beacon RETIRED (decision #1051) — these were NOT updated
  #   2026-09-01  Beacon 80 AND 443 both closed; every mesh node resolved platform./archie.
  #               to a dead host. AdGuard and public DNS were BOTH already correct
  #               (2.25.133.122) — only this file was wrong, which is exactly why the
  #               symptom read as "AdGuard isn't routing".
  #
  # ⚠️ RULE: when the front door moves, THIS FILE MOVES WITH IT. Grep for the old IP in
  # headscale/config.yaml as part of any front-door change — the AdGuard rewrite alone is
  # not the whole picture. Same family as the archie_tailscale extra_hosts pin and the
  # mesh. rewrite (see .claude/rules/fleet.md): a DNS record left pointing at a host that
  # cannot serve the scheme, discovered only when someone tries to use it.
  #
  # Verified 2026-09-01 before repointing: 2.25.133.122:443 with SNI
  # platform.kytranempowerment.com -> 302, archie.kytranempowerment.com -> 200, both on a
  # valid cert. Never point these at 100.64.0.4 or 192.168.1.200 — the hub has had NO :443
  # listener since NPM was decommissioned.
  extra_records:
    - name: "archie.kytranempowerment.com"
      type: "A"
      value: "2.25.133.122"
    - name: "platform.kytranempowerment.com"
      type: "A"
      value: "2.25.133.122"
    # --- Coder lanes -> Citadel's MESH address (added 2026-09-11) -----------------
    # Pushed by headscale itself, so TAILSCALE's own resolver answers them on every
    # mesh device regardless of what that device's system DNS is set to. The AdGuard
    # rewrite alone was not enough: a phone that prefers its router/carrier resolver
    # never consults AdGuard, resolves the PUBLIC ip, arrives off-mesh and is refused.
    #
    # Off the mesh these names are not pushed at all, so public DNS applies, the
    # request lands on Citadel's public ip, and the page renders CLEARANCE NOT
    # GRANTED — which is the intended behaviour, not a failure.
    #
    # ⚠️ mesh.kytranempowerment.com is DELIBERATELY NOT HERE. It is the Headscale
    # control plane: a client that resolved it to a mesh address would need the mesh
    # in order to reach the thing that admits it to the mesh. Bootstrap deadlock.
    - name: "claude.kytranempowerment.com"
      type: "A"
      value: "100.64.0.10"
    - name: "codex.kytranempowerment.com"
      type: "A"
      value: "100.64.0.10"
    - name: "tui.kytranempowerment.com"
      type: "A"
      value: "100.64.0.10"
    - name: "opencode.kytranempowerment.com"
      type: "A"
      value: "100.64.0.10"
    - name: "terminal.kytranempowerment.com"
      type: "A"
      value: "100.64.0.10"
    - name: "codex-tty.kytranempowerment.com"
      type: "A"
      value: "100.64.0.10"
    - name: "tui-tty.kytranempowerment.com"
      type: "A"
      value: "100.64.0.10"
    - name: "opencode-tty.kytranempowerment.com"
      type: "A"
      value: "100.64.0.10"

# Unix socket for headscale CLI
unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

# Logging
log:
  format: text
  level: info

# Node settings
ephemeral_node_inactivity_timeout: 5m
node_update_check_interval: 10s

# ACL policy — disable open registration, nodes need pre-auth keys
policy:
  mode: file
  path: ""
