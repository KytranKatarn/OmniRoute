# Watch-edge GeoDNS — gdnsd authoritative nameserver (#4319, ADR-010).
# Deploys to the nameserver outposts (Outpost-US / Outpost-UK / Outpost-Singapore).
# host networking so it binds public :53 directly (a glue'd nameserver must answer
# on the node's real public IP). Read-only rootfs; config bind-mounted.
#
# ⚠️ Requires geoip/dbip-country-lite.mmdb present (run ./fetch-geoip.sh first).
# ⚠️ Open 53/udp + 53/tcp on the node (UFW) and re-verify the SOCKS5 mesh-only
#    DOCKER-USER gate is intact afterwards (KB mistake #272166).
services:
  geodns:
    build: .
    image: watch-geodns:latest
    container_name: watch_geodns
    restart: unless-stopped
    network_mode: host
    read_only: true
    volumes:
      - ./config:/etc/gdnsd:ro
    tmpfs:
      - /run
      - /var/run
    mem_limit: 128m
    cpus: 0.50
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    healthcheck:
      # gdnsd answers its own version on CH TXT; a successful query = healthy.
      test: ["CMD-SHELL", "gdnsd -c /etc/gdnsd checkconf >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
