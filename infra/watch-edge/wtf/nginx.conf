# Watch-Series Edge Funnel #0 — What The Fact (Phase 0, #4320)
# nginx edge: cache (anon /news only) + per-IP & global rate-limit + reverse-proxy
# to the WTF origin over the Headscale mesh. Runs on Beacon (100.64.0.11) on a
# TEST port (8088) — it does NOT touch Beacon's host-Caddy on :80/:443 and the
# public DNS is NOT cut over. Origin = wtf-consumer on Citadel (mesh IP only).
#
# Cache safety: the origin sends `Vary: Cookie` (response is personalized when a
# cookie is present). We therefore (a) bypass + never store any cookie-bearing
# request, and (b) only cache anonymous responses (the public free tier) — so no
# paywall/personalization can ever leak between users. TTL is short (30s).

worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    log_format edge '$remote_addr "$request" $status cache=$upstream_cache_status rt=${request_time}s';
    access_log /dev/stdout edge;

    sendfile on;
    keepalive_timeout 65;

    # Writable temp paths under the tmpfs cache mount (read-only rootfs friendly).
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    proxy_cache_path /var/cache/nginx/wtf levels=1:2 keys_zone=wtf_cache:10m
                     max_size=100m inactive=60s use_temp_path=off;

    # Rate-limit zones: per-client-IP + a GLOBAL cap (constant key) on /news.
    limit_req_zone $binary_remote_addr zone=perip:10m rate=5r/s;
    limit_req_zone $server_name        zone=global:1m rate=50r/s;
    limit_req_status 429;

    # Origin: wtf-consumer on Citadel — MESH IP ONLY, never a public hostname.
    upstream wtf_origin {
        server 100.64.0.10:8103;
        keepalive 16;
    }

    server {
        listen 8088;
        server_name what-the-fact.com www.what-the-fact.com _;

        proxy_http_version 1.1;
        proxy_set_header Host what-the-fact.com;
        proxy_set_header X-Forwarded-For $remote_addr;   # origin's /news limiter reads XFF
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # /news — the scraper-overload surface. Cache anon responses + rate-limit +
        # collapse concurrent misses + serve stale on origin error (DDoS resilience).
        location /news {
            limit_req zone=perip  burst=20  nodelay;
            limit_req zone=global burst=200 nodelay;

            proxy_cache wtf_cache;
            proxy_cache_key "$scheme$host$uri$is_args$args";   # vary on the filter query only
            proxy_cache_valid 200 30s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # SAFETY (Vary: Cookie origin): never store/serve a cookie-bearing response.
            proxy_cache_bypass $http_cookie;
            proxy_no_cache      $http_cookie;

            add_header X-Edge-Cache $upstream_cache_status always;
            proxy_pass http://wtf_origin;
        }

        # Everything else: pass-through with a light per-IP limit, no caching.
        location / {
            limit_req zone=perip burst=30 nodelay;
            add_header X-Edge-Cache "BYPASS" always;
            proxy_pass http://wtf_origin;
        }

        # Local edge health (not proxied).
        location = /_edge_health { access_log off; add_header Content-Type text/plain; return 200 "wtf-edge ok\n"; }
    }
}
