# Usage: docker compose -f docker-compose.yml -f docker-compose.hub.yml up -d
services:
  kbs-postgres:
    deploy:
      replicas: 0

  kytran-business-suite:
    depends_on:
      - kbs-redis
    networks:
      - default
      - archie_network
    environment:
      KBS_DB_HOST: archie_database
      KBS_DB_PORT: 5432
      KBS_DB_NAME: archie
      KBS_DB_USER: archie

  kbs-worker:
    networks:
      - default
      - archie_network
    environment:
      KBS_DB_HOST: archie_database
      KBS_DB_PORT: 5432
      KBS_DB_NAME: archie
      KBS_DB_USER: archie

networks:
  archie_network:
    external: true
    name: archie_brain_default
