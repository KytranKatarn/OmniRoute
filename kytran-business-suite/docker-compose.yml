services:
  kytran-business-suite:
    build: .
    container_name: kbs_app
    ports:
      - "8091:8090"
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - .:/app:ro
    depends_on:
      - kbs-redis
      - kbs-postgres
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  kbs-postgres:
    image: postgres:16-alpine
    container_name: kbs_postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: kbs
      POSTGRES_USER: kbs
      POSTGRES_PASSWORD: ${KBS_DB_PASSWORD}
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  kbs-redis:
    image: redis:7-alpine
    container_name: kbs_redis
    volumes:
      - redis-data:/data
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  kbs-worker:
    build: .
    container_name: kbs_worker
    command: python -m core.worker
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - .:/app:ro
    depends_on:
      - kbs-redis
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
