{% extends "base.html" %}
{% block title %}Accounting — Kytran Business Suite{% endblock %}
{% block content %}
<div class="kbs-accounting">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h1 style="color:var(--kbs-accent); font-family:'Orbitron',sans-serif;">Accounting</h1>
        <div style="display:flex; gap:0.5rem;">
            <button class="kbs-btn kbs-btn-secondary" id="btn-add-expense">Record Expense</button>
            <button class="kbs-btn kbs-btn-primary" id="btn-add-transaction">Record Transaction</button>
        </div>
    </div>

    <!-- Stats -->
    <div id="acct-stats" class="kbs-stats-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:2rem;"></div>

    <!-- Tabs -->
    <div style="display:flex; gap:0; border-bottom:1px solid var(--kbs-border); margin-bottom:1.5rem;">
        <button class="acct-tab acct-tab-active" data-tab="transactions" style="padding:0.5rem 1.25rem; background:none; border:none; border-bottom:2px solid var(--kbs-accent); color:var(--kbs-accent); cursor:pointer; font-weight:600;">Transactions</button>
        <button class="acct-tab" data-tab="expenses" style="padding:0.5rem 1.25rem; background:none; border:none; border-bottom:2px solid transparent; color:#888; cursor:pointer;">Expenses</button>
        <button class="acct-tab" data-tab="accounts" style="padding:0.5rem 1.25rem; background:none; border:none; border-bottom:2px solid transparent; color:#888; cursor:pointer;">Chart of Accounts</button>
        <button class="acct-tab" data-tab="reports" style="padding:0.5rem 1.25rem; background:none; border:none; border-bottom:2px solid transparent; color:#888; cursor:pointer;">Reports</button>
    </div>

    <!-- Tab panels -->
    <div id="tab-transactions" class="acct-panel"></div>
    <div id="tab-expenses" class="acct-panel" style="display:none;"></div>
    <div id="tab-accounts" class="acct-panel" style="display:none;"></div>
    <div id="tab-reports" class="acct-panel" style="display:none;">
        <div style="display:flex; gap:1rem; margin-bottom:1rem; flex-wrap:wrap;">
            <div>
                <label style="font-size:0.8rem; color:#888; display:block; margin-bottom:0.25rem;">Start Date</label>
                <input type="date" id="rpt-start" style="padding:0.4rem; background:var(--kbs-panel-bg); border:1px solid var(--kbs-border); color:var(--kbs-text); border-radius:4px;">
            </div>
            <div>
                <label style="font-size:0.8rem; color:#888; display:block; margin-bottom:0.25rem;">End Date</label>
                <input type="date" id="rpt-end" style="padding:0.4rem; background:var(--kbs-panel-bg); border:1px solid var(--kbs-border); color:var(--kbs-text); border-radius:4px;">
            </div>
            <div style="display:flex; gap:0.5rem; align-items:flex-end;">
                <button class="kbs-btn kbs-btn-primary" id="btn-pl-report">P&amp;L Report</button>
                <button class="kbs-btn kbs-btn-secondary" id="btn-bs-report">Balance Sheet</button>
                <button class="kbs-btn kbs-btn-secondary" id="btn-exp-summary">Expense Summary</button>
            </div>
        </div>
        <div id="report-output"></div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    loadStats();
    loadTransactions();
    setupTabs();
    setupButtons();
});

async function api(path, opts) {
    opts = opts || {};
    const resp = await fetch("/plugins/accounting" + path, {
        headers: Object.assign({"Content-Type": "application/json"}, opts.headers || {}),
        method: opts.method || "GET",
        body: opts.body,
    });
    return resp.json();
}

function fmtMoney(v) {
    return "$" + parseFloat(v || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function mkStatCard(label, value, color) {
    const card = document.createElement("div");
    card.style.cssText = "background:var(--kbs-panel-bg);border:1px solid var(--kbs-border);border-radius:6px;padding:1rem;";
    const lbl = document.createElement("div");
    lbl.style.cssText = "font-size:0.75rem;color:#888;text-transform:uppercase;margin-bottom:0.4rem;";
    lbl.textContent = label;
    const val = document.createElement("div");
    val.style.cssText = "font-size:1.5rem;font-weight:700;font-family:'Orbitron',sans-serif;color:" + color + ";";
    val.textContent = value;
    card.appendChild(lbl);
    card.appendChild(val);
    return card;
}

function mkStatusBadge(status, bgColor) {
    const span = document.createElement("span");
    span.style.cssText = "font-size:0.75rem;padding:2px 6px;border-radius:3px;background:" + bgColor + ";";
    span.textContent = status;
    return span;
}

async function loadStats() {
    const s = await api("/api/stats");
    const el = document.getElementById("acct-stats");
    el.textContent = "";
    const netColor = parseFloat(s.net_income || 0) >= 0 ? "#22c55e" : "#ef4444";
    el.appendChild(mkStatCard("Revenue (MTD)",  fmtMoney(s.revenue_this_month),  "#22c55e"));
    el.appendChild(mkStatCard("Expenses (MTD)", fmtMoney(s.expenses_this_month), "#ef4444"));
    el.appendChild(mkStatCard("Net Income",     fmtMoney(s.net_income),           netColor));
    el.appendChild(mkStatCard("Accounts",       String(s.account_count),         "var(--kbs-accent)"));
}

function mkTh(text) {
    const th = document.createElement("th");
    th.textContent = text;
    th.style.cssText = "text-align:left;padding:0.5rem;border-bottom:1px solid var(--kbs-border);color:#888;font-size:0.8rem;text-transform:uppercase;";
    return th;
}

function mkTd(text, extra) {
    const td = document.createElement("td");
    td.style.cssText = "padding:0.5rem;border-bottom:1px solid var(--kbs-border);" + (extra || "");
    td.textContent = text;
    return td;
}

async function loadTransactions() {
    const data = await api("/api/transactions");
    const el = document.getElementById("tab-transactions");
    el.textContent = "";
    const tbl = document.createElement("table");
    tbl.style.cssText = "width:100%;border-collapse:collapse;";
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    ["Date", "Description", "Type", "Category", "Amount", "Status"].forEach(h => hr.appendChild(mkTh(h)));
    thead.appendChild(hr);
    tbl.appendChild(thead);
    const tbody = document.createElement("tbody");
    (data.transactions || []).forEach(function(t) {
        const tr = document.createElement("tr");
        const typeColor = t.transaction_type === "income" ? "#22c55e" : "#ef4444";
        tr.appendChild(mkTd(t.date || ""));
        tr.appendChild(mkTd(t.description || ""));
        const typeTd = mkTd(""); typeTd.textContent = t.transaction_type; typeTd.style.color = typeColor; tr.appendChild(typeTd);
        tr.appendChild(mkTd(t.category || "\u2014"));
        const amtTd = mkTd(fmtMoney(t.amount)); amtTd.style.color = typeColor; tr.appendChild(amtTd);
        const statusBg = t.status === "reconciled" ? "#166534" : t.status === "voided" ? "#7f1d1d" : "#1e3a5f";
        const stTd = document.createElement("td");
        stTd.style.cssText = "padding:0.5rem;border-bottom:1px solid var(--kbs-border);";
        stTd.appendChild(mkStatusBadge(t.status, statusBg));
        tr.appendChild(stTd);
        tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    el.appendChild(tbl);
    const total = document.createElement("div");
    total.style.cssText = "margin-top:0.5rem;font-size:0.8rem;color:#888;";
    total.textContent = (data.total || 0) + " transaction(s)";
    el.appendChild(total);
}

async function loadExpenses() {
    const data = await api("/api/expenses");
    const el = document.getElementById("tab-expenses");
    el.textContent = "";
    const tbl = document.createElement("table");
    tbl.style.cssText = "width:100%;border-collapse:collapse;";
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    ["Date", "Vendor", "Description", "Category", "Amount", "Status"].forEach(h => hr.appendChild(mkTh(h)));
    thead.appendChild(hr);
    tbl.appendChild(thead);
    const tbody = document.createElement("tbody");
    (data.expenses || []).forEach(function(e) {
        const tr = document.createElement("tr");
        tr.appendChild(mkTd(e.date || ""));
        tr.appendChild(mkTd(e.vendor || ""));
        tr.appendChild(mkTd(e.description || "\u2014"));
        tr.appendChild(mkTd(e.category || "\u2014"));
        tr.appendChild(mkTd(fmtMoney(e.amount)));
        const statusBg = (e.status === "approved" || e.status === "paid") ? "#166534" : e.status === "voided" ? "#7f1d1d" : "#1e3a5f";
        const stTd = document.createElement("td");
        stTd.style.cssText = "padding:0.5rem;border-bottom:1px solid var(--kbs-border);";
        stTd.appendChild(mkStatusBadge(e.status, statusBg));
        tr.appendChild(stTd);
        tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    el.appendChild(tbl);
}

async function loadAccounts() {
    const data = await api("/api/accounts");
    const el = document.getElementById("tab-accounts");
    el.textContent = "";
    const grouped = data.grouped || {};
    ["asset", "liability", "equity", "revenue", "expense"].forEach(function(type) {
        if (!grouped[type]) return;
        const section = document.createElement("div");
        section.style.cssText = "margin-bottom:1.5rem;";
        const heading = document.createElement("h3");
        heading.style.cssText = "color:var(--kbs-accent);font-family:'Orbitron',sans-serif;font-size:0.9rem;text-transform:uppercase;margin-bottom:0.5rem;";
        heading.textContent = type.charAt(0).toUpperCase() + type.slice(1) + "s";
        section.appendChild(heading);
        const tbl = document.createElement("table");
        tbl.style.cssText = "width:100%;border-collapse:collapse;";
        grouped[type].forEach(function(a) {
            const tr = document.createElement("tr");
            tr.appendChild(mkTd(a.code));
            tr.appendChild(mkTd(a.name));
            tr.appendChild(mkTd(a.sub_type || "\u2014"));
            tr.appendChild(mkTd(fmtMoney(a.balance), "text-align:right;"));
            tbl.appendChild(tr);
        });
        section.appendChild(tbl);
        el.appendChild(section);
    });
}

function renderReport(title, content) {
    const el = document.getElementById("report-output");
    el.textContent = "";
    const h = document.createElement("h3");
    h.style.cssText = "color:var(--kbs-accent);font-family:'Orbitron',sans-serif;margin-bottom:1rem;";
    h.textContent = title;
    el.appendChild(h);
    el.appendChild(content);
}

async function runPLReport() {
    const start = document.getElementById("rpt-start").value;
    const end = document.getElementById("rpt-end").value;
    const params = new URLSearchParams();
    if (start) params.set("start_date", start);
    if (end) params.set("end_date", end);
    const d = await api("/api/reports/profit-loss?" + params.toString());
    const div = document.createElement("div");
    div.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;";
    const netColor = parseFloat(d.net_income || 0) >= 0 ? "#22c55e" : "#ef4444";
    div.appendChild(mkStatCard("Revenue",   fmtMoney(d.revenue),     "#22c55e"));
    div.appendChild(mkStatCard("Expenses",  fmtMoney(d.expenses),    "#ef4444"));
    div.appendChild(mkStatCard("Net Income",fmtMoney(d.net_income),  netColor));
    renderReport("Profit & Loss", div);
}

async function runBSReport() {
    const d = await api("/api/reports/balance-sheet");
    const div = document.createElement("div");
    div.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;";
    div.appendChild(mkStatCard("Assets",      fmtMoney(d.total_assets),      "#22c55e"));
    div.appendChild(mkStatCard("Liabilities", fmtMoney(d.total_liabilities), "#ef4444"));
    div.appendChild(mkStatCard("Equity",      fmtMoney(d.total_equity),      "var(--kbs-accent)"));
    renderReport("Balance Sheet", div);
}

async function runExpSummary() {
    const start = document.getElementById("rpt-start").value;
    const end = document.getElementById("rpt-end").value;
    const params = new URLSearchParams();
    if (start) params.set("start_date", start);
    if (end) params.set("end_date", end);
    const d = await api("/api/reports/expense-summary?" + params.toString());
    const div = document.createElement("div");
    const grandDiv = document.createElement("div");
    grandDiv.style.cssText = "margin-bottom:1rem;font-size:1.1rem;";
    grandDiv.textContent = "Total: " + fmtMoney(d.grand_total);
    div.appendChild(grandDiv);
    const tbl = document.createElement("table");
    tbl.style.cssText = "width:100%;border-collapse:collapse;max-width:500px;";
    (d.by_category || []).forEach(function(row) {
        const tr = document.createElement("tr");
        tr.appendChild(mkTd(row.category));
        tr.appendChild(mkTd(row.count + " items"));
        tr.appendChild(mkTd(fmtMoney(row.total), "text-align:right;"));
        tbl.appendChild(tr);
    });
    div.appendChild(tbl);
    renderReport("Expense Summary", div);
}

function setupTabs() {
    document.querySelectorAll(".acct-tab").forEach(function(btn) {
        btn.addEventListener("click", function() {
            const tab = btn.dataset.tab;
            document.querySelectorAll(".acct-tab").forEach(function(b) {
                b.style.borderBottom = "2px solid transparent";
                b.style.color = "#888";
                b.classList.remove("acct-tab-active");
            });
            btn.style.borderBottom = "2px solid var(--kbs-accent)";
            btn.style.color = "var(--kbs-accent)";
            btn.classList.add("acct-tab-active");
            document.querySelectorAll(".acct-panel").forEach(function(p) { p.style.display = "none"; });
            document.getElementById("tab-" + tab).style.display = "";
            if (tab === "expenses") loadExpenses();
            if (tab === "accounts") loadAccounts();
        });
    });
}

function setupButtons() {
    document.getElementById("btn-pl-report").addEventListener("click", runPLReport);
    document.getElementById("btn-bs-report").addEventListener("click", runBSReport);
    document.getElementById("btn-exp-summary").addEventListener("click", runExpSummary);

    document.getElementById("btn-add-transaction").addEventListener("click", function() {
        const desc = prompt("Description:");
        if (!desc) return;
        const amount = prompt("Amount:");
        if (!amount) return;
        const type = prompt("Type (income/expense/transfer/journal):", "income");
        if (!type) return;
        api("/api/transactions", {
            method: "POST",
            body: JSON.stringify({description: desc, amount: parseFloat(amount), transaction_type: type}),
        }).then(function() { loadStats(); loadTransactions(); });
    });

    document.getElementById("btn-add-expense").addEventListener("click", function() {
        const vendor = prompt("Vendor:");
        if (!vendor) return;
        const amount = prompt("Amount:");
        if (!amount) return;
        const category = prompt("Category (optional):", "");
        api("/api/expenses", {
            method: "POST",
            body: JSON.stringify({vendor: vendor, amount: parseFloat(amount), category: category || null}),
        }).then(function() { loadStats(); });
    });
}
</script>
{% endblock %}
