{% extends "base.html" %}

{% block title %}Appointments{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Appointments</h1>
</div>

<!-- Stats -->
<div id="appt-stats" class="stats-row" style="display:flex;gap:1rem;margin-bottom:1.5rem;">
    <div class="stat-card">
        <div class="stat-label">Total</div>
        <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Upcoming</div>
        <div class="stat-value" id="stat-upcoming">—</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Completed This Month</div>
        <div class="stat-value" id="stat-completed">—</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Cancellation Rate</div>
        <div class="stat-value" id="stat-cancel-rate">—</div>
    </div>
</div>

<!-- Upcoming Appointments Table -->
<div class="panel">
    <div class="panel-header">
        <span>Upcoming Appointments</span>
    </div>
    <div class="panel-body">
        <table class="data-table" id="appointments-table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="appointments-tbody">
                <tr>
                    <td colspan="5" style="text-align:center;opacity:0.5;">Loading…</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
    function loadStats() {
        fetch('/plugins/appointments/api/stats')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                document.getElementById('stat-total').textContent = d.total_appointments ?? '0';
                document.getElementById('stat-upcoming').textContent = d.upcoming_count ?? '0';
                document.getElementById('stat-completed').textContent = d.completed_this_month ?? '0';
                var rate = d.cancellation_rate != null ? d.cancellation_rate + '%' : '0%';
                document.getElementById('stat-cancel-rate').textContent = rate;
            });
    }

    function loadAppointments() {
        var now = new Date().toISOString();
        fetch('/plugins/appointments/api/appointments?start_date=' + encodeURIComponent(now) + '&status=scheduled')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                var tbody = document.getElementById('appointments-tbody');
                while (tbody.firstChild) {
                    tbody.removeChild(tbody.firstChild);
                }
                var list = d.appointments || [];
                if (list.length === 0) {
                    var tr = document.createElement('tr');
                    var td = document.createElement('td');
                    td.colSpan = 5;
                    td.style.textAlign = 'center';
                    td.style.opacity = '0.5';
                    td.textContent = 'No upcoming appointments';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                    return;
                }
                list.forEach(function (a) {
                    var tr = document.createElement('tr');

                    var tdTitle = document.createElement('td');
                    tdTitle.textContent = a.title;

                    var tdType = document.createElement('td');
                    tdType.textContent = a.type_name || '—';

                    var tdStart = document.createElement('td');
                    tdStart.textContent = a.start_time ? new Date(a.start_time).toLocaleString() : '—';

                    var tdEnd = document.createElement('td');
                    tdEnd.textContent = a.end_time ? new Date(a.end_time).toLocaleString() : '—';

                    var tdStatus = document.createElement('td');
                    tdStatus.textContent = a.status;

                    tr.appendChild(tdTitle);
                    tr.appendChild(tdType);
                    tr.appendChild(tdStart);
                    tr.appendChild(tdEnd);
                    tr.appendChild(tdStatus);
                    tbody.appendChild(tr);
                });
            });
    }

    loadStats();
    loadAppointments();
})();
</script>
{% endblock %}
