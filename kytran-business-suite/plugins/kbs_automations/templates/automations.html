{% extends "base.html" %}
{% block title %}Automations — Kytran Business Suite{% endblock %}
{% block content %}
<div class="kbs-automations">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h1 style="color:var(--kbs-accent); font-family:'Orbitron',sans-serif;">Automations Engine</h1>
        <button class="kbs-btn kbs-btn-primary" id="btn-add-workflow">New Workflow</button>
    </div>

    <div id="automations-stats" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin-bottom:2rem;"></div>
    <div id="automations-list"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => { loadStats(); loadWorkflows(); });

async function api(path, opts = {}) {
    const resp = await fetch("/plugins/automations" + path, {
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts
    });
    return resp.json();
}

async function loadStats() {
    const s = await api("/api/stats");
    const el = document.getElementById("automations-stats");
    el.textContent = "";
    [
        ["Total Workflows", s.total_workflows],
        ["Active", s.active_workflows],
        ["Total Executions", s.total_executions],
        ["Success Rate", s.success_rate + "%"]
    ].forEach(([label, value]) => {
        const card = document.createElement("div");
        card.style.cssText = "background:var(--kbs-panel-bg);border:1px solid var(--kbs-border);border-radius:6px;padding:1rem;";
        const lbl = document.createElement("div");
        lbl.style.cssText = "font-size:0.75rem;color:#888;text-transform:uppercase;";
        lbl.textContent = label;
        const val = document.createElement("div");
        val.style.cssText = "font-size:1.5rem;color:var(--kbs-accent);margin-top:0.3rem;";
        val.textContent = value;
        card.appendChild(lbl);
        card.appendChild(val);
        el.appendChild(card);
    });
}

async function loadWorkflows() {
    const data = await api("/api/workflows");
    const el = document.getElementById("automations-list");
    el.textContent = "";

    if (!data.workflows || data.workflows.length === 0) {
        const empty = document.createElement("p");
        empty.style.color = "#888";
        empty.textContent = "No workflows yet. Click 'New Workflow' to create one.";
        el.appendChild(empty);
        return;
    }

    const table = document.createElement("table");
    table.style.cssText = "width:100%;border-collapse:collapse;";

    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");
    ["Name", "Trigger Event", "Active", "Created"].forEach(col => {
        const th = document.createElement("th");
        th.style.cssText = "text-align:left;padding:0.5rem 0.75rem;border-bottom:1px solid var(--kbs-border);color:#888;font-size:0.8rem;text-transform:uppercase;";
        th.textContent = col;
        headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    data.workflows.forEach(wf => {
        const tr = document.createElement("tr");
        tr.style.cssText = "border-bottom:1px solid var(--kbs-border);";

        [
            wf.name,
            wf.trigger_event,
            wf.is_active ? "Yes" : "No",
            new Date(wf.created_at).toLocaleDateString()
        ].forEach((val, i) => {
            const td = document.createElement("td");
            td.style.cssText = "padding:0.6rem 0.75rem;";
            if (i === 0) {
                td.style.color = "var(--kbs-accent)";
                td.style.fontWeight = "500";
            }
            if (i === 2) {
                td.style.color = wf.is_active ? "#22c55e" : "#888";
            }
            td.textContent = val;
            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    el.appendChild(table);
}

document.getElementById("btn-add-workflow").addEventListener("click", () => {
    const name = prompt("Workflow name:");
    if (!name) return;
    const trigger = prompt("Trigger event (e.g. contact.created, order.*):");
    if (!trigger) return;
    api("/api/workflows", {
        method: "POST",
        body: JSON.stringify({ name, trigger_event: trigger })
    }).then(wf => {
        if (wf.error) { alert("Error: " + wf.error); return; }
        loadStats();
        loadWorkflows();
    });
});
</script>
{% endblock %}
