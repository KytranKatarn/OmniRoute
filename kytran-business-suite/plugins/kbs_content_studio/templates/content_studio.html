{% extends "base.html" %}

{% block title %}Content Studio{% endblock %}

{% block content %}
<div class="kbs-module-header">
    <h1>Content Studio</h1>
    <p>Create and manage documents, blog posts, marketing copy, and more.</p>
</div>

<!-- Stats bar -->
<div id="cs-stats" class="kbs-stats-bar">
    <div class="kbs-stat-card">
        <span class="kbs-stat-value" id="stat-total">—</span>
        <span class="kbs-stat-label">Total Documents</span>
    </div>
    <div class="kbs-stat-card">
        <span class="kbs-stat-value" id="stat-published">—</span>
        <span class="kbs-stat-label">Published</span>
    </div>
    <div class="kbs-stat-card">
        <span class="kbs-stat-value" id="stat-draft">—</span>
        <span class="kbs-stat-label">Drafts</span>
    </div>
    <div class="kbs-stat-card">
        <span class="kbs-stat-value" id="stat-words">—</span>
        <span class="kbs-stat-label">Total Words</span>
    </div>
</div>

<!-- Controls -->
<div class="kbs-toolbar">
    <button class="kbs-btn kbs-btn-primary" onclick="csNewDocument()">+ New Document</button>
    <select id="cs-filter-status" onchange="csLoadDocuments()">
        <option value="">All Statuses</option>
        <option value="draft">Draft</option>
        <option value="review">Review</option>
        <option value="published">Published</option>
        <option value="archived">Archived</option>
    </select>
    <select id="cs-filter-type" onchange="csLoadDocuments()">
        <option value="">All Types</option>
        <option value="article">Article</option>
        <option value="blog">Blog</option>
        <option value="marketing">Marketing</option>
        <option value="email">Email</option>
        <option value="social">Social</option>
        <option value="book">Book</option>
        <option value="other">Other</option>
    </select>
</div>

<!-- Documents table -->
<div class="kbs-table-wrapper">
    <table class="kbs-table" id="cs-documents-table">
        <thead>
            <tr>
                <th>Title</th>
                <th>Type</th>
                <th>Status</th>
                <th>Words</th>
                <th>Updated</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="cs-documents-body">
            <tr><td colspan="6">Loading…</td></tr>
        </tbody>
    </table>
</div>

<script>
(function () {
    function api(path, options) {
        return fetch('/plugins/content-studio' + path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options));
    }

    function clearTable(tbody) {
        while (tbody.firstChild) {
            tbody.removeChild(tbody.firstChild);
        }
    }

    function makeCell(value) {
        var td = document.createElement('td');
        td.textContent = value;
        return td;
    }

    window.csLoadDocuments = function () {
        var status = document.getElementById('cs-filter-status').value;
        var docType = document.getElementById('cs-filter-type').value;
        var qs = '';
        if (status) { qs += '?status=' + encodeURIComponent(status); }
        if (docType) { qs += (qs ? '&' : '?') + 'doc_type=' + encodeURIComponent(docType); }

        api('/api/documents' + qs)
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var tbody = document.getElementById('cs-documents-body');
                clearTable(tbody);

                if (!data.documents || data.documents.length === 0) {
                    var tr = document.createElement('tr');
                    var td = document.createElement('td');
                    td.setAttribute('colspan', '6');
                    td.textContent = 'No documents found.';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                    return;
                }

                data.documents.forEach(function (doc) {
                    var tr = document.createElement('tr');
                    tr.appendChild(makeCell(doc.title));
                    tr.appendChild(makeCell(doc.doc_type));
                    tr.appendChild(makeCell(doc.status));
                    tr.appendChild(makeCell(doc.word_count));
                    tr.appendChild(makeCell(doc.updated_at ? doc.updated_at.slice(0, 10) : '—'));

                    var actTd = document.createElement('td');
                    if (doc.status !== 'published') {
                        var pubBtn = document.createElement('button');
                        pubBtn.className = 'kbs-btn kbs-btn-sm';
                        pubBtn.textContent = 'Publish';
                        (function (id) { pubBtn.onclick = function () { csPublish(id); }; }(doc.id));
                        actTd.appendChild(pubBtn);
                    }
                    var delBtn = document.createElement('button');
                    delBtn.className = 'kbs-btn kbs-btn-sm kbs-btn-danger';
                    delBtn.textContent = 'Delete';
                    (function (id) { delBtn.onclick = function () { csDelete(id); }; }(doc.id));
                    actTd.appendChild(delBtn);
                    tr.appendChild(actTd);
                    tbody.appendChild(tr);
                });
            });
    };

    function csLoadStats() {
        api('/api/stats')
            .then(function (r) { return r.json(); })
            .then(function (s) {
                document.getElementById('stat-total').textContent = s.total_documents;
                document.getElementById('stat-published').textContent = s.published_count;
                document.getElementById('stat-draft').textContent = s.draft_count;
                document.getElementById('stat-words').textContent = s.total_words;
            });
    }

    window.csNewDocument = function () {
        var title = prompt('Document title:');
        if (!title) { return; }
        api('/api/documents', {
            method: 'POST',
            body: JSON.stringify({ title: title }),
        }).then(function (r) { return r.json(); })
          .then(function () { csLoadDocuments(); csLoadStats(); });
    };

    window.csPublish = function (id) {
        api('/api/documents/' + id + '/publish', { method: 'POST' })
            .then(function () { csLoadDocuments(); csLoadStats(); });
    };

    window.csDelete = function (id) {
        if (!confirm('Delete this document?')) { return; }
        api('/api/documents/' + id, { method: 'DELETE' })
            .then(function () { csLoadDocuments(); csLoadStats(); });
    };

    csLoadDocuments();
    csLoadStats();
}());
</script>
{% endblock %}
