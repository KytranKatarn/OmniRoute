{% extends "base.html" %}
{% block title %}Contracts & Legal — Kytran Business Suite{% endblock %}
{% block content %}
<div class="kbs-contracts">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h1 style="color:var(--kbs-accent); font-family:'Orbitron',sans-serif;">Contracts &amp; Legal</h1>
        <button class="kbs-btn kbs-btn-primary" id="btn-add-contract">New Contract</button>
    </div>
    <div id="contracts-stats" class="kbs-stats-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:2rem;"></div>
    <div id="contracts-list"></div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => { loadStats(); loadContracts(); });

async function api(path, opts={}) {
    const resp = await fetch("/plugins/contracts" + path, {
        headers: {"Content-Type":"application/json",...(opts.headers||{})}, ...opts
    });
    return resp.json();
}

async function loadStats() {
    const s = await api("/api/stats");
    const el = document.getElementById("contracts-stats");
    el.textContent = "";
    [
        ["Total Contracts", s.total_contracts],
        ["Active", s.active_count],
        ["Expiring (30d)", s.expiring_soon],
        ["Signed Value", s.total_value != null ? "$" + Number(s.total_value).toLocaleString() : "—"]
    ].forEach(([label, val]) => {
        const card = document.createElement("div");
        card.className = "kbs-stat-card";
        card.style.cssText = "background:var(--kbs-panel-bg);border:1px solid var(--kbs-border);border-radius:6px;padding:1rem;";
        const lbl = document.createElement("div");
        lbl.style.cssText = "font-size:0.75rem;color:#888;text-transform:uppercase;margin-bottom:0.25rem;";
        lbl.textContent = label;
        const num = document.createElement("div");
        num.style.cssText = "font-size:1.5rem;font-weight:bold;color:var(--kbs-accent);";
        num.textContent = val != null ? val : "—";
        card.appendChild(lbl);
        card.appendChild(num);
        el.appendChild(card);
    });
}

async function loadContracts(statusFilter) {
    const qs = statusFilter ? "?status=" + encodeURIComponent(statusFilter) : "";
    const data = await api("/api/contracts" + qs);
    const el = document.getElementById("contracts-list");
    el.textContent = "";

    const toolbar = document.createElement("div");
    toolbar.style.cssText = "display:flex;gap:0.5rem;margin-bottom:1rem;";
    ["", "draft","sent","signed","expired"].forEach(s => {
        const btn = document.createElement("button");
        btn.className = "kbs-btn kbs-btn-secondary";
        btn.textContent = s ? s.charAt(0).toUpperCase() + s.slice(1) : "All";
        btn.onclick = () => loadContracts(s || undefined);
        toolbar.appendChild(btn);
    });
    el.appendChild(toolbar);

    if (!data.contracts || data.contracts.length === 0) {
        const empty = document.createElement("p");
        empty.style.color = "#888";
        empty.textContent = "No contracts found.";
        el.appendChild(empty);
        return;
    }

    const table = document.createElement("table");
    table.style.cssText = "width:100%;border-collapse:collapse;";
    const thead = table.createTHead();
    const hrow = thead.insertRow();
    ["Number","Title","Customer","Status","Value","End Date","Actions"].forEach(h => {
        const th = document.createElement("th");
        th.style.cssText = "text-align:left;padding:0.5rem;border-bottom:1px solid var(--kbs-border);color:#888;font-size:0.75rem;text-transform:uppercase;";
        th.textContent = h;
        hrow.appendChild(th);
    });

    const tbody = table.createTBody();
    data.contracts.forEach(c => {
        const row = tbody.insertRow();
        row.style.borderBottom = "1px solid var(--kbs-border)";
        [
            c.contract_number || "—",
            c.title,
            c.customer_id || "—",
            c.status,
            c.value != null ? "$" + Number(c.value).toLocaleString() : "—",
            c.end_date ? c.end_date.substring(0,10) : "—",
        ].forEach(val => {
            const td = row.insertCell();
            td.style.padding = "0.5rem";
            td.textContent = val;
        });
        const actionTd = row.insertCell();
        actionTd.style.padding = "0.5rem";
        const viewBtn = document.createElement("button");
        viewBtn.className = "kbs-btn kbs-btn-secondary";
        viewBtn.style.fontSize = "0.75rem";
        viewBtn.textContent = "View";
        viewBtn.onclick = () => viewContract(c.id);
        actionTd.appendChild(viewBtn);
    });

    el.appendChild(table);
    const total = document.createElement("p");
    total.style.cssText = "color:#888;font-size:0.75rem;margin-top:0.5rem;";
    total.textContent = `Showing ${data.contracts.length} of ${data.total}`;
    el.appendChild(total);
}

async function viewContract(id) {
    const c = await api("/api/contracts/" + id);
    alert(`Contract: ${c.title}\nNumber: ${c.contract_number}\nStatus: ${c.status}\nVersions: ${c.versions ? c.versions.length : 0}`);
}

document.getElementById("btn-add-contract").onclick = async () => {
    const title = prompt("Contract title:");
    if (!title) return;
    const resp = await api("/api/contracts", {
        method: "POST",
        body: JSON.stringify({title})
    });
    if (resp.id) { loadStats(); loadContracts(); }
    else alert("Error: " + (resp.error || "unknown"));
};
</script>
{% endblock %}
