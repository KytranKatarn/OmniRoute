{% extends "base.html" %}
{% block title %}CRM — Kytran Business Suite{% endblock %}
{% block content %}
<div class="kbs-crm">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h1 style="color:var(--kbs-accent); font-family:'Orbitron',sans-serif;">CRM & Contacts</h1>
        <button class="kbs-btn kbs-btn-primary" id="btn-add-customer">Add Customer</button>
    </div>
    <div id="crm-stats" class="kbs-stats-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:2rem;"></div>
    <div id="crm-customers"></div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => { loadStats(); loadCustomers(); });

async function api(path, opts={}) {
    const resp = await fetch("/plugins/crm" + path, {headers:{"Content-Type":"application/json",...(opts.headers||{})},...opts});
    return resp.json();
}

async function loadStats() {
    const s = await api("/api/stats");
    const el = document.getElementById("crm-stats");
    el.textContent = "";
    [["Total",s.total_customers],["Active",s.active_customers],["Leads",s.leads],["New This Month",s.new_this_month]].forEach(([l,v]) => {
        const d = document.createElement("div");
        d.className = "kbs-stat-card";
        d.style.cssText = "background:var(--kbs-panel-bg);border:1px solid var(--kbs-border);border-radius:6px;padding:1rem;";
        const lbl = document.createElement("div");
        lbl.style.cssText = "font-size:0.75rem;color:#888;text-transform:uppercase;";
        lbl.textContent = l;
        const val = document.createElement("div");
        val.style.cssText = "font-size:1.5rem;color:var(--kbs-accent);margin-top:0.3rem;";
        val.textContent = v;
        d.appendChild(lbl); d.appendChild(val); el.appendChild(d);
    });
}

async function loadCustomers() {
    const data = await api("/api/customers");
    const el = document.getElementById("crm-customers");
    el.textContent = "";
    const tbl = document.createElement("table");
    tbl.style.cssText = "width:100%;border-collapse:collapse;";
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    ["Name","Email","Company","Status"].forEach(h => { const th = document.createElement("th"); th.textContent = h; th.style.cssText = "text-align:left;padding:0.5rem;border-bottom:1px solid var(--kbs-border);color:var(--kbs-accent);"; hr.appendChild(th); });
    thead.appendChild(hr); tbl.appendChild(thead);
    const tbody = document.createElement("tbody");
    (data.customers||[]).forEach(c => {
        const tr = document.createElement("tr");
        [c.name, c.email||"-", c.company||"-", c.status].forEach(v => { const td = document.createElement("td"); td.textContent = v; td.style.cssText = "padding:0.5rem;border-bottom:1px solid rgba(255,255,255,0.05);"; tr.appendChild(td); });
        tbody.appendChild(tr);
    });
    tbl.appendChild(tbody); el.appendChild(tbl);
}

document.getElementById("btn-add-customer").addEventListener("click", () => {
    const name = prompt("Customer name:");
    if (!name) return;
    const email = prompt("Email (optional):");
    api("/api/customers", {method:"POST", body:JSON.stringify({name, email: email||undefined})}).then(() => { loadStats(); loadCustomers(); });
});
</script>
{% endblock %}
