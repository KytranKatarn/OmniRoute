{% extends "base.html" %}
{% block title %}Help Desk — Kytran Business Suite{% endblock %}
{% block content %}
<div class="kbs-help-desk">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h1 style="color:var(--kbs-accent); font-family:'Orbitron',sans-serif;">Help Desk</h1>
        <button class="kbs-btn kbs-btn-primary" id="btn-new-ticket">New Ticket</button>
    </div>
    <div id="hd-stats" class="kbs-stats-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:2rem;"></div>
    <div id="hd-tickets"></div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => { loadStats(); loadTickets(); });

async function api(path, opts={}) {
    const resp = await fetch("/plugins/help-desk" + path, {headers:{"Content-Type":"application/json",...(opts.headers||{})},...opts});
    return resp.json();
}

async function loadStats() {
    const s = await api("/api/stats");
    const el = document.getElementById("hd-stats");
    el.textContent = "";
    [
        ["Total Tickets", s.total_tickets],
        ["Open", s.open_tickets],
        ["Avg Resolution (hrs)", s.avg_resolution_hours],
        ["SLA Compliance", s.sla_compliance_rate + "%"]
    ].forEach(([l, v]) => {
        const d = document.createElement("div");
        d.className = "kbs-stat-card";
        d.style.cssText = "background:var(--kbs-panel-bg);border:1px solid var(--kbs-border);border-radius:6px;padding:1rem;";
        const lbl = document.createElement("div");
        lbl.style.cssText = "font-size:0.75rem;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.25rem;";
        lbl.textContent = l;
        const val = document.createElement("div");
        val.style.cssText = "font-size:1.5rem;font-weight:700;color:var(--kbs-accent);";
        val.textContent = v;
        d.appendChild(lbl); d.appendChild(val); el.appendChild(d);
    });
}

async function loadTickets() {
    const data = await api("/api/tickets");
    const el = document.getElementById("hd-tickets");
    el.textContent = "";
    if (!data.tickets || data.tickets.length === 0) {
        const msg = document.createElement("p");
        msg.style.color = "#888";
        msg.textContent = "No tickets yet.";
        el.appendChild(msg);
        return;
    }
    const tbl = document.createElement("table");
    tbl.style.cssText = "width:100%;border-collapse:collapse;";
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    ["#", "Subject", "Status", "Priority", "Assigned To", "Created"].forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        th.style.cssText = "text-align:left;padding:0.5rem 0.75rem;border-bottom:1px solid var(--kbs-border);color:#888;font-size:0.75rem;text-transform:uppercase;";
        hr.appendChild(th);
    });
    thead.appendChild(hr);
    tbl.appendChild(thead);
    const tbody = document.createElement("tbody");
    data.tickets.forEach(t => {
        const tr = document.createElement("tr");
        tr.style.cssText = "border-bottom:1px solid var(--kbs-border);cursor:pointer;";
        tr.onmouseover = () => tr.style.background = "var(--kbs-panel-bg)";
        tr.onmouseout = () => tr.style.background = "";
        [t.ticket_number, t.subject, t.status, t.priority, t.assigned_to || "—",
         t.created_at ? t.created_at.slice(0,10) : ""].forEach(v => {
            const td = document.createElement("td");
            td.textContent = v;
            td.style.cssText = "padding:0.5rem 0.75rem;font-size:0.875rem;";
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    el.appendChild(tbl);
}

document.getElementById("btn-new-ticket").addEventListener("click", async () => {
    const subject = prompt("Ticket subject:");
    if (!subject) return;
    const description = prompt("Description (optional):") || "";
    const priority = prompt("Priority (low/medium/high/urgent):", "medium") || "medium";
    await api("/api/tickets", {
        method: "POST",
        body: JSON.stringify({subject, description, priority})
    });
    loadStats();
    loadTickets();
});
</script>
{% endblock %}
