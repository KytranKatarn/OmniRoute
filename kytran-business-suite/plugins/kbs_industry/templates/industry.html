{% extends "base.html" %}
{% block title %}Industry — Kytran Business Suite{% endblock %}
{% block content %}
<div class="kbs-industry">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h1 style="color:var(--kbs-accent); font-family:'Orbitron',sans-serif;">Industry</h1>
        <button class="kbs-btn kbs-btn-primary" id="btn-add-job">New Job</button>
    </div>

    <!-- Stats -->
    <div id="industry-stats" class="kbs-stats-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin-bottom:2rem;"></div>

    <!-- Jobs table -->
    <div style="margin-bottom:2rem;">
        <h2 style="color:var(--kbs-accent); font-size:1rem; margin-bottom:0.75rem; font-family:'Orbitron',sans-serif;">Active Jobs</h2>
        <div id="industry-jobs"></div>
    </div>

    <!-- Opportunities table -->
    <div>
        <h2 style="color:var(--kbs-accent); font-size:1rem; margin-bottom:0.75rem; font-family:'Orbitron',sans-serif;">Government Opportunities</h2>
        <div id="industry-opps"></div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    loadStats();
    loadJobs();
    loadOpportunities();
    document.getElementById("btn-add-job").addEventListener("click", showAddJobForm);
});

async function api(path, opts) {
    opts = opts || {};
    const resp = await fetch("/plugins/industry" + path, {
        headers: {"Content-Type": "application/json", ...(opts.headers || {})},
        ...opts
    });
    return resp.json();
}

function statCard(label, value) {
    const d = document.createElement("div");
    d.className = "kbs-stat-card";
    d.style.cssText = "background:var(--kbs-panel-bg);border:1px solid var(--kbs-border);border-radius:6px;padding:1rem;";
    const lbl = document.createElement("div");
    lbl.style.cssText = "font-size:0.75rem;color:#888;text-transform:uppercase;margin-bottom:0.25rem;";
    lbl.textContent = label;
    const val = document.createElement("div");
    val.style.cssText = "font-size:1.5rem;font-weight:bold;color:var(--kbs-accent);";
    val.textContent = value;
    d.appendChild(lbl);
    d.appendChild(val);
    return d;
}

async function loadStats() {
    const s = await api("/api/stats");
    const el = document.getElementById("industry-stats");
    el.textContent = "";
    [
        ["Active Jobs", s.active_jobs],
        ["Completed (Month)", s.completed_this_month],
        ["Total Revenue", "$" + (s.total_revenue || 0).toLocaleString("en-CA", {minimumFractionDigits: 2})],
        ["Quoted", s.quoted_jobs],
        ["Pending Permits", s.pending_permits],
        ["New Tenders", s.new_opportunities]
    ].forEach(([l, v]) => el.appendChild(statCard(l, v)));
}

async function loadJobs() {
    const data = await api("/api/jobs");
    const el = document.getElementById("industry-jobs");
    el.textContent = "";
    if (!data.jobs || data.jobs.length === 0) {
        const p = document.createElement("p");
        p.style.color = "#888";
        p.textContent = "No jobs yet.";
        el.appendChild(p);
        return;
    }
    const tbl = document.createElement("table");
    tbl.style.cssText = "width:100%;border-collapse:collapse;";
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    ["Job #","Title","Type","Status","Priority","Assigned To","Created"].forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        th.style.cssText = "text-align:left;padding:0.5rem;border-bottom:1px solid var(--kbs-border);font-size:0.75rem;color:#888;text-transform:uppercase;";
        hr.appendChild(th);
    });
    thead.appendChild(hr);
    tbl.appendChild(thead);
    const tbody = document.createElement("tbody");
    data.jobs.forEach(j => {
        const tr = document.createElement("tr");
        tr.style.cssText = "border-bottom:1px solid var(--kbs-border);cursor:pointer;";
        tr.addEventListener("mouseenter", () => tr.style.background = "var(--kbs-hover-bg, rgba(255,255,255,0.03))");
        tr.addEventListener("mouseleave", () => tr.style.background = "");
        [
            j.job_number || "—",
            j.title,
            j.job_type,
            j.status,
            j.priority,
            j.assigned_to || "—",
            j.created_at ? j.created_at.slice(0,10) : "—"
        ].forEach(val => {
            const td = document.createElement("td");
            td.textContent = val;
            td.style.cssText = "padding:0.6rem 0.5rem;font-size:0.875rem;";
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    el.appendChild(tbl);
}

async function loadOpportunities() {
    const data = await api("/api/opportunities");
    const el = document.getElementById("industry-opps");
    el.textContent = "";
    if (!data.opportunities || data.opportunities.length === 0) {
        const p = document.createElement("p");
        p.style.color = "#888";
        p.textContent = "No opportunities tracked yet.";
        el.appendChild(p);
        return;
    }
    const tbl = document.createElement("table");
    tbl.style.cssText = "width:100%;border-collapse:collapse;";
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    ["Title","Source","Region","Value","Deadline","Status","Score"].forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        th.style.cssText = "text-align:left;padding:0.5rem;border-bottom:1px solid var(--kbs-border);font-size:0.75rem;color:#888;text-transform:uppercase;";
        hr.appendChild(th);
    });
    thead.appendChild(hr);
    tbl.appendChild(thead);
    const tbody = document.createElement("tbody");
    data.opportunities.forEach(o => {
        const tr = document.createElement("tr");
        tr.style.cssText = "border-bottom:1px solid var(--kbs-border);";
        const value = o.value_max
            ? "$" + Number(o.value_max).toLocaleString("en-CA")
            : (o.value_min ? "$" + Number(o.value_min).toLocaleString("en-CA") + "+" : "—");
        [
            o.title.length > 60 ? o.title.slice(0, 60) + "…" : o.title,
            o.source,
            o.region || "—",
            value,
            o.deadline ? o.deadline.slice(0,10) : "—",
            o.status,
            o.match_score + "%"
        ].forEach(val => {
            const td = document.createElement("td");
            td.textContent = val;
            td.style.cssText = "padding:0.6rem 0.5rem;font-size:0.875rem;";
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    el.appendChild(tbl);
}

async function showAddJobForm() {
    const title = window.prompt("Job title:");
    if (!title || !title.trim()) return;
    const resp = await api("/api/jobs", {
        method: "POST",
        body: JSON.stringify({title: title.trim()})
    });
    if (resp.id) {
        await loadStats();
        await loadJobs();
    } else {
        alert(resp.error || "Failed to create job");
    }
}
</script>
{% endblock %}
