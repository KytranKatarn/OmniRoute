{% extends "base.html" %}
{% block title %}Electrical — Kytran Business Suite{% endblock %}
{% block content %}
<div class="kbs-electrical">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h1 style="color:var(--kbs-accent); font-family:'Orbitron',sans-serif;">Electrical</h1>
        <div style="display:flex; gap:0.5rem;">
            <button class="kbs-btn kbs-btn-primary" id="btn-add-panel">New Panel</button>
            <button class="kbs-btn kbs-btn-secondary" id="btn-add-load-calc">Load Calc</button>
            <button class="kbs-btn kbs-btn-secondary" id="btn-add-material">Add Material</button>
        </div>
    </div>

    <!-- Stats -->
    <div id="electrical-stats" class="kbs-stats-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin-bottom:2rem;"></div>

    <!-- Panels -->
    <div style="margin-bottom:2rem;">
        <h2 style="color:var(--kbs-accent); font-size:1rem; margin-bottom:0.75rem; font-family:'Orbitron',sans-serif;">Electrical Panels</h2>
        <div id="electrical-panels"></div>
    </div>

    <!-- Load Calculations -->
    <div style="margin-bottom:2rem;">
        <h2 style="color:var(--kbs-accent); font-size:1rem; margin-bottom:0.75rem; font-family:'Orbitron',sans-serif;">Load Calculations</h2>
        <div id="electrical-load-calcs"></div>
    </div>

    <!-- Materials -->
    <div>
        <h2 style="color:var(--kbs-accent); font-size:1rem; margin-bottom:0.75rem; font-family:'Orbitron',sans-serif;">Materials</h2>
        <div id="electrical-materials"></div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    loadStats();
    loadPanels();
    loadLoadCalcs();
    loadMaterials();
    document.getElementById("btn-add-panel").addEventListener("click", showAddPanelForm);
    document.getElementById("btn-add-load-calc").addEventListener("click", showLoadCalcForm);
    document.getElementById("btn-add-material").addEventListener("click", showAddMaterialForm);
});

async function api(path, opts) {
    opts = opts || {};
    const resp = await fetch("/plugins/industry-electrical" + path, {
        headers: {"Content-Type": "application/json"},
        ...opts
    });
    return resp.json();
}

function statCard(label, value) {
    const d = document.createElement("div");
    d.className = "kbs-stat-card";
    d.style.cssText = "background:var(--kbs-panel-bg);border:1px solid var(--kbs-border);border-radius:6px;padding:1rem;";
    const lbl = document.createElement("div");
    lbl.style.cssText = "font-size:0.75rem;color:#888;text-transform:uppercase;margin-bottom:0.25rem;";
    lbl.textContent = label;
    const val = document.createElement("div");
    val.style.cssText = "font-size:1.5rem;font-weight:bold;color:var(--kbs-accent);";
    val.textContent = String(value);
    d.appendChild(lbl); d.appendChild(val);
    return d;
}

async function loadStats() {
    const s = await api("/api/stats");
    const el = document.getElementById("electrical-stats");
    el.textContent = "";
    [["Panels", s.total_panels], ["Circuits", s.total_circuits],
     ["Materials Needed", s.materials_needed], ["Load Calcs", s.load_calcs_done]
    ].forEach(([l, v]) => el.appendChild(statCard(l, v)));
}

function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function statusColor(s) {
    return {needed:"#f97316",ordered:"#8b5cf6",received:"#22d3ee",installed:"#10b981"}[s] || "#888";
}

async function loadPanels() {
    const data = await api("/api/panels");
    const el = document.getElementById("electrical-panels");
    if (!data.panels || !data.panels.length) {
        el.textContent = "No panels yet.";
        return;
    }
    const table = document.createElement("table");
    table.style.cssText = "width:100%;border-collapse:collapse;";
    table.innerHTML = "<thead><tr><th>Name</th><th>Type</th><th>Amps</th><th>Voltage</th><th>Phases</th><th>Spaces</th><th>Location</th></tr></thead>";
    const tbody = document.createElement("tbody");
    data.panels.forEach(p => {
        const tr = document.createElement("tr");
        const cells = [
            `<a href="#" onclick="viewPanel(${p.id});return false;" style="color:var(--kbs-accent);">${esc(p.name)}</a>`,
            esc(p.panel_type), p.amperage + "A", p.voltage + "V",
            p.phases + "-phase", (p.spaces_used || 0) + "/" + (p.spaces || "—"),
            esc(p.location || "—")
        ];
        tr.innerHTML = cells.map(c => `<td>${c}</td>`).join("");
        tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    el.textContent = "";
    el.appendChild(table);
}

async function viewPanel(id) {
    const p = await api("/api/panels/" + id);
    console.log("Panel detail:", p);
    console.table(p.circuits || []);
    alert("Panel: " + p.name + "\n" + p.amperage + "A " + p.voltage + "V " + p.phases + "-phase\nCircuits: " + (p.circuits || []).length + "\n\nFull detail logged to console.");
}

async function loadLoadCalcs() {
    const data = await api("/api/load-calculations");
    const el = document.getElementById("electrical-load-calcs");
    if (!data.load_calculations || !data.load_calculations.length) {
        el.textContent = "No load calculations yet.";
        return;
    }
    const table = document.createElement("table");
    table.style.cssText = "width:100%;border-collapse:collapse;";
    table.innerHTML = "<thead><tr><th>Building Type</th><th>Sq Ft</th><th>Calculated Load (VA)</th><th>Required Service</th><th>Date</th></tr></thead>";
    const tbody = document.createElement("tbody");
    data.load_calculations.forEach(c => {
        const tr = document.createElement("tr");
        const cells = [
            esc(c.building_type),
            c.total_sqft ? c.total_sqft.toLocaleString() : "—",
            c.total_calculated_load ? parseFloat(c.total_calculated_load).toLocaleString() : "—",
            c.required_service_amps + "A",
            new Date(c.created_at).toLocaleDateString()
        ];
        tr.innerHTML = cells.map(v => `<td>${v}</td>`).join("");
        tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    el.textContent = "";
    el.appendChild(table);
}

async function loadMaterials() {
    const data = await api("/api/materials");
    const el = document.getElementById("electrical-materials");
    if (!data.materials || !data.materials.length) {
        el.textContent = "No materials yet.";
        return;
    }
    const table = document.createElement("table");
    table.style.cssText = "width:100%;border-collapse:collapse;";
    table.innerHTML = "<thead><tr><th>Name</th><th>Category</th><th>Qty</th><th>Unit Cost</th><th>Total</th><th>Supplier</th><th>Status</th></tr></thead>";
    const tbody = document.createElement("tbody");
    data.materials.forEach(m => {
        const tr = document.createElement("tr");
        const sc = statusColor(m.status);
        const badge = `<span style="padding:2px 8px;border-radius:4px;font-size:0.8rem;background:${sc}20;color:${sc};">${esc(m.status)}</span>`;
        const cells = [
            esc(m.name), esc(m.category || "—"),
            m.quantity + " " + esc(m.unit),
            m.unit_cost != null ? "$" + parseFloat(m.unit_cost).toFixed(2) : "—",
            m.total_cost != null ? "$" + parseFloat(m.total_cost).toFixed(2) : "—",
            esc(m.supplier || "—"), badge
        ];
        tr.innerHTML = cells.map(v => `<td>${v}</td>`).join("");
        tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    el.textContent = "";
    el.appendChild(table);
}

async function showAddPanelForm() {
    const name = window.prompt("Panel name (e.g. Main Panel — Basement):");
    if (!name || !name.trim()) return;
    const amperage = window.prompt("Amperage (e.g. 200):");
    if (!amperage) return;
    const resp = await api("/api/panels", {method:"POST", body:JSON.stringify({name:name.trim(), amperage:parseInt(amperage)})});
    if (resp.id) { loadStats(); loadPanels(); } else { alert(resp.error || "Failed to create panel"); }
}

async function showLoadCalcForm() {
    const building_type = window.prompt("Building type (e.g. residential, commercial):");
    if (!building_type || !building_type.trim()) return;
    const total_sqft = window.prompt("Total square footage:");
    if (!total_sqft) return;
    const resp = await api("/api/load-calculations", {method:"POST", body:JSON.stringify({building_type:building_type.trim(), total_sqft:parseInt(total_sqft)})});
    if (resp.id) { loadStats(); loadLoadCalcs(); } else { alert(resp.error || "Failed to create load calculation"); }
}

async function showAddMaterialForm() {
    const name = window.prompt("Material name:");
    if (!name || !name.trim()) return;
    const qty = window.prompt("Quantity:", "1");
    const unit_cost = window.prompt("Unit cost (leave blank to skip):");
    const body = {name:name.trim(), quantity:parseFloat(qty)||1};
    if (unit_cost && unit_cost.trim()) body.unit_cost = parseFloat(unit_cost);
    const resp = await api("/api/materials", {method:"POST", body:JSON.stringify(body)});
    if (resp.id) { loadStats(); loadMaterials(); } else { alert(resp.error || "Failed to add material"); }
}
</script>
{% endblock %}
