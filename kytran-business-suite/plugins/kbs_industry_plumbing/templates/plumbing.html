{% extends "base.html" %}
{% block title %}Plumbing — Kytran Business Suite{% endblock %}
{% block content %}
<div style="padding:1.5rem;">
    <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:0.25rem;display:flex;align-items:center;gap:0.5rem;">
        <i data-feather="droplet"></i> Plumbing
    </h1>
    <p style="color:#888;margin-bottom:1.5rem;">Service calls, fixtures, parts inventory, and backflow testing</p>

    <div id="plumbing-stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem;"></div>

    <div id="plumbing-tabs" style="display:flex;gap:0.5rem;margin-bottom:1rem;border-bottom:1px solid var(--kbs-border,#333);padding-bottom:0.5rem;"></div>

    <div id="tab-service-calls" class="plumbing-panel">
        <div style="display:flex;gap:0.75rem;margin-bottom:1rem;align-items:center;">
            <button id="btn-new-call" style="padding:0.45rem 1rem;background:var(--kbs-accent,#0ea5e9);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.875rem;">+ New Service Call</button>
            <select id="sc-status-filter" style="padding:0.4rem 0.6rem;background:var(--kbs-panel-bg,#1a1a1a);color:inherit;border:1px solid var(--kbs-border,#333);border-radius:4px;font-size:0.875rem;">
                <option value="">All Statuses</option>
                <option value="new">New</option>
                <option value="dispatched">Dispatched</option>
                <option value="en_route">En Route</option>
                <option value="on_site">On Site</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </div>
        <div id="service-calls-list"></div>
    </div>

    <div id="tab-fixtures" class="plumbing-panel" style="display:none;">
        <div style="margin-bottom:1rem;">
            <button id="btn-new-fixture" style="padding:0.45rem 1rem;background:var(--kbs-accent,#0ea5e9);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.875rem;">+ Add Fixture</button>
        </div>
        <div id="fixtures-list"></div>
    </div>

    <div id="tab-inventory" class="plumbing-panel" style="display:none;">
        <div style="display:flex;gap:0.75rem;margin-bottom:1rem;align-items:center;">
            <button id="btn-new-part" style="padding:0.45rem 1rem;background:var(--kbs-accent,#0ea5e9);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.875rem;">+ Add Part</button>
            <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.875rem;cursor:pointer;">
                <input type="checkbox" id="low-stock-filter"> Low Stock Only
            </label>
        </div>
        <div id="inventory-list"></div>
    </div>

    <div id="tab-backflow" class="plumbing-panel" style="display:none;">
        <div style="margin-bottom:1rem;">
            <button id="btn-new-backflow" style="padding:0.45rem 1rem;background:var(--kbs-accent,#0ea5e9);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.875rem;">+ Record Test</button>
        </div>
        <div id="backflow-list"></div>
    </div>
</div>

<script>
(function () {
    "use strict";

    const BASE = "/plugins/industry-plumbing";
    const TABS = [
        { id: "service-calls", label: "Service Calls" },
        { id: "fixtures",      label: "Fixtures" },
        { id: "inventory",     label: "Inventory" },
        { id: "backflow",      label: "Backflow Tests" }
    ];

    // ----------------------------------------------------------------
    // API helper
    // ----------------------------------------------------------------
    async function api(method, path, body) {
        const opts = { method, headers: { "Content-Type": "application/json" } };
        if (body) opts.body = JSON.stringify(body);
        const r = await fetch(BASE + path, opts);
        return r.json();
    }

    // ----------------------------------------------------------------
    // DOM helpers
    // ----------------------------------------------------------------
    function el(tag, style, text) {
        const e = document.createElement(tag);
        if (style) e.style.cssText = style;
        if (text !== undefined) e.textContent = text;
        return e;
    }

    function statCard(label, value, warn) {
        const card = el("div", "background:var(--kbs-panel-bg,#1a1a1a);border:1px solid " +
            (warn ? "#f59e0b" : "var(--kbs-border,#333)") + ";border-radius:6px;padding:1rem;");
        card.appendChild(el("div", "font-size:0.75rem;color:#888;text-transform:uppercase;margin-bottom:0.25rem;", label));
        card.appendChild(el("div", "font-size:1.5rem;font-weight:bold;color:" +
            (warn ? "#f59e0b" : "var(--kbs-accent,#0ea5e9)") + ";", String(value ?? "—")));
        return card;
    }

    function emptyMsg(text) {
        return el("p", "color:#888;padding:1rem 0;", text);
    }

    function badge(text, color) {
        const b = el("span", "display:inline-block;padding:0.15rem 0.5rem;border-radius:3px;" +
            "font-size:0.7rem;font-weight:600;text-transform:uppercase;background:" +
            (color || "rgba(255,255,255,0.1)") + ";color:#fff;", text);
        return b;
    }

    function tableRow(cells, isHeader) {
        const tr = document.createElement("tr");
        tr.style.cssText = "border-bottom:1px solid var(--kbs-border,#333);" +
            (isHeader ? "" : "cursor:default;");
        cells.forEach(text => {
            const td = document.createElement(isHeader ? "th" : "td");
            td.textContent = text || "—";
            td.style.cssText = isHeader
                ? "text-align:left;padding:0.5rem;font-size:0.7rem;color:#888;text-transform:uppercase;"
                : "padding:0.6rem 0.5rem;font-size:0.875rem;";
            tr.appendChild(td);
        });
        if (!isHeader) {
            tr.addEventListener("mouseenter", () => { tr.style.background = "rgba(255,255,255,0.03)"; });
            tr.addEventListener("mouseleave", () => { tr.style.background = ""; });
        }
        return tr;
    }

    function buildTable(headers, rows) {
        const tbl = el("table", "width:100%;border-collapse:collapse;");
        const thead = document.createElement("thead");
        thead.appendChild(tableRow(headers, true));
        tbl.appendChild(thead);
        const tbody = document.createElement("tbody");
        rows.forEach(r => tbody.appendChild(tableRow(r)));
        tbl.appendChild(tbody);
        return tbl;
    }

    // ----------------------------------------------------------------
    // Stats
    // ----------------------------------------------------------------
    async function loadStats() {
        const s = await api("GET", "/api/stats");
        const el2 = document.getElementById("plumbing-stats");
        el2.textContent = "";
        [
            ["Active Calls",       s.active_calls,             false],
            ["Completed Today",    s.completed_today,           false],
            ["Low Stock Items",    s.low_stock_items,           (s.low_stock_items > 0)],
            ["Backflow Due (30d)", s.upcoming_backflow_tests,   false]
        ].forEach(([label, val, warn]) => el2.appendChild(statCard(label, val, warn)));
    }

    // ----------------------------------------------------------------
    // Service Calls
    // ----------------------------------------------------------------
    async function loadServiceCalls() {
        const status = document.getElementById("sc-status-filter").value;
        const qs = status ? "?status=" + encodeURIComponent(status) : "";
        const data = await api("GET", "/api/service-calls" + qs);
        const container = document.getElementById("service-calls-list");
        container.textContent = "";
        if (!data.service_calls || data.service_calls.length === 0) {
            container.appendChild(emptyMsg("No service calls found.")); return;
        }
        container.appendChild(buildTable(
            ["Type", "Priority", "Status", "Description", "Technician", "Scheduled"],
            data.service_calls.map(c => [
                c.call_type,
                c.priority,
                c.status,
                c.description ? (c.description.length > 50 ? c.description.slice(0, 50) + "…" : c.description) : "",
                c.technician || "Unassigned",
                c.scheduled_date ? c.scheduled_date.slice(0, 10) : ""
            ])
        ));
    }

    // ----------------------------------------------------------------
    // Fixtures
    // ----------------------------------------------------------------
    async function loadFixtures() {
        const data = await api("GET", "/api/fixtures");
        const container = document.getElementById("fixtures-list");
        container.textContent = "";
        if (!data.fixtures || data.fixtures.length === 0) {
            container.appendChild(emptyMsg("No fixtures recorded.")); return;
        }
        container.appendChild(buildTable(
            ["Type", "Brand", "Model", "Location", "Status", "Install Date", "Warranty Expiry"],
            data.fixtures.map(f => [
                f.fixture_type,
                f.brand || "",
                f.model || "",
                f.location || "",
                f.status,
                f.install_date ? f.install_date.slice(0, 10) : "",
                f.warranty_expiry ? f.warranty_expiry.slice(0, 10) : ""
            ])
        ));
    }

    // ----------------------------------------------------------------
    // Inventory
    // ----------------------------------------------------------------
    async function loadInventory() {
        const low = document.getElementById("low-stock-filter").checked ? "?low_stock=1" : "";
        const data = await api("GET", "/api/inventory" + low);
        const container = document.getElementById("inventory-list");
        container.textContent = "";
        if (!data.parts || data.parts.length === 0) {
            container.appendChild(emptyMsg("No parts in inventory.")); return;
        }
        container.appendChild(buildTable(
            ["Name", "Category", "SKU", "Qty", "Min Qty", "Unit Cost", "Supplier", "Location"],
            data.parts.map(p => [
                p.name,
                p.category || "",
                p.sku || "",
                String(p.quantity),
                String(p.min_quantity),
                p.unit_cost != null ? "$" + Number(p.unit_cost).toFixed(2) : "",
                p.supplier || "",
                p.location || ""
            ])
        ));
    }

    // ----------------------------------------------------------------
    // Backflow Tests
    // ----------------------------------------------------------------
    async function loadBackflowTests() {
        const data = await api("GET", "/api/backflow-tests");
        const container = document.getElementById("backflow-list");
        container.textContent = "";
        if (!data.backflow_tests || data.backflow_tests.length === 0) {
            container.appendChild(emptyMsg("No backflow tests recorded.")); return;
        }
        container.appendChild(buildTable(
            ["Device Location", "Type", "Serial #", "Test Date", "Tester", "Result", "Next Test", "Cert #"],
            data.backflow_tests.map(t => [
                t.device_location,
                t.device_type || "",
                t.serial_number || "",
                t.test_date ? t.test_date.slice(0, 10) : "",
                t.tester_name || "",
                t.test_result,
                t.next_test_date ? t.next_test_date.slice(0, 10) : "",
                t.certification_number || ""
            ])
        ));
    }

    // ----------------------------------------------------------------
    // Tab system
    // ----------------------------------------------------------------
    const LOADERS = {
        "service-calls": loadServiceCalls,
        "fixtures":      loadFixtures,
        "inventory":     loadInventory,
        "backflow":      loadBackflowTests
    };
    let activeTab = "service-calls";

    function buildTabs() {
        const bar = document.getElementById("plumbing-tabs");
        TABS.forEach(({ id, label }) => {
            const btn = el("button", "padding:0.45rem 1rem;border:none;border-radius:4px 4px 0 0;cursor:pointer;" +
                "font-size:0.875rem;background:transparent;color:#888;", label);
            btn.dataset.tab = id;
            btn.addEventListener("click", () => switchTab(id));
            bar.appendChild(btn);
        });
        switchTab("service-calls");
    }

    function switchTab(id) {
        activeTab = id;
        TABS.forEach(({ id: tid }) => {
            const panel = document.getElementById("tab-" + tid);
            if (panel) panel.style.display = (tid === id) ? "" : "none";
        });
        document.querySelectorAll("#plumbing-tabs button").forEach(btn => {
            const active = btn.dataset.tab === id;
            btn.style.cssText = "padding:0.45rem 1rem;border:none;border-radius:4px 4px 0 0;cursor:pointer;" +
                "font-size:0.875rem;" +
                (active
                    ? "background:var(--kbs-panel-bg,#1a1a1a);color:var(--kbs-accent,#0ea5e9);font-weight:600;"
                    : "background:transparent;color:#888;");
        });
        if (LOADERS[id]) LOADERS[id]();
    }

    // ----------------------------------------------------------------
    // Quick-add prompts (minimal — real modals are future work)
    // ----------------------------------------------------------------
    function setupButtons() {
        document.getElementById("sc-status-filter").addEventListener("change", loadServiceCalls);
        document.getElementById("low-stock-filter").addEventListener("change", loadInventory);

        document.getElementById("btn-new-call").addEventListener("click", async () => {
            const call_type = window.prompt("Call type (emergency/repair/installation/maintenance/inspection/drain/backflow):");
            if (!call_type || !call_type.trim()) return;
            const resp = await api("POST", "/api/service-calls", { call_type: call_type.trim() });
            if (resp.id) { await loadStats(); await loadServiceCalls(); }
            else alert(resp.error || "Failed to create service call");
        });

        document.getElementById("btn-new-fixture").addEventListener("click", async () => {
            const fixture_type = window.prompt("Fixture type (toilet/sink/faucet/shower/bathtub/water_heater/disposal/dishwasher/washer/other):");
            if (!fixture_type || !fixture_type.trim()) return;
            const resp = await api("POST", "/api/fixtures", { fixture_type: fixture_type.trim() });
            if (resp.id) { await loadFixtures(); }
            else alert(resp.error || "Failed to add fixture");
        });

        document.getElementById("btn-new-part").addEventListener("click", async () => {
            const name = window.prompt("Part name:");
            if (!name || !name.trim()) return;
            const resp = await api("POST", "/api/inventory", { name: name.trim() });
            if (resp.id) { await loadStats(); await loadInventory(); }
            else alert(resp.error || "Failed to add part");
        });

        document.getElementById("btn-new-backflow").addEventListener("click", async () => {
            const device_location = window.prompt("Device location:");
            if (!device_location || !device_location.trim()) return;
            const test_date = window.prompt("Test date (YYYY-MM-DD):");
            if (!test_date || !test_date.trim()) return;
            const resp = await api("POST", "/api/backflow-tests", {
                device_location: device_location.trim(),
                test_date: test_date.trim()
            });
            if (resp.id) { await loadStats(); await loadBackflowTests(); }
            else alert(resp.error || "Failed to record backflow test");
        });
    }

    // ----------------------------------------------------------------
    // Init
    // ----------------------------------------------------------------
    document.addEventListener("DOMContentLoaded", () => {
        buildTabs();
        loadStats();
        setupButtons();
        if (typeof feather !== "undefined") feather.replace();
    });
}());
</script>
{% endblock %}
