{% extends "base.html" %}
{% block title %}Salon — Kytran Business Suite{% endblock %}
{% block content %}
<div style="padding:1.5rem;">
    <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:0.25rem;display:flex;align-items:center;gap:0.5rem;">
        <i data-feather="scissors"></i> Salon &amp; Hairdressing
    </h1>
    <p style="color:#888;margin-bottom:1.5rem;">Services, stylists, bookings, product inventory, and client history</p>

    <div id="salon-stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem;"></div>

    <div id="salon-tabs" style="display:flex;gap:0.5rem;margin-bottom:1rem;border-bottom:1px solid var(--kbs-border,#333);padding-bottom:0.5rem;"></div>

    <!-- Bookings tab -->
    <div id="tab-bookings" class="salon-panel">
        <div style="display:flex;gap:0.75rem;margin-bottom:1rem;align-items:center;flex-wrap:wrap;">
            <button id="btn-new-booking" style="padding:0.45rem 1rem;background:var(--kbs-accent,#0ea5e9);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.875rem;">+ New Booking</button>
            <select id="booking-stylist-filter" style="padding:0.4rem 0.6rem;background:var(--kbs-panel-bg,#1a1a1a);color:inherit;border:1px solid var(--kbs-border,#333);border-radius:4px;font-size:0.875rem;">
                <option value="">All Stylists</option>
            </select>
            <select id="booking-status-filter" style="padding:0.4rem 0.6rem;background:var(--kbs-panel-bg,#1a1a1a);color:inherit;border:1px solid var(--kbs-border,#333);border-radius:4px;font-size:0.875rem;">
                <option value="">All Statuses</option>
                <option value="scheduled">Scheduled</option>
                <option value="confirmed">Confirmed</option>
                <option value="in_chair">In Chair</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
                <option value="no_show">No Show</option>
            </select>
        </div>
        <div id="bookings-list"></div>
    </div>

    <!-- Services tab -->
    <div id="tab-services" class="salon-panel" style="display:none;">
        <div style="margin-bottom:1rem;">
            <button id="btn-new-service" style="padding:0.45rem 1rem;background:var(--kbs-accent,#0ea5e9);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.875rem;">+ Add Service</button>
        </div>
        <div id="services-list"></div>
    </div>

    <!-- Stylists tab -->
    <div id="tab-stylists" class="salon-panel" style="display:none;">
        <div style="margin-bottom:1rem;">
            <button id="btn-new-stylist" style="padding:0.45rem 1rem;background:var(--kbs-accent,#0ea5e9);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.875rem;">+ Add Stylist</button>
        </div>
        <div id="stylists-list"></div>
    </div>

    <!-- Inventory tab -->
    <div id="tab-inventory" class="salon-panel" style="display:none;">
        <div style="display:flex;gap:0.75rem;margin-bottom:1rem;align-items:center;">
            <button id="btn-new-product" style="padding:0.45rem 1rem;background:var(--kbs-accent,#0ea5e9);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.875rem;">+ Add Product</button>
            <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.875rem;cursor:pointer;">
                <input type="checkbox" id="low-stock-only"> Low stock only
            </label>
        </div>
        <div id="inventory-list"></div>
    </div>

    <!-- Client History tab -->
    <div id="tab-history" class="salon-panel" style="display:none;">
        <div id="history-list"></div>
    </div>
</div>

<script src="{{ url_for('industry_salon.static', filename='js/salon.js') }}"></script>
{% endblock %}
