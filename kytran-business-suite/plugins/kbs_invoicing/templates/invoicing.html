{% extends "base.html" %}
{% block title %}Invoicing — Kytran Business Suite{% endblock %}
{% block content %}
<div class="kbs-invoicing">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h1 style="color:var(--kbs-accent); font-family:'Orbitron',sans-serif;">Invoicing & Billing</h1>
        <button class="kbs-btn kbs-btn-primary" id="btn-add-invoice">New Invoice</button>
    </div>
    <div id="inv-stats" class="kbs-stats-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:2rem;"></div>
    <div id="inv-list"></div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => { loadStats(); loadInvoices(); });

async function api(path, opts={}) {
    const resp = await fetch("/plugins/invoicing" + path, {headers:{"Content-Type":"application/json",...(opts.headers||{})},...opts});
    return resp.json();
}

async function loadStats() {
    const s = await api("/api/stats");
    const el = document.getElementById("inv-stats");
    el.textContent = "";
    [
        ["Total", s.total_invoices],
        ["Paid", s.paid_count],
        ["Outstanding", "$" + (parseFloat(s.outstanding_total)||0).toFixed(2)],
        ["Overdue", s.overdue_count]
    ].forEach(([l, v]) => {
        const d = document.createElement("div");
        d.className = "kbs-stat-card";
        d.style.cssText = "background:var(--kbs-panel-bg);border:1px solid var(--kbs-border);border-radius:6px;padding:1rem;";
        const lbl = document.createElement("div");
        lbl.style.cssText = "font-size:0.75rem;color:#888;text-transform:uppercase;";
        lbl.textContent = l;
        const val = document.createElement("div");
        val.style.cssText = "font-size:1.5rem;color:var(--kbs-accent);margin-top:0.3rem;";
        val.textContent = v;
        d.appendChild(lbl); d.appendChild(val); el.appendChild(d);
    });
}

async function loadInvoices() {
    const data = await api("/api/invoices");
    const el = document.getElementById("inv-list");
    el.textContent = "";
    const tbl = document.createElement("table");
    tbl.style.cssText = "width:100%;border-collapse:collapse;";
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    ["Invoice #", "Customer", "Status", "Total", "Balance Due", "Due Date"].forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        th.style.cssText = "text-align:left;padding:0.5rem;border-bottom:1px solid var(--kbs-border);color:var(--kbs-accent);";
        hr.appendChild(th);
    });
    thead.appendChild(hr); tbl.appendChild(thead);
    const tbody = document.createElement("tbody");
    (data.invoices || []).forEach(inv => {
        const tr = document.createElement("tr");
        [
            inv.invoice_number,
            inv.customer_name || "-",
            inv.status,
            "$" + (parseFloat(inv.total)||0).toFixed(2),
            "$" + (parseFloat(inv.balance_due)||0).toFixed(2),
            inv.due_date ? inv.due_date.substring(0,10) : "-"
        ].forEach(v => {
            const td = document.createElement("td");
            td.textContent = v;
            td.style.cssText = "padding:0.5rem;border-bottom:1px solid rgba(255,255,255,0.05);";
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
    tbl.appendChild(tbody); el.appendChild(tbl);
}
</script>
{% endblock %}
