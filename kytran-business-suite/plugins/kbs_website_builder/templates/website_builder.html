{% extends "base.html" %}

{% block title %}Website Builder — KBS{% endblock %}

{% block content %}
<div class="kbs-module-header">
    <h1 class="kbs-module-title">Website Builder</h1>
    <button class="kbs-btn kbs-btn-primary" onclick="openCreateProject()">+ New Project</button>
</div>

<div class="kbs-stats-row" id="wb-stats">
    <div class="kbs-stat-card">
        <span class="kbs-stat-label">Total Projects</span>
        <span class="kbs-stat-value" id="stat-total-projects">—</span>
    </div>
    <div class="kbs-stat-card">
        <span class="kbs-stat-label">Published Sites</span>
        <span class="kbs-stat-value" id="stat-published-sites">—</span>
    </div>
    <div class="kbs-stat-card">
        <span class="kbs-stat-label">Total Pages</span>
        <span class="kbs-stat-value" id="stat-total-pages">—</span>
    </div>
    <div class="kbs-stat-card">
        <span class="kbs-stat-label">Recent Deployments</span>
        <span class="kbs-stat-value" id="stat-recent-deployments">—</span>
    </div>
</div>

<div class="kbs-section">
    <h2 class="kbs-section-title">Projects</h2>
    <div id="wb-projects-list" class="kbs-list">
        <p class="kbs-empty">Loading projects...</p>
    </div>
</div>

<!-- Create Project Modal -->
<div id="modal-create-project" class="kbs-modal-overlay" style="display:none">
    <div class="kbs-modal">
        <div class="kbs-modal-header">
            <h3>New Website Project</h3>
            <button onclick="closeModal('modal-create-project')">&times;</button>
        </div>
        <div class="kbs-modal-body">
            <label class="kbs-label">Project Name *</label>
            <input id="cp-name" class="kbs-input" type="text" placeholder="My Website">
            <label class="kbs-label">Description</label>
            <textarea id="cp-description" class="kbs-input" rows="2" placeholder="Optional description"></textarea>
            <label class="kbs-label">Domain</label>
            <input id="cp-domain" class="kbs-input" type="text" placeholder="example.com">
        </div>
        <div class="kbs-modal-footer">
            <button class="kbs-btn kbs-btn-secondary" onclick="closeModal('modal-create-project')">Cancel</button>
            <button class="kbs-btn kbs-btn-primary" onclick="submitCreateProject()">Create Project</button>
        </div>
    </div>
</div>

<script>
    const WB_BASE = "/plugins/website-builder";

    function wbEsc(s) {
        const d = document.createElement("div");
        d.textContent = s || "";
        return d.innerHTML;
    }

    async function wbApi(method, path, body) {
        const opts = { method, headers: { "Content-Type": "application/json" } };
        if (body) opts.body = JSON.stringify(body);
        const r = await fetch(WB_BASE + path, opts);
        return r.json();
    }

    function openCreateProject() {
        document.getElementById("modal-create-project").style.display = "flex";
    }

    function closeModal(id) {
        document.getElementById(id).style.display = "none";
    }

    async function submitCreateProject() {
        const name = document.getElementById("cp-name").value.trim();
        if (!name) { alert("Project name is required"); return; }
        const payload = {
            name,
            description: document.getElementById("cp-description").value.trim() || null,
            domain: document.getElementById("cp-domain").value.trim() || null,
        };
        const result = await wbApi("POST", "/api/projects", payload);
        if (result.error) { alert(result.error); return; }
        closeModal("modal-create-project");
        loadWbProjects();
        loadWbStats();
    }

    async function loadWbStats() {
        const s = await wbApi("GET", "/api/stats");
        document.getElementById("stat-total-projects").textContent = s.total_projects ?? "0";
        document.getElementById("stat-published-sites").textContent = s.published_sites ?? "0";
        document.getElementById("stat-total-pages").textContent = s.total_pages ?? "0";
        document.getElementById("stat-recent-deployments").textContent = s.recent_deployments ?? "0";
    }

    function buildProjectRow(p) {
        const row = document.createElement("div");
        row.className = "kbs-list-item";

        const main = document.createElement("div");
        main.className = "kbs-list-item-main";

        const title = document.createElement("span");
        title.className = "kbs-list-item-title";
        title.textContent = p.name;
        main.appendChild(title);

        const badge = document.createElement("span");
        badge.className = "kbs-badge kbs-badge-" + p.status;
        badge.textContent = p.status;
        main.appendChild(badge);

        if (p.domain) {
            const domain = document.createElement("span");
            domain.className = "kbs-list-item-meta";
            domain.textContent = p.domain;
            main.appendChild(domain);
        }

        const actions = document.createElement("div");
        actions.className = "kbs-list-item-actions";

        if (p.status !== "published") {
            const pubBtn = document.createElement("button");
            pubBtn.className = "kbs-btn kbs-btn-sm kbs-btn-success";
            pubBtn.textContent = "Publish";
            pubBtn.addEventListener("click", () => publishWbProject(p.id));
            actions.appendChild(pubBtn);
        }

        if (p.status === "draft") {
            const delBtn = document.createElement("button");
            delBtn.className = "kbs-btn kbs-btn-sm kbs-btn-danger";
            delBtn.textContent = "Delete";
            delBtn.addEventListener("click", () => deleteWbProject(p.id));
            actions.appendChild(delBtn);
        }

        row.appendChild(main);
        row.appendChild(actions);
        return row;
    }

    async function loadWbProjects() {
        const data = await wbApi("GET", "/api/projects");
        const el = document.getElementById("wb-projects-list");
        el.textContent = "";
        if (!data.projects || data.projects.length === 0) {
            const p = document.createElement("p");
            p.className = "kbs-empty";
            p.textContent = "No projects yet. Create your first website project.";
            el.appendChild(p);
            return;
        }
        data.projects.forEach(p => el.appendChild(buildProjectRow(p)));
    }

    async function publishWbProject(id) {
        if (!confirm("Publish this project?")) return;
        const r = await wbApi("POST", "/api/projects/" + id + "/publish");
        if (r.error) { alert(r.error); return; }
        loadWbProjects();
        loadWbStats();
    }

    async function deleteWbProject(id) {
        if (!confirm("Delete this draft project?")) return;
        const r = await wbApi("DELETE", "/api/projects/" + id);
        if (r.error) { alert(r.error); return; }
        loadWbProjects();
        loadWbStats();
    }

    loadWbStats();
    loadWbProjects();
</script>
{% endblock %}
