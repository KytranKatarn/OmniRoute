{% extends "base.html" %}
{% block title %}Admin Dashboard — Kytran Business Suite{% endblock %}
{% block content %}
<div class="kbs-page">
  <div class="kbs-container">
    <div class="kbs-dashboard-header">
      <h1>Platform Admin Dashboard</h1>
      <p>Kytran Empowerment Inc. — Business Intelligence</p>
    </div>

    <hr class="kbs-divider" />

    <!-- KPI Cards -->
    <div id="admin-kpis" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:1rem; margin-bottom:2rem;">
    </div>

    <!-- Two-column layout -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;" id="admin-charts">
      <!-- Tier Breakdown -->
      <div class="kbs-module-card">
        <h3 style="color:var(--kbs-accent); font-family:'Orbitron',sans-serif; font-size:0.95rem; margin-bottom:1rem;">Tier Breakdown</h3>
        <div id="admin-tier-chart"></div>
      </div>

      <!-- Plugin Popularity -->
      <div class="kbs-module-card">
        <h3 style="color:var(--kbs-accent); font-family:'Orbitron',sans-serif; font-size:0.95rem; margin-bottom:1rem;">Plugin Popularity (Top 15)</h3>
        <div id="admin-plugin-chart"></div>
      </div>

      <!-- Client Health -->
      <div class="kbs-module-card">
        <h3 style="color:var(--kbs-accent); font-family:'Orbitron',sans-serif; font-size:0.95rem; margin-bottom:1rem;">Client Health</h3>
        <div id="admin-health"></div>
      </div>
    </div>
  </div>
</div>

<style>
  @media (max-width: 768px) {
    #admin-charts { grid-template-columns: 1fr !important; }
  }
</style>

<script>
(function(){
  function addKpi(container, label, value, color) {
    var card = document.createElement('div');
    card.className = 'kbs-module-card';
    card.style.textAlign = 'center';
    var valDiv = document.createElement('div');
    valDiv.style.cssText = 'font-size:1.4rem;font-weight:bold;color:' + (color || 'var(--kbs-accent)') + ';';
    valDiv.textContent = value;
    var lblDiv = document.createElement('div');
    lblDiv.style.cssText = 'font-size:0.7rem;color:#888;margin-top:0.25rem;text-transform:uppercase;';
    lblDiv.textContent = label;
    card.appendChild(valDiv);
    card.appendChild(lblDiv);
    container.appendChild(card);
  }

  function barChart(container, items, maxVal, color) {
    items.forEach(function(item) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem;';
      var label = document.createElement('div');
      label.style.cssText = 'width:100px;font-size:0.75rem;color:#aaa;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      label.textContent = item.label;
      label.title = item.label;
      var barBg = document.createElement('div');
      barBg.style.cssText = 'flex:1;height:14px;background:#1a1a2e;border-radius:2px;overflow:hidden;';
      var bar = document.createElement('div');
      var pct = maxVal > 0 ? (item.value / maxVal * 100) : 0;
      bar.style.cssText = 'height:100%;border-radius:2px;background:' + (color || '#22d3ee') + ';width:' + pct + '%;';
      barBg.appendChild(bar);
      var val = document.createElement('div');
      val.style.cssText = 'width:30px;font-size:0.75rem;color:#ccc;';
      val.textContent = item.value;
      row.appendChild(label);
      row.appendChild(barBg);
      row.appendChild(val);
      container.appendChild(row);
    });
  }

  fetch('/admin/api/metrics')
  .then(function(r){ return r.json(); })
  .then(function(d) {
    var kpis = document.getElementById('admin-kpis');
    addKpi(kpis, 'Total Tenants', d.total_tenants, '#22d3ee');
    addKpi(kpis, 'MRR (CAD)', '$' + d.total_mrr.toLocaleString(), '#10b981');
    addKpi(kpis, 'New Signups (30d)', d.new_signups_30d, '#8b5cf6');
    addKpi(kpis, 'Churn Rate', d.churn_rate + '%', d.churn_rate > 5 ? '#ef4444' : '#22d3ee');
    addKpi(kpis, 'Active Trials', d.active_trials, '#f59e0b');

    /* Tier breakdown */
    var tierDiv = document.getElementById('admin-tier-chart');
    var tierColors = {free: '#22d3ee', business: '#8b5cf6', enterprise: '#f59e0b'};
    var tierItems = Object.entries(d.tier_breakdown || {}).map(function(e) {
      return {label: e[0], value: e[1]};
    });
    var tierMax = Math.max.apply(null, tierItems.map(function(i){ return i.value; }).concat([1]));
    tierItems.forEach(function(item) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;';
      var label = document.createElement('div');
      label.style.cssText = 'width:80px;font-size:0.8rem;color:#aaa;text-transform:capitalize;';
      label.textContent = item.label;
      var barBg = document.createElement('div');
      barBg.style.cssText = 'flex:1;height:18px;background:#1a1a2e;border-radius:3px;overflow:hidden;';
      var bar = document.createElement('div');
      bar.style.cssText = 'height:100%;border-radius:3px;background:' + (tierColors[item.label]||'#888') + ';width:' + (item.value/tierMax*100) + '%;';
      barBg.appendChild(bar);
      var val = document.createElement('div');
      val.style.cssText = 'width:30px;font-size:0.8rem;color:#ccc;';
      val.textContent = item.value;
      row.appendChild(label);
      row.appendChild(barBg);
      row.appendChild(val);
      tierDiv.appendChild(row);
    });

    /* Plugin popularity */
    var pluginDiv = document.getElementById('admin-plugin-chart');
    var plugins = (d.plugin_heatmap || []).slice(0, 15);
    var pluginMax = plugins.length > 0 ? plugins[0].count : 1;
    barChart(pluginDiv, plugins.map(function(p){ return {label: p.slug, value: p.count}; }), pluginMax, '#8b5cf6');

    /* Client health */
    var healthDiv = document.getElementById('admin-health');
    var h = d.client_health || {};
    var healthItems = [
      {label: 'Active (7d)', value: h.active_7d || 0, color: '#10b981'},
      {label: 'Active (30d)', value: h.active_30d || 0, color: '#22d3ee'},
      {label: 'Inactive', value: h.inactive || 0, color: '#ef4444'},
    ];
    healthItems.forEach(function(item) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid #222;';
      var lbl = document.createElement('span');
      lbl.style.cssText = 'color:#aaa;font-size:0.85rem;';
      lbl.textContent = item.label;
      var val = document.createElement('span');
      val.style.cssText = 'font-weight:bold;color:' + item.color + ';';
      val.textContent = item.value;
      row.appendChild(lbl);
      row.appendChild(val);
      healthDiv.appendChild(row);
    });
  })
  .catch(function(e) {
    var kpis = document.getElementById('admin-kpis');
    var err = document.createElement('p');
    err.style.color = '#ef4444';
    err.textContent = 'Failed to load metrics. You may not have admin access.';
    kpis.appendChild(err);
  });
})();
</script>
{% endblock %}
