{% extends "base.html" %}

{% block title %}Module Marketplace — Kytran Business Suite{% endblock %}

{% block content %}
<div class="kbs-page">
  <div class="kbs-container">
    <div class="kbs-dashboard-header">
      <h1>Module Marketplace</h1>
      <p>Discover and activate plugins to extend your workspace.</p>
    </div>

    <hr class="kbs-divider" />

    <!-- Filters -->
    <div style="display:flex; flex-wrap:wrap; gap:0.75rem; margin-bottom:1.5rem; align-items:center;">
      <input type="text" id="mp-search" placeholder="Search plugins..."
        style="flex:1; min-width:200px; padding:0.5rem 0.75rem; background:var(--kbs-input-bg,#1a1a2e);
               color:var(--kbs-text,#e0e0e0); border:1px solid var(--kbs-border,#333); border-radius:4px;
               font-size:0.9rem;" />
      <select id="mp-cat-filter"
        style="padding:0.5rem; background:var(--kbs-input-bg,#1a1a2e); color:var(--kbs-text,#e0e0e0);
               border:1px solid var(--kbs-border,#333); border-radius:4px;">
        <option value="">All Categories</option>
      </select>
      <select id="mp-tier-filter"
        style="padding:0.5rem; background:var(--kbs-input-bg,#1a1a2e); color:var(--kbs-text,#e0e0e0);
               border:1px solid var(--kbs-border,#333); border-radius:4px;">
        <option value="">All Tiers</option>
        <option value="free">Free</option>
        <option value="business">Business</option>
        <option value="enterprise">Enterprise</option>
        <option value="addon">Add-on</option>
      </select>
      <select id="mp-status-filter"
        style="padding:0.5rem; background:var(--kbs-input-bg,#1a1a2e); color:var(--kbs-text,#e0e0e0);
               border:1px solid var(--kbs-border,#333); border-radius:4px;">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="trial">Trial</option>
      </select>
    </div>

    <!-- Current Plan -->
    <div id="mp-plan-badge" style="margin-bottom:1rem; font-size:0.85rem; color:#888;"></div>

    <!-- Plugin Grid -->
    <div id="mp-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:1rem;">
    </div>

    <!-- Empty state -->
    <div id="mp-empty" style="display:none; text-align:center; padding:3rem; color:#666;">
      <p>No plugins match your filters.</p>
    </div>

    <!-- Detail Modal -->
    <div id="mp-modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7);
         z-index:1000; align-items:center; justify-content:center;">
      <div id="mp-modal" style="background:var(--kbs-card-bg,#16162a); border:1px solid var(--kbs-border,#333);
           border-radius:8px; max-width:500px; width:90%; max-height:80vh; overflow-y:auto; padding:1.5rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h2 id="mp-modal-title" style="color:var(--kbs-accent); font-family:'Orbitron',sans-serif;
              font-size:1.1rem; margin:0;"></h2>
          <button onclick="closeModal()" style="background:none; border:none; color:#888; font-size:1.3rem;
                  cursor:pointer;">&times;</button>
        </div>
        <p id="mp-modal-desc" style="color:#aaa; font-size:0.85rem; line-height:1.5;"></p>
        <div id="mp-modal-features" style="margin:1rem 0;"></div>
        <div id="mp-modal-pricing" style="margin:1rem 0; font-size:0.9rem;"></div>
        <div id="mp-modal-status" style="margin:1rem 0;"></div>
        <div id="mp-modal-actions" style="display:flex; gap:0.5rem; flex-wrap:wrap;"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* Marketplace UI — all dynamic content sanitized via esc() or textContent */
(function(){
  let allPlugins = [];
  let currentTier = 'free';

  /* Sanitize user content: creates a text node, reads back safe HTML */
  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  const tierColors = {
    free: '#22d3ee',
    business: '#8b5cf6',
    enterprise: '#f59e0b',
    addon: '#f472b6',
  };

  function createTierBadge(tier) {
    const c = tierColors[tier] || '#888';
    const span = document.createElement('span');
    span.style.cssText = 'display:inline-block;padding:2px 8px;border-radius:3px;font-size:0.7rem;text-transform:uppercase;background:'+c+'22;color:'+c+';border:1px solid '+c+'44;';
    span.textContent = tier;
    return span;
  }

  function createStatusDot(plugin) {
    const span = document.createElement('span');
    if (plugin.trial_active) { span.style.color = '#f59e0b'; span.title = 'Trial'; }
    else if (plugin.is_active) { span.style.color = '#22d3ee'; span.title = 'Active'; }
    else { span.style.color = '#444'; span.title = 'Inactive'; }
    span.textContent = '\u25CF';
    return span;
  }

  function renderCard(p) {
    const card = document.createElement('div');
    card.className = 'kbs-module-card';
    card.style.cssText = 'cursor:pointer; position:relative;';
    card.onmouseover = function(){ this.style.borderColor='var(--kbs-accent)'; };
    card.onmouseout = function(){ this.style.borderColor='var(--kbs-border)'; };
    card.onclick = function(){ openModal(p.slug); };

    /* Header row */
    const header = document.createElement('div');
    header.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;';
    const title = document.createElement('div');
    title.style.cssText = 'font-size:1rem;color:var(--kbs-accent);font-weight:bold;';
    title.textContent = p.name;
    const badges = document.createElement('div');
    badges.appendChild(createStatusDot(p));
    badges.appendChild(document.createTextNode(' '));
    badges.appendChild(createTierBadge(p.tier_required));
    header.appendChild(title);
    header.appendChild(badges);
    card.appendChild(header);

    /* Description */
    const desc = document.createElement('div');
    desc.style.cssText = 'font-size:0.8rem;color:#888;line-height:1.4;margin-bottom:0.5rem;';
    const descText = (p.description || '').substring(0, 100);
    desc.textContent = descText + (p.description && p.description.length > 100 ? '...' : '');
    card.appendChild(desc);

    /* Price */
    if (p.price_monthly) {
      const price = document.createElement('div');
      price.style.cssText = 'font-size:0.8rem;color:#aaa;';
      price.textContent = '$' + p.price_monthly + '/mo CAD';
      card.appendChild(price);
    }

    return card;
  }

  function applyFilters() {
    const search = document.getElementById('mp-search').value.toLowerCase();
    const cat = document.getElementById('mp-cat-filter').value;
    const tier = document.getElementById('mp-tier-filter').value;
    const status = document.getElementById('mp-status-filter').value;

    const grid = document.getElementById('mp-grid');
    while (grid.firstChild) grid.removeChild(grid.firstChild);
    let count = 0;

    allPlugins.forEach(function(p) {
      if (search && !p.name.toLowerCase().includes(search) && !(p.description||'').toLowerCase().includes(search)) return;
      if (cat && p.category !== cat) return;
      if (tier && p.tier_required !== tier) return;
      if (status === 'active' && !p.is_active) return;
      if (status === 'inactive' && p.is_active) return;
      if (status === 'trial' && !p.trial_active) return;

      grid.appendChild(renderCard(p));
      count++;
    });

    document.getElementById('mp-empty').style.display = count === 0 ? 'block' : 'none';
  }

  function populateCategories() {
    const cats = [...new Set(allPlugins.map(function(p){ return p.category; }).filter(Boolean))].sort();
    const sel = document.getElementById('mp-cat-filter');
    cats.forEach(function(c) {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c.charAt(0).toUpperCase() + c.slice(1);
      sel.appendChild(opt);
    });
  }

  window.openModal = function(slug) {
    const p = allPlugins.find(function(x){ return x.slug === slug; });
    if (!p) return;

    document.getElementById('mp-modal-title').textContent = p.name;
    document.getElementById('mp-modal-desc').textContent = p.description || '';

    /* Features list */
    const featDiv = document.getElementById('mp-modal-features');
    while (featDiv.firstChild) featDiv.removeChild(featDiv.firstChild);
    if (p.features && p.features.length) {
      const label = document.createElement('div');
      label.style.cssText = 'font-size:0.85rem;color:#aaa;margin-bottom:0.5rem;';
      label.textContent = 'Features:';
      featDiv.appendChild(label);
      const ul = document.createElement('ul');
      ul.style.cssText = 'margin:0;padding-left:1.2rem;';
      p.features.forEach(function(f) {
        const li = document.createElement('li');
        li.style.cssText = 'color:#ccc;font-size:0.8rem;';
        li.textContent = f;
        ul.appendChild(li);
      });
      featDiv.appendChild(ul);
    }

    /* Pricing */
    const priceDiv = document.getElementById('mp-modal-pricing');
    priceDiv.textContent = '';
    if (p.included_in_tier) {
      priceDiv.style.color = '#22d3ee';
      priceDiv.textContent = 'Included in your ' + currentTier + ' plan';
    } else if (p.price_monthly) {
      priceDiv.style.color = '#aaa';
      priceDiv.textContent = '$' + p.price_monthly + '/mo CAD';
    } else if (p.needs_upgrade) {
      priceDiv.style.color = '#f59e0b';
      priceDiv.textContent = 'Requires ' + p.tier_required + ' plan';
    }

    /* Status */
    const statusDiv = document.getElementById('mp-modal-status');
    statusDiv.textContent = '';
    if (p.trial_active) {
      statusDiv.style.color = '#f59e0b';
      statusDiv.textContent = 'Trial active until ' + (p.trial_ends_at ? new Date(p.trial_ends_at).toLocaleDateString() : 'N/A');
    } else if (p.is_active) {
      statusDiv.style.color = '#22d3ee';
      statusDiv.textContent = 'Active (' + p.source + ')';
    } else {
      statusDiv.style.color = '#666';
      statusDiv.textContent = 'Not active';
    }

    /* Action buttons — built with DOM API */
    const actDiv = document.getElementById('mp-modal-actions');
    while (actDiv.firstChild) actDiv.removeChild(actDiv.firstChild);

    if (!p.is_active) {
      const actBtn = document.createElement('button');
      actBtn.className = 'kbs-btn kbs-btn-primary';
      if (p.included_in_tier || p.tier_required === 'free') {
        actBtn.textContent = 'Activate';
      } else if (p.needs_upgrade) {
        actBtn.style.cssText = 'background:#f59e0b;color:#000;';
        actBtn.textContent = 'Upgrade to Unlock';
      } else {
        actBtn.textContent = 'Purchase ($' + (p.price_monthly||'') + '/mo)';
      }
      actBtn.onclick = function(){ doActivate(p.slug); };
      actDiv.appendChild(actBtn);

      if (!p.trial_active && p.tier_required !== 'free') {
        const trialBtn = document.createElement('button');
        trialBtn.className = 'kbs-btn';
        trialBtn.style.cssText = 'background:transparent;border:1px solid #f59e0b;color:#f59e0b;';
        trialBtn.textContent = 'Start 14-Day Trial';
        trialBtn.onclick = function(){ doTrial(p.slug); };
        actDiv.appendChild(trialBtn);
      }
    } else if (p.source !== 'tier_included') {
      const deactBtn = document.createElement('button');
      deactBtn.className = 'kbs-btn';
      deactBtn.style.cssText = 'background:#ef4444;color:#fff;';
      deactBtn.textContent = 'Deactivate';
      deactBtn.onclick = function(){ doDeactivate(p.slug); };
      actDiv.appendChild(deactBtn);
    }

    document.getElementById('mp-modal-overlay').style.display = 'flex';
  };

  window.closeModal = function() {
    document.getElementById('mp-modal-overlay').style.display = 'none';
  };

  document.getElementById('mp-modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  function apiAction(url, method, cb) {
    fetch(url, { method: method, headers: {'Content-Type':'application/json'} })
      .then(function(r){ return r.json().then(function(d){ return {data:d, status:r.status}; }); })
      .then(cb)
      .catch(function(e){ alert('Error: '+e.message); });
  }

  window.doActivate = function(slug) {
    apiAction('/marketplace/api/plugins/'+encodeURIComponent(slug)+'/activate', 'POST', function(r) {
      if (r.data.checkout_url) {
        window.location.href = r.data.checkout_url;
      } else if (r.data.status === 'activated') {
        closeModal();
        loadPlugins();
      } else if (r.data.status === 'upgrade_required') {
        alert(r.data.message || 'Upgrade required');
      } else {
        alert(r.data.error || 'Activation failed');
      }
    });
  };

  window.doTrial = function(slug) {
    apiAction('/marketplace/api/plugins/'+encodeURIComponent(slug)+'/trial', 'POST', function(r) {
      if (r.data.status === 'trial_started') {
        closeModal();
        loadPlugins();
      } else {
        alert(r.data.error || 'Could not start trial');
      }
    });
  };

  window.doDeactivate = function(slug) {
    if (!confirm('Deactivate this plugin? You will lose access to its features.')) return;
    apiAction('/marketplace/api/plugins/'+encodeURIComponent(slug)+'/deactivate', 'POST', function(r) {
      if (r.data.status === 'deactivated') {
        closeModal();
        loadPlugins();
      } else {
        alert(r.data.error || 'Deactivation failed');
      }
    });
  };

  function loadPlugins() {
    fetch('/marketplace/api/plugins')
      .then(function(r){ return r.json(); })
      .then(function(data) {
        allPlugins = data.plugins || [];
        currentTier = data.current_tier || 'free';
        var planDiv = document.getElementById('mp-plan-badge');
        while (planDiv.firstChild) planDiv.removeChild(planDiv.firstChild);
        planDiv.appendChild(document.createTextNode('Current plan: '));
        planDiv.appendChild(createTierBadge(currentTier));
        var link = document.createElement('a');
        link.href = '/onboarding?step=3';
        link.style.cssText = 'color:var(--kbs-accent);margin-left:0.5rem;font-size:0.8rem;';
        link.textContent = 'Change plan';
        planDiv.appendChild(link);
        populateCategories();
        applyFilters();
      })
      .catch(function(e){
        var grid = document.getElementById('mp-grid');
        var err = document.createElement('p');
        err.style.color = '#ef4444';
        err.textContent = 'Failed to load plugins: ' + e.message;
        grid.appendChild(err);
      });
  }

  document.getElementById('mp-search').addEventListener('input', applyFilters);
  document.getElementById('mp-cat-filter').addEventListener('change', applyFilters);
  document.getElementById('mp-tier-filter').addEventListener('change', applyFilters);
  document.getElementById('mp-status-filter').addEventListener('change', applyFilters);

  loadPlugins();
})();
</script>
{% endblock %}
