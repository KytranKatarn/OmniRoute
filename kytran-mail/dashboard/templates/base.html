<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kytran Mail{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/kytran-mail.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>
    <nav class="km-nav">
        <div class="km-logo">KYTRAN MAIL</div>
        <div class="km-nav-right">
            <span class="km-domain">{{ config.MAIL_DOMAIN }}</span>
            <a href="https://{{ config.MAIL_HOSTNAME }}:8443" target="_blank" rel="noopener" class="km-btn-sm">STALWART ADMIN</a>
        </div>
    </nav>

    <main class="km-main">
        {% block content %}{% endblock %}
    </main>

    <div id="toast-container"></div>

    <script src="{{ url_for('static', filename='js/kytran-mail.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
