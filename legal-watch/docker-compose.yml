services:
  legal-api:
    build: .
    container_name: kytran_legal_api
    restart: unless-stopped
    ports:
      - "8100:8080"
    env_file: .env
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret}
      - KYTRAN_CLIENT_ID=${KYTRAN_CLIENT_ID:-legal-watch}
      - KYTRAN_CLIENT_SECRET=${KYTRAN_CLIENT_SECRET:-}
      - KYTRAN_AUTH_URL=${KYTRAN_AUTH_URL:-https://archie.kytranempowerment.com}
      - KYTRAN_REDIRECT_URI=${KYTRAN_REDIRECT_URI:-https://legal.kytranempowerment.com/auth/kytran/callback}
    volumes:
      - legal_data:/app/data
      - ./static:/app/static:ro
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp

volumes:
  legal_data:
