services:
  legal-api:
    build: .
    container_name: kytran_legal_api
    restart: unless-stopped
    ports:
      - "8100:8080"
    volumes:
      - legal_data:/app/data
      - ./static:/app/static:ro
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp

volumes:
  legal_data:
