services:
  kytran_market_api:
    build: .
    container_name: kytran_market_api
    ports:
      - "8101:8080"
    volumes:
      - market_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - MW_DB_PATH=/app/data/market.db
      - KYTRAN_CLIENT_ID=${KYTRAN_CLIENT_ID:-market-watch-viewer}
      - KYTRAN_CLIENT_SECRET=${KYTRAN_CLIENT_SECRET:-}
      - KYTRAN_AUTH_URL=${KYTRAN_AUTH_URL:-http://192.168.1.200:3000}
      - KYTRAN_REDIRECT_URI=${KYTRAN_REDIRECT_URI:-http://192.168.1.200:8101/auth/kytran/callback}
      - ARCHIE_HUB_URL=http://192.168.1.200:3000
      - ARCHIE_SERVICE_TOKEN=${ARCHIE_SERVICE_TOKEN:-}
      - CORS_ORIGINS=https://market.kytranempowerment.com,http://192.168.1.200:8101
      - RATELIMIT_STORAGE_URI=memory://
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-}
      - ALPACA_BASE_URL=https://paper-api.alpaca.markets
      # Risk Gates
      - MW_MIN_ORACLE_CONFIDENCE=${MW_MIN_ORACLE_CONFIDENCE:-0.65}
      - MW_MAX_DAILY_LOSS_PCT=${MW_MAX_DAILY_LOSS_PCT:-3.0}
      - MW_MAX_DRAWDOWN_PCT=${MW_MAX_DRAWDOWN_PCT:-5.0}
      - MW_MAX_POSITIONS=${MW_MAX_POSITIONS:-5}
      - MW_MAX_POSITION_PCT=${MW_MAX_POSITION_PCT:-10.0}
      - MW_MAX_SECTOR_POSITIONS=${MW_MAX_SECTOR_POSITIONS:-2}
      - MW_VOLATILITY_ATR_LIMIT=${MW_VOLATILITY_ATR_LIMIT:-5.0}
      - MW_COOLOFF_LOSS_PCT=${MW_COOLOFF_LOSS_PCT:-2.0}
      # Position Management
      - MW_DEFAULT_HOLD_DAYS=${MW_DEFAULT_HOLD_DAYS:-5}
      # Cycle Control
      - MW_CYCLE_DEDUP_MINUTES=${MW_CYCLE_DEDUP_MINUTES:-15}
      # Safety (DRY_RUN defaults true in Docker — safe by default)
      - MW_DRY_RUN=${MW_DRY_RUN:-true}
      - MW_TRADING_ENABLED=${MW_TRADING_ENABLED:-true}
      - MW_LIVE_TRADING=${MW_LIVE_TRADING:-false}
      # News / Alpha Vantage
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY:-}
      - ALPHAVANTAGE_NEWS_ENABLED=${ALPHAVANTAGE_NEWS_ENABLED:-true}
      - NEWS_INGEST_INTERVAL=${NEWS_INGEST_INTERVAL:-900}
      - NEWS_MAX_AGE_MINUTES=${NEWS_MAX_AGE_MINUTES:-30}
      # Position Monitoring
      - MW_POSITION_CHECK_INTERVAL=${MW_POSITION_CHECK_INTERVAL:-60}
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    restart: unless-stopped

volumes:
  market_data:
