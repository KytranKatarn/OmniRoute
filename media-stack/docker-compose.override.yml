# TRANSITIONAL compose override — TV migration off the failing /dev/sdb (#5384 / #5441)
#
# Converted (HEVC) shows live on the healthy disk at /mnt/data2/plex/tv; not-yet-converted
# shows are still on /mnt/Plex/media/tv (sdb, FAILING). Both must be visible at once, so
# each finished show is bind-mounted over its slot inside the existing /tv mount.
#
# WHY NOT A SYMLINK: /mnt/Plex/media/tv is itself a bind mount. A symlink placed INSIDE it
# points at a host path outside the container's mount namespace and DANGLES in the
# container. Movies get away with a symlink only because there the symlink IS the bind
# SOURCE, which Docker resolves at container-create time.
# See section 8 of /mnt/data2/backups/media-migration/2026-07-30-media-migration-plan.md
#
# ⚠️ COMPOSE AUTO-LOADS THIS FILE. The filename `docker-compose.override.yml` is picked up
#    automatically by `docker compose` in this directory — that is the point of committing
#    it, and it is also why its CONTENTS ARE LOAD-BEARING. Every show listed here is a show
#    the containers serve from data2; every show NOT listed falls through to
#    /mnt/Plex/media/tv, which for an already-migrated show is an EMPTY PLACEHOLDER.
#
#    A pre-commit copy exists at /mnt/data2/backups/media-migration/media-stack-override.yml.
#    THIS FILE IS NOW CANONICAL — do not edit that copy; keep it in step or retire it.
#
# APPLY:
#   cd /mnt/archie_brain/media-stack && docker compose up -d --no-deps plex jellyfin sonarr
#
# 🔴 HOW THIS FILE ROTS INTO A HAZARD (it did, between 2026-07-31 and 2026-08-01):
#    When it was first written the sdb originals still existed, so a missing show block
#    merely meant "served from the old disk" — harmless. Once the originals were deleted on
#    2026-08-01, a missing block became "served from an EMPTY DIRECTORY": the show vanishes
#    and Sonarr, which MONITORS it, starts re-downloading every episode.
#    The diff never changed; the world underneath it did.
#    ⇒ When a show is migrated, ADD ITS BLOCK HERE IN THE SAME CHANGE.
#
# 🔴 DELETING THE ORIGINALS: the host dir /mnt/Plex/media/tv/<Show> IS the container's
#    MOUNTPOINT for the nested bind (because /tv is itself a bind of that tree).
#    `rm -rf` on it yanks the mountpoint out from under the live mount and the show
#    VANISHES from Plex/Jellyfin/Sonarr, even though the data on data2 is fine.
#    Happened 2026-08-01 with Friends + Ghosts; ~2 min of lost visibility.
#    CORRECT ORDER:
#      1. rm -rf "/mnt/Plex/media/tv/<Show>"          (reclaims the failing disk)
#      2. mkdir -p + chown 1000:1000 the SAME path    (empty placeholder mountpoint)
#      3. docker compose up -d --force-recreate --no-deps plex jellyfin sonarr
#    Leave the empty placeholder in place - it exists ONLY to be mounted over.
#
# 🔴 NEVER BIND A SHOW WITH INCOMPLETE COVERAGE. The nested bind REPLACES the whole show
#    directory view — it does not merge with what is underneath. Bind a show that is only
#    250/279 converted and Plex/Jellyfin/Sonarr see 250; the other 29 read as MISSING, and
#    because the series is MONITORED, Sonarr will happily start RE-DOWNLOADING episodes that
#    still exist on the failing disk one directory below.
#    Gate every bind on an SxxExx-level coverage check (0 missing), not on a file COUNT.
#    ⚠️ And count ALL video extensions: Friends is 215 .mkv + 42 .mp4 = 257. An mkv-only
#    `find` reports 42 missing and looks exactly like a broken mount.
#
# ADD ONE BLOCK PER SHOW as it finishes converting, then re-apply the command above.
# When EVERY show is converted, drop this file and repoint the base /tv bind at
# /mnt/data2/plex/tv instead (single clean mount, no per-show entries).
#
# COVERAGE AT TIME OF WRITING (all six verified serving in plex + jellyfin + sonarr):
# Friends:             257/257 verified on data2, 341.6 GB -> 266.0 GB (2026-07-31)
# Ghosts (US):          93/93  verified on data2, 141.8 GB -> 104.1 GB (2026-08-01)
# Full House:          192/192 — ALREADY HEVC, never needed converting. Came across in the
#                      2026-07-30 rescue copy, so this is a pure relocation.
# The Rookie:          144/144 verified on data2, 359.7 GB -> 263.9 GB (2026-08-01).
#                      Episode-level coverage checked by SxxExx, not just file count:
#                      0 missing, 0 extra, 0 duplicates.
#                      AUDIO FIXED: 32 episodes had a foreign track FIRST (German across most
#                      of S02, Portuguese S07E18, Turkish S08E13) so players defaulted to it.
#                      All 144 now have English as track 1 with disposition:default=1;
#                      foreign tracks are kept, demoted. Two untagged single-track rips
#                      (S08E17/S08E18) were tagged 'eng'. Verified per-file by
#                      verify_audio_lang.py, not by trusting the fix script's summary — that
#                      summary reports 132 of 144 and does NOT reconcile.
# The Big Bang Theory: 279/279 verified on data2, 310.6 GB -> 263.3 GB (2026-08-01).
#                      AUDIO FIXED: 24 episodes had German/French first (S04 worst).
# Rick and Morty:       90/91  on data2, 94.9 GB -> 93.9 GB (2026-08-01).
#                      AUDIO FIXED: 17 episodes had French first (S05/S06).
#                      The 91st (S02E08) is a DELIBERATE gap — see the sonarr block below.
#
# ⚠️ Jellyfin caches per-file MediaStreams. Because the bind keeps the container path
#    identical, remuxing audio makes Jellyfin serve the NEW file while still reporting the
#    OLD track order. `POST /Library/Refresh` does NOT fix this (it only detects new/changed
#    files) — you need a per-series `POST /Items/{id}/Refresh?metadataRefreshMode=FullRefresh`.
#    Verify what the PLAYER believes (check_jellyfin_audio.py), not just what is on disk
#    (verify_audio_lang.py).

services:
  plex:
    volumes:
      - /mnt/data2/plex/tv/Friends:/tv/Friends:ro
      - "/mnt/data2/plex/tv/Ghosts (US):/tv/Ghosts (US):ro"
      - "/mnt/data2/plex/tv/Full House:/tv/Full House:ro"
      - "/mnt/data2/plex/tv/The Rookie:/tv/The Rookie:ro"
      - "/mnt/data2/plex/tv/The Big Bang Theory:/tv/The Big Bang Theory:ro"
      - "/mnt/data2/plex/tv/Rick and Morty:/tv/Rick and Morty:ro"
      - /mnt/fast/config/plex:/config

  jellyfin:
    volumes:
      - /mnt/data2/plex/tv/Friends:/data/tv/Friends:ro
      - "/mnt/data2/plex/tv/Ghosts (US):/data/tv/Ghosts (US):ro"
      - "/mnt/data2/plex/tv/Full House:/data/tv/Full House:ro"
      - "/mnt/data2/plex/tv/The Rookie:/data/tv/The Rookie:ro"
      - "/mnt/data2/plex/tv/The Big Bang Theory:/data/tv/The Big Bang Theory:ro"
      - "/mnt/data2/plex/tv/Rick and Morty:/data/tv/Rick and Morty:ro"
      - /mnt/fast/config/jellyfin:/config
      - /mnt/fast/config/jellyfin/cache:/cache

  sonarr:
    volumes:
      - /mnt/data2/plex/tv/Friends:/tv/Friends
      - "/mnt/data2/plex/tv/Ghosts (US):/tv/Ghosts (US)"
      - "/mnt/data2/plex/tv/Full House:/tv/Full House"
      - "/mnt/data2/plex/tv/The Rookie:/tv/The Rookie"
      - "/mnt/data2/plex/tv/The Big Bang Theory:/tv/The Big Bang Theory"
      # Rick and Morty is 90/91 ON PURPOSE. S02E08 was PHYSICALLY UNREADABLE off the failing
      # disk (Unrecovered read error, sector 2902459968) so it was never copied. Binding at
      # 90/91 makes Sonarr see it missing and RE-DOWNLOAD it — which is the only way to get a
      # working copy, since the sdb original is corrupt. This is the deliberate exception to
      # the "never bind incomplete coverage" rule above.
      - "/mnt/data2/plex/tv/Rick and Morty:/tv/Rick and Morty"
      - /mnt/data2/downloads:/downloads

  # DOWNLOADS moved off the failing disk 2026-08-01. Container path stays /downloads,
  # so SABnzbd/Sonarr/Radarr need NO app-level reconfiguration - only the host side moves.
  # data2 (not the SSD) on purpose: the TV library is on data2, so Sonarr/Radarr keep doing
  # instant HARDLINK imports. Downloads on the SSD would be a different filesystem and force
  # slow full copies. The SSD also only has ~20 GB free after the movie library.
  radarr:
    volumes:
      - /mnt/data2/downloads:/downloads

  sabnzbd:
    volumes:
      - /mnt/data2/downloads:/downloads
      - /mnt/fast/config/sabnzbd:/config

  # CONFIGS moved off the failing disk to the SSD 2026-08-01 (its originally intended role).
  # sonarr/radarr/prowlarr configs already live on /mnt/data2/plex-config from the #5384
  # cutover and were left there - already on healthy storage.
  # NOTE jellyfin needs BOTH binds: its /cache is a SUBDIRECTORY of the config dir.
  overseerr:
    volumes:
      - /mnt/fast/config/overseerr:/config
