services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.0
    container_name: media_plex
    network_mode: host
    extra_hosts:
      - "plex.tv:35.172.142.61"
      - "app.plex.tv:172.64.151.205"
      - "clients.plex.tv:172.64.151.205"
      - "status.plex.tv:76.76.21.164"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - VERSION=docker
    volumes:
      - /mnt/fast/config/plex:/config
      - /mnt/data2/plex/movies:/movies:ro
      - /mnt/data2/plex/tv:/tv:ro
      - /mnt/data2/plex/music:/music:ro
      - /mnt/data2/plex/photos:/photos:ro
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:10.11
    container_name: media_jellyfin
    dns:
      - 192.168.1.200
      - 1.1.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /mnt/fast/config/jellyfin:/config
      - /mnt/fast/config/jellyfin/cache:/cache
      - /mnt/data2/plex/movies:/data/movies:ro
      - /mnt/data2/plex/tv:/data/tv:ro
      - /mnt/data2/plex/music:/data/music:ro
    ports:
      - "8096:8096"
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17
    container_name: media_sonarr
    dns:
      - 192.168.1.200
      - 1.1.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      # ⚠️ config lives on /mnt/data2 (physical /dev/sdf), NOT /mnt/Plex, and the
      # difference from the media/downloads paths below is DELIBERATE, not drift.
      # /mnt/Plex is physical /dev/sdb: 1760 pending + 1760 uncorrectable sectors.
      # Sonarr's SQLite DB was found MALFORMED there on 2026-07-29 with all four
      # scheduled backups corrupt too (#5384). Databases do not belong on that
      # disk. Media can stay — a bad sector costs one file, not the whole library.
      # (LVM names mislead: VG `sda-vg` is on /dev/sdb, VG `sdb-vg` on /dev/sdf.
      #  Use `pvs`, never `df`. KB #285461.)
      - /mnt/data2/plex-config/sonarr:/config
      - /mnt/data2/plex/tv:/tv
      - /mnt/data2/downloads:/downloads
    ports:
      - "8989:8989"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.1.1
    container_name: media_radarr
    dns:
      - 192.168.1.200
      - 1.1.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      # config on /dev/sdf, media on /dev/sdb — deliberate, see the sonarr note above (#5384)
      - /mnt/data2/plex-config/radarr:/config
      - /mnt/data2/plex/movies:/movies
      - /mnt/data2/downloads:/downloads
    ports:
      - "7878:7878"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.5
    container_name: media_prowlarr
    dns:
      - 192.168.1.200
      - 1.1.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      # config on /dev/sdf — deliberate, see the sonarr note above (#5384)
      - /mnt/data2/plex-config/prowlarr:/config
    ports:
      - "9696:9696"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  overseerr:
    image: lscr.io/linuxserver/overseerr:1.35.0
    container_name: media_overseerr
    dns:
      - 192.168.1.200
      - 1.1.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /mnt/fast/config/overseerr:/config
    ports:
      - "5055:5055"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:4.5.5
    container_name: media_sabnzbd
    dns:
      - 192.168.1.200
      - 1.1.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /mnt/fast/config/sabnzbd:/config
      - /mnt/data2/downloads:/downloads
    ports:
      - "8083:8080"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    restart: unless-stopped
