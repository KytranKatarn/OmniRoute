version: '3.8'

services:
  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: homeassistant
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /mnt/HomeLab/homeassistant:/config
    ports:
      - "8123:8123"
    restart: unless-stopped

  whisper:
    image: rhasspy/wyoming-whisper
    container_name: ha_whisper
    command: --model tiny-int8 --language en
    volumes:
      - /mnt/HomeLab/whisper-data:/data
    ports:
      - "10300:10300"
    restart: unless-stopped

  piper:
    image: rhasspy/wyoming-piper
    container_name: ha_piper
    command: --voice en_US-lessac-medium
    volumes:
      - /mnt/HomeLab/piper-data:/data
    ports:
      - "10200:10200"
    restart: unless-stopped
