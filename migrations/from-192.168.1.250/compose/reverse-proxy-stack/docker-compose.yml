version: '3.8'

services:
  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - /mnt/HomeLab/nginx-proxy/data:/data
      - /mnt/HomeLab/nginx-proxy/letsencrypt:/etc/letsencrypt
