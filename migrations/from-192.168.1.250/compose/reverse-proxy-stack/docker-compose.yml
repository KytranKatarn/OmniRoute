version: '3.8'

services:
  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:2.14.0'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - /mnt/HomeLab/nginx-proxy/data:/data
      - /mnt/HomeLab/nginx-proxy/letsencrypt:/etc/letsencrypt
