version: "3.8"

services:
  network_redis:
    image: redis:7-alpine
    container_name: network_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - network_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

    environment:
      TZ: America/Toronto
  network_ntopng:
    image: ntop/ntopng:v6-pinned
    container_name: network_ntopng
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # -m flag adds trusted local networks: LAN + Docker bridge range so the
    # archie_platform container (172.x.x.x) can authenticate against ntopng
    # the same way host LAN traffic can. Without this, ntopng returns
    # wrong-credentials for any request from a non-LAN source IP.
    #
    # entrypoint bypasses the image's /run.sh, which UNCONDITIONALLY starts a
    # bundled redis-server that races network_redis's 127.0.0.1:6379 publish in
    # the host netns — whichever bound first won, so the backend ntopng used
    # flipped nondeterministically at recreate (the #5704 credential/stats
    # split-brain class). network_redis (persistent volume, memory-capped) is
    # THE backend; the bundled redis never starts. Owner-approved 2026-08-18.
    entrypoint: ["ntopng"]
    depends_on:
      - network_redis
    command: --redis 127.0.0.1:6379 -i eno1 -w 3001 --community -m "192.168.1.0/24,172.16.0.0/12"
    volumes:
      - network_ntopng_data:/var/lib/ntopng
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

    environment:
      TZ: America/Toronto
  network_adguard:
    image: adguard/adguardhome:v0.108.0-b.84
    container_name: network_adguard
    restart: unless-stopped
    network_mode: host
    volumes:
      - /mnt/HomeLab/adguard/work:/opt/adguardhome/work
      - /mnt/HomeLab/adguard/conf:/opt/adguardhome/conf
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

    environment:
      TZ: America/Toronto
volumes:
  network_redis_data:
  network_ntopng_data:
