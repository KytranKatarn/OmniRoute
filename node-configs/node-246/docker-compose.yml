###############################################################################
# A.R.C.H.I.E. Node .246 - Docker Compose
# ============================================================================
# Hardware: RTX 3070 (8GB VRAM), 32GB RAM
# IP: 192.168.1.246
# Hub: 192.168.1.200:3000
#
# 4-service stack: Ollama (GPU) + Postgres + sync_service + node_api
# Optional 5th service: ComfyUI (uncomment below)
#
# Copy .env.example to .env and set NODE_ID + HUB_API_KEY before starting.
# Usage: docker compose up -d
###############################################################################

services:
  ollama:
    image: ollama/ollama:0.6.2
    container_name: archie_node_ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 28G
    # Warm-boot profile (2026-07-06, KB #278809): mirror the starbase design —
    # hold many models warm (MAX_LOADED) + single-stream per model (NUM_PARALLEL=1,
    # avoids GPU KV-cache blow-up on the 8GB card) + long keep-alive (no cold-load thrash).
    environment:
      - OLLAMA_KEEP_ALIVE=60m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=6
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - archie_net

  postgres:
    image: postgres:16-alpine
    container_name: archie_node_db
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      POSTGRES_USER: archie_node
      POSTGRES_PASSWORD: ${DB_PASSWORD:-archie_node_default}
      POSTGRES_DB: archie_node
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archie_node"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - archie_net

  sync:
    image: ghcr.io/kytrankatarn/archie-node:latest
    container_name: archie_node_sync
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      NODE_ID: ${NODE_ID}
      HUB_URL: ${HUB_URL:-http://192.168.1.200:3000}
      HUB_API_KEY: ${HUB_API_KEY}
      OLLAMA_HOST: http://ollama:11434
      DATABASE_URL: postgresql://archie_node:${DB_PASSWORD:-archie_node_default}@postgres:5432/archie_node
      HEARTBEAT_INTERVAL: "30"
      SYNC_POLL_INTERVAL: "60"
      DEPLOYMENT_MODE: "starship"
      ARCHIE_VERSION: "1.0.0"
      NODE_TIMEZONE: ${NODE_TIMEZONE:-America/Toronto}
      COMFYUI_PORT: "${COMFYUI_PORT:-8188}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - comfyui_data:/comfyui/models
    command: ["python3", "-u", "node_sync.py"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q node_sync /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - archie_net

  node_api:
    image: ghcr.io/kytrankatarn/archie-node:latest
    container_name: archie_node_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      DATABASE_URL: postgresql://archie_node:${DB_PASSWORD:-archie_node_default}@postgres:5432/archie_node
      OLLAMA_HOST: http://ollama:11434
      NODE_ID: ${NODE_ID}
      NODE_TIMEZONE: ${NODE_TIMEZONE:-America/Toronto}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python3", "-u", "node_api.py"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "3001:3001"
    networks:
      - archie_net

  # === ComfyUI for image/video generation (uncomment to enable) ===
  # comfyui:
  #   image: comfyui/base:latest
  #   container_name: archie_node_comfyui
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #       limits:
  #         memory: 10G
  #   volumes:
  #     - comfyui_data:/comfyui/models
  #   ports:
  #     - "${COMFYUI_PORT:-8188}:8188"
  #   networks:
  #     - archie_net

volumes:
  ollama_data:
  pg_data:
  comfyui_data:

networks:
  archie_net:
    driver: bridge
