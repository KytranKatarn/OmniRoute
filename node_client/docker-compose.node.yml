###############################################################################
# A.R.C.H.I.E. Business Node - Docker Compose
# ============================================================================
# 3-service stack: database + platform + sync agent
# Ollama runs natively on the host (access via host.docker.internal:11434)
#
# Required env vars (set in .env):
#   NODE_ID, HUB_URL, HUB_API_KEY, DB_PASSWORD
###############################################################################

services:
  node_database:
    image: postgres:16-alpine
    container_name: archie_node_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: archie
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: archie_node
    volumes:
      - node_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archie -d archie_node"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - archie_node

  node_platform:
    image: archie-node:latest
    container_name: archie_node_platform
    restart: unless-stopped
    depends_on:
      node_database:
        condition: service_healthy
    environment:
      DB_HOST: node_database
      DB_PORT: "5432"
      DB_NAME: archie_node
      DB_USER: archie
      DB_PASSWORD: ${DB_PASSWORD}
      DEPLOYMENT_MODE: business_node
      NODE_ID: ${NODE_ID}
      HUB_URL: ${HUB_URL}
      OLLAMA_PRIMARY: http://host.docker.internal:11434
      OLLAMA_HOST: http://host.docker.internal:11434
      ARCHIE_VERSION: ${ARCHIE_VERSION:-5.25.0}
      HOST_IP: ${HOST_IP:-0.0.0.0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    networks:
      - archie_node

  node_sync:
    image: python:3.11-slim
    container_name: archie_node_sync
    restart: unless-stopped
    depends_on:
      - node_platform
    environment:
      NODE_ID: ${NODE_ID}
      HUB_URL: ${HUB_URL}
      HUB_API_KEY: ${HUB_API_KEY}
      OLLAMA_HOST: http://host.docker.internal:11434
      HEARTBEAT_INTERVAL: "30"
      SYNC_POLL_INTERVAL: "60"
      ARCHIE_VERSION: ${ARCHIE_VERSION:-5.25.0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./node_sync.py:/app/node_sync.py:ro
    working_dir: /app
    command: ["python3", "-u", "node_sync.py"]
    networks:
      - archie_node

volumes:
  node_db_data:

networks:
  archie_node:
    driver: bridge
