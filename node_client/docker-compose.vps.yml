###############################################################################
# A.R.C.H.I.E. Node — VPS Lightweight Stack
#
# For nodes that already have Ollama on the host (no GPU, small models).
# Runs node_api only. No postgres — /api/skills/push is DB-free.
# All future code updates come via OTA (no SSH needed after first deploy).
#
# First deploy (on VPS):
#   scp Dockerfile.node node_api.py node_sync.py node_triage.py docker-compose.vps.yml root@<vps>:/opt/archie-node/
#   cd /opt/archie-node && cp .env.example .env && vi .env
#   docker compose -f docker-compose.vps.yml up -d --build
#   ufw allow 3001/tcp
###############################################################################

services:
  node_api:
    build:
      context: .
      dockerfile: Dockerfile.node
    image: archie-node-api:local
    container_name: archie_node_api
    restart: unless-stopped
    # Baseline resource cap (audit #270456: node_api ran UNBOUNDED on every node → OOM risk).
    mem_limit: 768m
    cpus: 0.5
    command: python3 -u node_api.py
    environment:
      TZ: America/Toronto
      NODE_ID: ${NODE_ID:-outpost_us_001}
      # Mesh IP — NEVER the public CDN hostname (60s cap, bypasses the queue). Canonical mandate.
      HUB_URL: ${HUB_URL:-http://100.64.0.4:3000}
      # DR standby on boston-2 — node_sync.py auto-fails-over here if the primary hub dies.
      DR_HUB_URL: ${DR_HUB_URL:-http://100.64.0.10:3000}
      HUB_API_KEY: ${HUB_API_KEY:-}
      OLLAMA_HOST: http://host.docker.internal:11434
      DATABASE_URL: ""
      SKILLS_DIR: /skills
      NODE_TIMEZONE: ${NODE_TIMEZONE:-America/Toronto}
    volumes:
      - skills_data:/skills
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - archie_net

  # SOCKS5 egress proxy for S.C.O.U.T. browse-from-country (#4007 / #4014). The
  # hub's scraper routes a session's authenticated fetches here so they exit via
  # THIS outpost's public IP (= its country). Only outposts whose
  # remote_nodes.extra_capabilities.socks5_egress is true are offered in the UI.
  #
  # SECURITY — runs UNAUTHENTICATED on purpose: Chromium/Playwright (the
  # session_fetch consumer) cannot authenticate to a SOCKS5 proxy, so auth would
  # break the real fetch path. Access control is a DOCKER-USER iptables rule on
  # the host that DROPs every non-mesh source to :1080 (see
  # socks-egress-firewall.sh + archie-socks-firewall.service). It MUST be the
  # DOCKER-USER chain, not UFW — Docker publishes ports past UFW. The listener
  # binds 0.0.0.0 (so Docker delivers mesh-forwarded packets — a tailscale-IP
  # bind is unreachable from mesh peers); the firewall makes it mesh-only.
  node_socks:
    # Prebuilt SOCKS5 proxy (microsocks isn't in Alpine 3.20's repos). Pinned
    # by digest for reproducibility.
    image: serjs/go-socks5-proxy@sha256:0af522996f402c03ecd985a87997158eabeb28935365e3a384df37eafcf740ea
    container_name: archie_node_socks
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    environment:
      TZ: America/Toronto
      # serjs/go-socks5-proxy defaults REQUIRE_AUTH=true and EXITS without
      # creds. Run open on purpose — Chromium can't auth SOCKS5; the
      # DOCKER-USER mesh-only firewall is the access control.
      REQUIRE_AUTH: "false"
    ports:
      - "1080:1080"   # 0.0.0.0 — gated to mesh-only by the DOCKER-USER firewall
    networks:
      - archie_net

volumes:
  skills_data:

networks:
  archie_net:
    driver: bridge
