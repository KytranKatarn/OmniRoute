[pytest]
# ⚠️ THIS is the config the container uses. `docker exec archie_platform pytest` runs with
# rootdir=/app, which is platform_v2 bind-mounted — so /app/pytest.ini is THIS file. The
# repo-root ../pytest.ini is a SECOND config that only a host-side run would read. Editing
# that one and expecting the container to change is a silent no-op (measured 2026-08-24).
# Keep the `browser` marker and the deselect in step across both.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -m "not browser": tests/human_agents/ is a LIVE browser E2E suite (Playwright, real logins
# against ARCHIE_BASE_URL, one browser context per collaborator agent). It is collected here
# only because it sits under testpaths, and it hung `pytest tests/` INDEFINITELY — measured
# 21m43s at ~62% with a Playwright driver child alive the whole time, never finishing (#5990).
# pytest PRINTS the deselected count, so this is an announced exclusion, not silent truncation.
# Run them deliberately:  pytest tests/human_agents -m browser
addopts = -v --tb=short -m "not browser"
markers =
    browser: drives a REAL browser via Playwright against a live platform — slow, and
        excluded from the default run. Opt in with -m browser.
    unit: fast unit tests with no external dependencies
    integration: tests requiring a live database or external service
    slow: tests taking more than 5 seconds
    db: tests that connect to a real database
    llm: tests that invoke a real LLM endpoint
