[pytest]
asyncio_mode = auto
# Session-scoped Playwright browser fixture, function-scoped tests/pages:
# ALL must share ONE event loop or cross-loop awaits on the browser deadlock
# (pytest-asyncio 1.x runs session fixtures and function tests on separate
# loops by default). Pin both fixture and test loops to session scope.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
