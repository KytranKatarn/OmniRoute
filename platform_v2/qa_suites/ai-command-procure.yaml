suite:
  name: "AI Command — P.R.O.C.U.R.E."
  description: "P.R.O.C.U.R.E. agent reachability + hub dispatch endpoint. Verifies the agent exists and /api/procure/dispatch is wired correctly. Gov Watch-side /procure routes live on the VPS and are covered by a separate external-URL suite (Phase 1D)."
  base_url: "http://192.168.1.200:3000"
  auth:
    username: "${ARCHIE_TEST_USERNAME}"
    password: "${ARCHIE_TEST_PASSWORD}"

tests:
  # ---------------------------------------------------------------- dispatch
  - name: "procure-dispatch-requires-bearer"
    type: api
    method: POST
    path: /api/procure/dispatch
    headers:
      Content-Type: application/json
    body: '{"capability":"tender_match","prompt":"test"}'
    expect:
      status: [401]

  - name: "procure-dispatch-rejects-empty-bearer"
    type: api
    method: POST
    path: /api/procure/dispatch
    headers:
      Authorization: "Bearer "
      Content-Type: application/json
    body: '{"capability":"tender_match","prompt":"test"}'
    expect:
      status: [401]

  - name: "procure-dispatch-rejects-malformed-jwt"
    type: api
    method: POST
    path: /api/procure/dispatch
    headers:
      Authorization: "Bearer not.a.valid.jwt"
      Content-Type: application/json
    body: '{"capability":"tender_match","prompt":"test"}'
    expect:
      status: [401]

  - name: "procure-dispatch-get-disallowed"
    type: api
    method: GET
    path: /api/procure/dispatch
    expect:
      # POST-only endpoint — GET returns 405 Method Not Allowed (some Flask
      # configs 500 on GET w/ no handler — accept either).
      status: [405, 500]

  # ----------------------------------------------------------- registry card
  - name: "procure-module-card-present"
    type: page_load
    path: /dashboard
    expect:
      # Dashboard requires login → 302 to /login. Suite runs with test user
      # so once authenticated the 200 renders the module grid with the
      # "Kytran Gov Watch" card advertising the P.R.O.C.U.R.E. agent.
      status: [200, 302]

  # -------------------------------------------------- maven dispatch parity
  # P.R.O.C.U.R.E. mirrors Maven's endpoint shape — same 401 on missing
  # bearer. If Maven drifts, our parity assumption breaks.
  - name: "maven-dispatch-parity-401"
    type: api
    method: POST
    path: /api/maven/dispatch
    headers:
      Content-Type: application/json
    body: '{"capability":"library_curation","prompt":"test"}'
    expect:
      status: [401]
