# P.R.O.B.E. suite — Backup Manager
# Originally auto-generated by platform_v2/scripts/generate_module_qa_suites.py
# Tightened 2026-04-17 (task #2073 triage) — strict JSON assertions +
# tab_interaction tests so UI regressions (e.g. Cloud tab stuck on failed
# status check) get caught instead of masked by loose 2xx/3xx status lists.
suite:
  name: Admin Ops — Backup Manager
  description: |
    Strict API + UI coverage for backup_manager. Catches the 2026-04-17 bug
    where /cloud/status returns 302→/dashboard instead of JSON, stranding the
    GDrive connect UI. Tab interaction walks all 8 tabs.
  base_url: "http://192.168.1.200:3000"
  auth:
    username: "${ARCHIE_TEST_USERNAME}"
    password: "${ARCHIE_TEST_PASSWORD}"

tests:
  # --- Page load ---------------------------------------------------------
  - name: bm-page-loads
    type: page_load
    path: /tools/backup-manager/
    expect:
      status: 200
      title_contains: "Backup Manager"
      max_load_ms: 5000

  # --- API endpoints: MUST return JSON, not redirect ---------------------
  # Loose [200,302,...] acceptance was masking real bugs — now each JSON
  # endpoint must return 200 and respond within budget.
  - name: bm-list
    type: api
    method: GET
    path: /tools/backup-manager/list
    expect:
      status: 200
      max_response_ms: 3000

  - name: bm-stats
    type: api
    method: GET
    path: /tools/backup-manager/stats
    expect:
      status: 200
      max_response_ms: 2000

  - name: bm-current-build
    type: api
    method: GET
    path: /tools/backup-manager/current-build
    expect:
      status: 200
      max_response_ms: 2000

  - name: bm-health
    type: api
    method: GET
    path: /tools/backup-manager/health
    expect:
      status: 200
      max_response_ms: 2000

  - name: bm-external-list
    type: api
    method: GET
    path: /tools/backup-manager/external-list
    expect:
      status: 200
      max_response_ms: 3000

  - name: bm-external-status
    type: api
    method: GET
    path: /tools/backup-manager/external-status
    expect:
      status: 200
      max_response_ms: 2000

  - name: bm-api-deployment-backups
    type: api
    method: GET
    path: /tools/backup-manager/api/deployment-backups
    expect:
      status: 200
      max_response_ms: 3000

  - name: bm-api-deployment-packages
    type: api
    method: GET
    path: /tools/backup-manager/api/deployment-packages
    expect:
      status: 200
      max_response_ms: 3000

  - name: bm-api-hooks
    type: api
    method: GET
    path: /tools/backup-manager/api/hooks
    expect:
      status: 200
      max_response_ms: 2000

  - name: bm-api-webhooks
    type: api
    method: GET
    path: /tools/backup-manager/api/webhooks
    expect:
      status: 200
      max_response_ms: 2000

  # --- GDrive cloud endpoints: TIGHT (regression test for task #2073) ---
  # /cloud/status MUST return a JSON payload with success=true.
  # Current state: it 302's to /dashboard, so json_contains fails the
  # parse step → the test fails loudly instead of being masked by a
  # permissive [200,302] status list.
  - name: bm-cloud-status
    type: api
    method: GET
    path: /tools/backup-manager/cloud/status
    expect:
      status: 200
      json_contains:
        success: true
      max_response_ms: 5000

  - name: bm-cloud-list
    type: api
    method: GET
    path: /tools/backup-manager/cloud/list
    expect:
      status: 200
      max_response_ms: 5000

  - name: bm-cloud-progress
    type: api
    method: GET
    path: /tools/backup-manager/cloud/progress
    expect:
      status: 200
      max_response_ms: 2000

  # --- Tab interaction: click every top-level tab and assert settled UI ---
  # Catches tab-local bugs that don't show up in per-URL status checks —
  # e.g. the Cloud tab that renders a header but errors on its status call.
  - name: bm-tab-interaction
    type: tab_interaction
    path: /tools/backup-manager/
    settle_ms: 700
    loading_text: "Loading..."
    tabs:
      - name: backups
        selector: 'button:has-text("Backups")'
      - name: cloud
        selector: 'button:has-text("Cloud")'
      - name: external
        selector: 'button:has-text("External")'
      - name: deployment
        selector: 'button:has-text("Deployment")'
      - name: modules
        selector: 'button:has-text("Modules")'
      - name: hooks
        selector: 'button:has-text("Hooks")'
      - name: retention
        selector: 'button:has-text("Retention")'
      - name: packages
        selector: 'button:has-text("Packages")'
