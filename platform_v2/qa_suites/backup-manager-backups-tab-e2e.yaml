# P.R.O.B.E. — Backup Manager / Backups tab, DOM-level E2E
#
# WHY THIS EXISTS (2026-07-22): the three "Last run:" captions under the Quick Backup
# buttons rendered blank for an unknown length of time. Nothing caught it because every
# existing Backup Manager suite (#19, #35, #69, #71) is HTTP-only `page_load`/`api` —
# qa_spec_runner cannot assert DOM. The endpoint returned correct JSON the whole time;
# only the rendered page was wrong. That is precisely the shape of mistake #281727 (a DHQ
# card passed page-load AND API QA while rendering nowhere, because a shared JS file
# shadowed its handler at load).
#
# So: an HTTP 200 is NOT evidence a UI renders. These tests assert the DOM.
#
# ⚠️ SAFETY — THIS SUITE MUST NEVER CLICK A QUICK BACKUP BUTTON.
# `createQuickBackup('full'|'critical'|'database')` starts a REAL backup: measured
# 2,470 MB / 1,040s, 2,358 MB / 875s and 1,596 MB / 835s respectively. A suite that
# clicked them would fire ~6.4 GB of disk writes and ~45 min of CPU on every scheduled
# run, and would take the /backups/.backup_lock out from under the nightly cron.
# Wiring is therefore asserted by `typeof` + presence, never by invocation. Any future
# test that actually exercises a backup belongs in a manual/on-demand suite, not here.

suite:
  name: "backup-manager-backups-tab-e2e"
  description: "DOM-level E2E for the Backup Manager Backups tab. Proves the three Quick Backup 'Last run:' captions actually RENDER measured values (the failure HTTP-only suites cannot see), and that the button handlers are wired — without ever triggering a real multi-GB backup."
  base_url: "http://192.168.1.200:3000"
  auth:
    # P.R.O.B.E.'s own platform credentials, resolved from env by the runner.
    username: "${ARCHIE_TEST_USERNAME}"
    password: "${ARCHIE_TEST_PASSWORD}"

tests:
  # ---------------------------------------------------------------------------
  - name: "Quick Backup captions render measured values (not the placeholder)"
    type: e2e
    path: /tools/backup-manager
    wait_until: load
    actions:
      # loadQuickStats() is async (fetch -> textContent). Give the natural on-load
      # path time to complete before judging it.
      - wait: 2500
      - screenshot: "backups-tab-quick-backup-captions"
    expect:
      selector_visible:
        "#qbLast-full": true
        "#qbLast-critical": true
        "#qbLast-database": true
      js_eval:
        # 1) The render function exists and is not shadowed by a later definition.
        #    (#281727 was exactly a shadowed handler — the symbol existed but the
        #    live binding pointed at dead code.)
        - name: render_fn_present
          expr: "typeof loadQuickStats === 'function' && typeof loadBackups === 'function'"
          equals: true

        # 2) THE REGRESSION. Each caption must contain a digit and must NOT still read
        #    the hard-coded placeholder "Last run: -" or the empty-state "never".
        #    Template default is an em dash (backup_manager.html ~L134/140/146), so a
        #    dead render path leaves it in place — which is what the owner saw.
        - name: captions_not_placeholder
          expr: "['full','critical','database'].every(function(t){var e=document.getElementById('qbLast-'+t);if(!e)return false;var s=e.textContent||'';return /[0-9]/.test(s) && !/never|unknown/.test(s) && s.indexOf('—')===-1;})"
          equals: true

        # 3) A size is present on every caption. Guards the case where duration_ms is
        #    populated but size_bytes silently isn't (or vice-versa) — the caption would
        #    look "filled" while carrying half the information.
        - name: captions_have_size
          expr: "['full','critical','database'].every(function(t){var e=document.getElementById('qbLast-'+t);return !!e && / MB/.test(e.textContent||'');})"
          equals: true

        # 4) Deterministic re-render: calling loadQuickStats() directly must repopulate.
        #    Isolates "the data/endpoint/DOM-write path works" from "something upstream
        #    forgot to call it", so a failure tells you WHICH half broke.
        - name: captions_repopulate_on_demand
          expr: "(async function(){['full','critical','database'].forEach(function(t){var e=document.getElementById('qbLast-'+t);if(e)e.textContent='CLEARED';});await loadQuickStats();await new Promise(function(r){setTimeout(r,1200);});return ['full','critical','database'].every(function(t){var e=document.getElementById('qbLast-'+t);var s=e?(e.textContent||''):'';return s!=='CLEARED' && /[0-9]/.test(s);});})()"
          equals: true

  # ---------------------------------------------------------------------------
  - name: "Quick Backup buttons present and wired (NOT clicked — see safety note)"
    type: e2e
    path: /tools/backup-manager
    wait_until: load
    actions:
      - wait: 1200
    expect:
      js_eval:
        # The handler exists. Presence-only: invoking it would start a real backup.
        - name: handler_wired
          expr: "typeof createQuickBackup === 'function'"
          equals: true

        # Exactly three caption slots — catches a button being added or dropped
        # without its caption, which is how the set silently drifts.
        - name: three_caption_slots
          expr: "document.querySelectorAll('[id^=\"qbLast-\"]').length"
          equals: 3

        # Each mode has a control routing to createQuickBackup. Asserted structurally
        # (the inline onclick names the mode) rather than by firing it.
        - name: each_mode_has_a_control
          expr: "['full','critical','database'].every(function(t){return document.body.innerHTML.indexOf(\"createQuickBackup('\"+t+\"'\")!==-1;})"
          equals: true

  # ---------------------------------------------------------------------------
  # Per-row actions. Selectors were READ FROM THE LIVE DOM (2026-07-22), not guessed:
  # rows are `.backup-item` (60 present), each carrying exactly five buttons —
  # Inspect / Download / Sync USB / Cloud / Delete — with NO inline onclick (they are
  # event-delegated, which is why a static grep of the template finds nothing).
  #
  # ⚠️ Of the five, only INSPECT is read-only. Download pulls up to 2.4 GB; Sync USB
  # and Cloud start real transfers (Cloud against a 15 GB quota that already filled
  # once and killed off-site backups for ~3 weeks); Delete destroys a restore point.
  # So: presence is asserted for all five, and only Inspect is ever clicked.
  - name: "Every backup row renders its full action set (presence only — see safety note)"
    type: e2e
    path: /tools/backup-manager
    wait_until: load
    actions:
      - wait: 2500
    expect:
      js_eval:
        - name: rows_rendered
          expr: "document.querySelectorAll('.backup-item').length > 0"
          equals: true
        # EVERY row must carry all five. A row that renders without its actions is
        # unusable-but-invisible — it looks fine until someone needs to restore it.
        - name: every_row_has_all_five_actions
          expr: "(()=>{var need=['Inspect','Download','Sync USB','Cloud','Delete'];var rows=document.querySelectorAll('.backup-item');if(!rows.length)return false;return Array.prototype.every.call(rows,function(r){var l=Array.prototype.map.call(r.querySelectorAll('button'),function(b){return b.textContent.trim();});return need.every(function(n){return l.indexOf(n)!==-1;});});})()"
          equals: true
        # Delete must stay visually marked as destructive — a red Delete that loses its
        # styling is a mis-click waiting to happen on a 2.4 GB restore point.
        - name: delete_is_marked_destructive
          expr: "(()=>{var r=document.querySelector('.backup-item');if(!r)return false;var d=Array.prototype.filter.call(r.querySelectorAll('button'),function(b){return b.textContent.trim()==='Delete';})[0];return !!d && /btn-red/.test(d.className);})()"
          equals: true

  # ---------------------------------------------------------------------------
  - name: "Inspect opens the preview modal (the only row action safe to click)"
    type: e2e
    path: /tools/backup-manager
    wait_until: load
    actions:
      - wait: 2500
      - click: ".backup-item button:has-text('Inspect')"
      - wait: 1200
      - screenshot: "backups-tab-inspect-modal"
    expect:
      js_eval:
        # Something modal-ish became visible. Kept structural rather than pinned to one
        # id: the point is that Inspect DOES something, not which element it uses.
        - name: a_modal_opened
          expr: "(()=>{var m=document.querySelectorAll('.bm-overlay,[class*=modal],[id*=Modal]');return Array.prototype.some.call(m,function(e){var s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&e.offsetHeight>0;});})()"
          equals: true

  # ---------------------------------------------------------------------------
  # The other 9 tabs. Navigation only — no tab's controls are exercised here, because
  # several are destructive (cleanupBackups, saveRetentionPolicy, backupSelectedStandalones,
  # createModuleBackup, createDeploymentPackage). This proves each tab RENDERS; asserting
  # their contents is a separate spec per tab, written the same way: read the live DOM first.
  - name: "All 9 Backup Manager tabs exist and switch"
    type: e2e
    path: /tools/backup-manager
    wait_until: load
    actions:
      - wait: 2000
      - click: "[data-tab='cloud']"
      - wait: 400
      - click: "[data-tab='retention']"
      - wait: 400
      - click: "[data-tab='backups']"
      - wait: 400
    expect:
      js_eval:
        - name: all_nine_tabs_present
          expr: "(()=>{var want=['backups','cloud','external','deployments','modules','standalones','hooks','retention','packages'];return want.every(function(t){return !!document.querySelector('[data-tab=\"'+t+'\"]');});})()"
          equals: true
        # Returned to Backups and its content is live again — proves switching is
        # reversible and does not strand the default tab.
        - name: returned_to_backups_intact
          expr: "document.querySelectorAll('.backup-item').length > 0 && !!document.getElementById('qbLast-full')"
          equals: true

  # ---------------------------------------------------------------------------
  # "Do all the buttons work, in theory?" — across ALL 9 tabs, without invoking any.
  #
  # Every tab's markup is present in the DOM at load (tabs are shown/hidden, not lazily
  # built), so a single scan reaches every control: Backups, Cloud, External, Deployment,
  # Modules, Standalones, Hooks, Retention, Packages, plus the modal sub-buttons.
  #
  # The check is structural: for every element with an inline `onclick`, extract the
  # function names it CALLS and assert each one actually exists on `window`. That catches
  # the failure this cannot otherwise see — a button wired to a renamed or deleted
  # handler, which looks perfectly fine on screen and does nothing when pressed.
  # NOTHING IS INVOKED; this only proves the wiring resolves.
  - name: "Every wired control on every tab points at a function that exists (nothing invoked)"
    type: e2e
    path: /tools/backup-manager
    wait_until: load
    actions:
      - wait: 2500
    expect:
      js_eval:
        # Identifiers NOT preceded by a dot (so `document.getElementById(` and `.then(`
        # are correctly ignored as method calls). Skipped: language keywords/builtins, and
        # `_bmConfirmResolve` / `_passphraseResolve`, which are assigned only while a modal
        # is open and are null-guarded at the call site (`x && x(...)`) by design.
        - name: all_onclick_handlers_resolve
          expr: "(function(){var SKIP={'if':1,'for':1,'while':1,'return':1,'fetch':1,'alert':1,'confirm':1,'event':1,'this':1,'function':1,'typeof':1,'new':1,'setTimeout':1,'Boolean':1,'String':1,'Number':1,'_bmConfirmResolve':1,'_passphraseResolve':1};var bad=[],seen={};Array.prototype.forEach.call(document.querySelectorAll('[onclick]'),function(el){var oc=el.getAttribute('onclick')||'';var re=/(^|[^.\\w$])([A-Za-z_$][A-Za-z0-9_$]*)\\s*\\(/g,m;while((m=re.exec(oc))!==null){var n=m[2];if(SKIP[n]||seen[n])continue;seen[n]=1;if(typeof window[n]!=='function')bad.push(n);}});return bad.length===0;})()"
          equals: true

        # FLOOR. Without this the scan passes trivially when it finds nothing — e.g. if the
        # page fails to render its controls, `bad` is empty and the assertion above goes
        # green while the tab is blank. Measured 26 distinct handlers on 2026-07-22; 20 is
        # a deliberately loose floor that still catches "the page rendered no controls".
        - name: scan_actually_found_controls
          expr: "(function(){var SKIP={'if':1,'for':1,'while':1,'return':1,'fetch':1,'alert':1,'confirm':1,'event':1,'this':1,'function':1,'typeof':1,'new':1,'setTimeout':1,'Boolean':1,'String':1,'Number':1,'_bmConfirmResolve':1,'_passphraseResolve':1};var seen={};Array.prototype.forEach.call(document.querySelectorAll('[onclick]'),function(el){var oc=el.getAttribute('onclick')||'';var re=/(^|[^.\\w$])([A-Za-z_$][A-Za-z0-9_$]*)\\s*\\(/g,m;while((m=re.exec(oc))!==null){var n=m[2];if(!SKIP[n])seen[n]=1;}});return Object.keys(seen).length >= 20;})()"
          equals: true

        # The destructive/expensive controls specifically must be wired — these are the
        # ones a human reaches for in an incident, when discovering a dead button is worst.
        - name: critical_handlers_wired
          expr: "['createQuickBackup','cleanupBackups','createModuleBackup','backupSelectedStandalones','saveRetentionPolicy','saveGovernanceGates','checkRetention','verifyCloudPassphrase','createDeploymentPackage','showAddWebhookModal'].every(function(n){return typeof window[n]==='function';})"
          equals: true

# ---------------------------------------------------------------------------
# STILL NOT COVERED (deliberate): the CONTENTS of the 9 non-Backups tabs, and any
# actual invocation of a destructive control anywhere. Adding those means one spec per
# tab, selectors read from the live DOM first, and the same rule as above — assert
# wiring for destructive controls, click only read-only ones. Anything that must
# genuinely exercise a backup/restore belongs in a manual, on-demand suite, never here.
