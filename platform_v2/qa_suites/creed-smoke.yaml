suite:
  name: "creed-smoke"
  description: "C.R.E.E.D. Governance — public score APIs + data-nonempty (KB #270283)"
  base_url: "https://creed.kytranempowerment.com"

# Note: C.R.E.E.D. has no /api/health route — the public score endpoints are the
# liveness + data signal. All endpoints are public (no-auth, CORS-open).
tests:
  - name: "home-loads"
    # page_load, NOT api: title_contains is honoured ONLY by the page_load runner
    # (qa_spec_runner.py ~L813); on `api` it is silently ignored. Status alone
    # passes on a parked/blank vhost — how creed-ai.org served a Hostinger parking
    # page to every visitor with a 200 (KB #301853/#301854).
    type: page_load
    method: GET
    path: /
    skip_auth: true
    expect:
      status: [200, 302]
      title_contains: "Compliance, Rights"

  - name: "v1-scores-has-data"
    type: api
    method: GET
    path: /api/v1/scores
    skip_auth: true
    critical: true
    expect:
      status: [200]
      json_nonempty: true
      json_gt:
        overall: 0
        event_count: 0

  - name: "public-score-positive"
    type: api
    method: GET
    path: /api/public/score
    skip_auth: true
    critical: true
    expect:
      status: [200]
      json_nonempty: true
      json_gt:
        score: 0

  - name: "ethics-by-department-nonempty"
    type: api
    method: GET
    path: /api/ethics/by-department
    skip_auth: true
    expect:
      status: [200]
      json_contains:
        success: true
      path: by_department
      min_items: 1
