suite:
  name: "kbs-full-plugin-audit"
  description: "KBS all-24-plugin availability audit — verifies each plugin loads (task #2015)"
  base_url: "http://192.168.1.200:8091"
  auth:
    username: "${KBS_TEST_USERNAME}"
    password: "${KBS_TEST_PASSWORD}"

tests:
