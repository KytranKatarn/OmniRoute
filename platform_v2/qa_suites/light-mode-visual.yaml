# P.R.O.B.E. Light Mode Visual Suite
# Captures CSS computed-styles + screenshots for every enabled module in light mode.
# First run creates baselines (status=skip). Accept baselines, then re-run after
# CSS fixes to catch regressions.
#
# Theme injection: sets window.setArchieTheme('light') after each page load,
# waits 400ms for CSS vars to recompute, then snapshots.
#
# Task: #1997 / #1998 / #1999 — Light Mode QA

suite:
  name: "Light Mode Visual — All Modules"
  description: "Playwright visual snapshots of every enabled module with light mode active. Baseline run documents current state; re-run after CSS fixes confirms resolution."
  base_url: "http://192.168.1.200:3000"
  auth:
    username: "${ARCHIE_TEST_USERNAME}"
    password: "${ARCHIE_TEST_PASSWORD}"

tests:

  # ── Core / Dashboard ──────────────────────────────────────────────────────
  - name: lm-dashboard
    type: visual_snapshot
    path: /dashboard
    theme: light
    breakpoints: [480, 768, 1280]
    selectors: [":root", "body", ".dashboard-grid", ".module-card"]
    snapshot_name: lm-dashboard-v1

  # ── Admin Ops ─────────────────────────────────────────────────────────────
  - name: lm-account-center
    type: visual_snapshot
    path: /tools/account-center/
