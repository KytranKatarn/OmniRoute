suite:
  name: "sandbox-environment-smoke"
  description: "Full sandbox smoke — login, SANDBOX_MODE banner, all 31 modules, backup sandbox endpoints. Run before promoting sandbox→production."
  base_url: "http://192.168.1.200:3003"
  auth:
    username: "${ARCHIE_TEST_USERNAME}"
    password: "${ARCHIE_TEST_PASSWORD}"

tests:
  # ── Core sandbox health ────────────────────────────────────────────────────
  - name: "sandbox-health"
    type: api
    method: GET
    path: /health
    expect:
      status: [200]

  - name: "sandbox-login-page"
    type: api
    method: GET
    path: /login
    expect:
      status: [200, 302]

  - name: "sandbox-dashboard"
    type: api
    method: GET
    path: /dashboard
    expect:
      status: [200, 302, 308]

  # ── Admin Ops modules ──────────────────────────────────────────────────────
  - name: "sandbox-backup-manager"
    type: api
    method: GET
    path: /tools/backup-manager
    expect:
      status: [200, 302, 308]

  - name: "sandbox-backup-health"
    type: api
    method: GET
    path: /tools/backup-manager/health
    expect:
      status: [200, 302]

  - name: "sandbox-backup-list"
    type: api
    method: GET
    path: /tools/backup-manager/list
    expect:
      status: [200, 302]

  - name: "sandbox-backup-sandbox-restore-status"
    type: api
    method: GET
    path: /tools/backup-manager/api/restore/status/388
    expect:
      status: [200, 302, 404]

  - name: "sandbox-backup-modules-list"
