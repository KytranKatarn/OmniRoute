suite:
  name: "watch-civic-e2e"
  description: "Civic Watch — availability + data-nonempty + auth gate (anti-empty-site, KB #270283)"
  base_url: "https://civic.kytranempowerment.com"

tests:
  - name: "home-loads"
    type: api
    method: GET
    path: /
    skip_auth: true
    expect:
      status: [200, 302]

  - name: "health-ok"
    type: api
    method: GET
    path: /api/health
    skip_auth: true
    expect:
      status: [200]
      json_contains:
        status: "ok"

  - name: "dashboard-renders"
    type: page_load
    path: /dashboard
    skip_auth: true
    expect:
      status: [200]

  # --- data-nonempty: go RED on an empty site (the 2026-06-02 regression) ---
  - name: "contracts-nonempty"
    type: api
    method: GET
    path: /api/contracts
    skip_auth: true
    critical: true
    expect:
      status: [200]
      min_items: 1

  - name: "events-nonempty"
    type: api
    method: GET
    path: /api/events
    skip_auth: true
    critical: true
    expect:
      status: [200]
      min_items: 1

  - name: "lobbying-overview-has-data"
    type: api
    method: GET
    path: /api/lobbying/overview
    skip_auth: true
    expect:
      status: [200]
      json_gt:
        total_communications: 0

  # --- auth gate: a gated route must reject an anonymous caller ---
  - name: "gated-route-blocks-anon"
    type: api
    method: GET
    path: /api/lobbying/top-clients
    skip_auth: true
    expect:
      status: [401, 403, 302]
