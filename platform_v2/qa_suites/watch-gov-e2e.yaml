suite:
  name: "watch-gov-e2e"
  description: "Gov Watch (P.R.O.C.U.R.E.) — availability + data-nonempty on proactive disclosures (KB #270283)"
  base_url: "https://gov.kytranempowerment.com"

tests:
  - name: "home-loads"
    type: api
    method: GET
    path: /
    skip_auth: true
    expect:
      status: [200, 302]

  - name: "health-ok"
    type: api
    method: GET
    path: /api/health
    skip_auth: true
    expect:
      status: [200]
      json_contains:
        status: "ok"

  # --- data-nonempty: proactive disclosures wrap data in {ok, records} — assert
  # the nested list is non-empty via expect.path (35k+ records in the DB). ---
  - name: "proactive-recent-nonempty"
    type: api
    method: GET
    path: /procure/api/proactive/recent
    skip_auth: true
    critical: true
    expect:
      status: [200]
      json_contains:
        ok: true
      path: records
      min_items: 1

  - name: "proactive-trends-nonempty"
    type: api
    method: GET
    path: /procure/api/proactive/trends
    skip_auth: true
    critical: true
    expect:
      status: [200]
      json_contains:
        ok: true
      path: trends
      min_items: 1
