suite:
  name: "watch-legal-e2e"
  description: "Legal Watch — availability, login gate, AND data-nonempty (anti-empty-site, KB #270283)"
  base_url: "https://legal.kytranempowerment.com"

tests:
  - name: "home-loads"
    # page_load, NOT api — only that runner honours title_contains; on `api` it is
    # silently ignored. Status alone passes on a parked/blank vhost (KB #301854).
    type: page_load
    method: GET
    path: /
    skip_auth: true
    expect:
      status: [200, 302]
      title_contains: "Legal Watch"

  - name: "health-ok"
    type: api
    method: GET
    path: /api/health
    skip_auth: true
    expect:
      status: [200]
      json_contains:
        status: "ok"

  # /dashboard redirects to the platform SSO for an anonymous caller, so the
  # correct assertion is the SSO page title — that IS the gate working. Asserting
  # the product title here would be asserting the gate is BROKEN.
  - name: "dashboard-renders"
    type: page_load
    path: /dashboard
    skip_auth: true
    expect:
      status: [200]
      title_contains: "System Access"

  # --- data-nonempty: these go RED on an empty site (the 2026-06-02 regression
  # that the old status-only suite passed green). Require the json_gt / min_items
  # assertions added to qa_spec_runner. ---
  - name: "stats-has-data"
    type: api
    method: GET
    path: /api/stats
    skip_auth: true
    critical: true
    expect:
      status: [200]
      json_gt:
        total_events: 0
        regulations: 0

  - name: "events-nonempty"
    type: api
    method: GET
    path: /api/events
    skip_auth: true
    critical: true
    expect:
      status: [200]
      min_items: 1

  - name: "regulations-nonempty"
    type: api
    method: GET
    path: /api/regulations
    skip_auth: true
    critical: true
    expect:
      status: [200]
      min_items: 1

  - name: "ethics-stats-present"
    type: api
    method: GET
    path: /api/ethics/stats
    skip_auth: true
    expect:
      status: [200]
      json_gt:
        total: 0
