suite:
  name: "watch-legal-e2e"
  description: "Legal Watch — availability, login gate, and main content pages"
  base_url: "https://legal.kytranempowerment.com"

tests:
  - name: "home-loads"
    type: api
    method: GET
    path: /
    skip_auth: true
    expect:
      status: [200, 302]

  - name: "login-page"
    type: api
    method: GET
    path: /login
    skip_auth: true
    expect:
      status: [200, 302]

  - name: "health-endpoint"
    type: api
    method: GET
    path: /api/health
    skip_auth: true
    expect:
      status: [200, 404]

  - name: "dashboard-authenticated-gate"
    type: api
    method: GET
    path: /dashboard
    skip_auth: true
    expect:
      status: [200, 302, 401]
