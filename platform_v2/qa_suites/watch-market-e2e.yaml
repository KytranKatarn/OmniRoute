suite:
  name: "watch-market-e2e"
  description: "Market Watch — availability + data-liveness via /api/health (KB #270283)"
  base_url: "https://market.kytranempowerment.com"

tests:
  - name: "home-loads"
    type: api
    method: GET
    path: /
    skip_auth: true
    expect:
      status: [200, 302]

  # Market's content routes are per-user / authed, so /api/health is the public
  # data signal: it exposes db_size_bytes + last_ingest + status. Assert the DB
  # has bytes and the service is healthy — catches a wiped DB or a dead ingest
  # even though the per-user data routes can't be probed unauthenticated.
  - name: "health-has-data"
    type: api
    method: GET
    path: /api/health
    skip_auth: true
    critical: true
    expect:
      status: [200]
      json_contains:
        status: "healthy"
      json_gt:
        db_size_bytes: 0

  # NOTE: market's /dashboard returns 500 for an anonymous caller (it should
  # 302/401). That's a minor pre-existing bug to fix separately, so it is
  # intentionally not asserted here — this suite tracks data health.
