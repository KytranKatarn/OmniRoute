# P.R.O.B.E. — Website: creed-ai.org
#
# REWRITTEN 2026-09-02. The previous version of this suite was 23 tests, all
# `type: api`, asserting only `status: 200`.
#
# ⚠️ WHY THAT WAS NOT ENOUGH — this is not hypothetical. On 2026-09-02 the site
# served a Hostinger PARKING page ("Parked Domain name on Hostinger DNS system")
# to every visitor, on every path, WITH A 200 STATUS. A status-only suite goes
# green through that. The owner found it by looking at the site; the suite could
# not have. Its own description claimed it "catches failed Hostinger deploys".
#
# Same blind spot already recorded on suite #110: "entirely type:api, which
# cannot see whether anything RENDERS". Documented for DHQ, never generalised.
#
# THE FIX, and the rule for any public site:
#   - `type: page_load` (NOT api) — only that runner honours title/body assertions.
#   - every test asserts `title_contains`, a case-insensitive REGEX matched against
#     the page's <title>, and the pattern is DISTINCTIVE TO THAT PAGE. A shared
#     match like "C.R.E.E.D." would catch a parking page but still pass if two
#     pages were swapped; a per-page pattern catches both.
#
# ⚠️ Patterns deliberately avoid HTML entities and regex metacharacters present in
# the real titles — "News &amp; Updates", "Accountability &amp; Redress",
# "&Agrave; propos", and the "|" in the 404 title. Match the stable prose instead.
#
# Coverage: 32 pages (was 23). The 9 added were live and untested: accountability,
# directory, get-scored, incidents, oversight, remediation, standard, public/, 404.
# Source of truth: /mnt/standalone/websites/creed-ai.org (symlink -> creed-ai-site repo).
#
# KB #301853 (the parking page) · KB #301854 (this suite's gap).

suite:
  name: "Website — creed-ai.org"
  base_url: "https://creed-ai.org"
  description: >-
    All 32 public pages: EN, FR, white papers and registries. Every test asserts a
    page-distinctive <title>, not just a 200 — a parked domain, a blank vhost and a
    wrong-page mixup all return 200 and must fail here.

tests:
  # --- core ---------------------------------------------------------------
  - name: creed-home
    path: /
    type: page_load
    method: GET
    skip_auth: true
    expect: { status: 200, title_contains: "Preventive Ethics", max_load_ms: 10000 }

