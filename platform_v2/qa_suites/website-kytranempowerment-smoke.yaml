suite:
  name: "website-kytranempowerment-smoke"
  description: "kytranempowerment.com — main website smoke test for key pages (Playwright e2e, bypasses Hostinger CDN bot protection)"
  base_url: "https://kytranempowerment.com"

tests:
  - name: "home-loads"
    type: e2e
    path: /
    skip_auth: true
    wait_until: domcontentloaded
    expect:
      title_contains: "Kytran"

  - name: "about-loads"
    type: e2e
    path: /about.html
    skip_auth: true
    wait_until: domcontentloaded
    expect:
      title_contains: "Kytran"

  - name: "ai-directors-loads"
    type: e2e
    path: /ai-directors.html
    skip_auth: true
    wait_until: domcontentloaded
    expect:
      title_contains: "Kytran"

  - name: "archie-code-page"
    type: e2e
    path: /archie-code.html
    skip_auth: true
    wait_until: domcontentloaded
    expect:
      title_contains: "Kytran"

  # pricing.html does not yet exist on the live site — skipped until published
  # directory-fallback.json returns 404 on CDN — skipped until asset is deployed
