suite:
  name: "website-kytranempowerment-smoke"
  description: "kytranempowerment.com — main website smoke test for key pages"
  base_url: "https://kytranempowerment.com"

tests:
  - name: "home-loads"
    type: api
    method: GET
    path: /
    skip_auth: true
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "en-US,en;q=0.5"
    expect:
      status: 200

  - name: "about-loads"
    type: api
    method: GET
    path: /about.html
    skip_auth: true
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "en-US,en;q=0.5"
    expect:
      status: 200

  - name: "ai-directors-loads"
    type: api
    method: GET
    path: /ai-directors.html
    skip_auth: true
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "en-US,en;q=0.5"
    expect:
      status: 200

  - name: "pricing-loads"
    type: api
    method: GET
    path: /pricing.html
    skip_auth: true
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "en-US,en;q=0.5"
    expect:
      status: 200

  - name: "directory-api"
    type: api
    method: GET
    path: /assets/data/directory-fallback.json
    skip_auth: true
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "en-US,en;q=0.5"
    expect:
      status: 200

  - name: "archie-code-page"
    type: api
    method: GET
    path: /archie-code.html
    skip_auth: true
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "en-US,en;q=0.5"
    expect:
      status: 200
