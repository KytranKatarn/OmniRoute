<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a1500"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bg)" stroke="#FF8C00" stroke-width="2" opacity="0.9"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#FF8C00" stroke-width="1" opacity="0.15" stroke-dasharray="4,4"/>
  <text x="100" y="108" text-anchor="middle" font-family="'Courier New',monospace" font-size="56" font-weight="bold" fill="#FF8C00" filter="url(#glow)" letter-spacing="2">NI</text>
  <text x="100" y="170" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#FF8C00" opacity="0.4" letter-spacing="3" text-transform="uppercase">PLACEHOLDER</text>
</svg>
