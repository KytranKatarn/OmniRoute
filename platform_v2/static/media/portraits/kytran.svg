<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1a2b4e"/>
      <stop offset="55%" stop-color="#0d1630"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="silhouette" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1f"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g opacity="0.12" stroke="#3d6ba8" stroke-width="1.5" fill="none">
    <circle cx="512" cy="500" r="360"/>
    <circle cx="512" cy="500" r="300"/>
    <circle cx="512" cy="500" r="240"/>
  </g>

  <g opacity="0.08" stroke="#4c84c9" stroke-width="1" fill="none">
    <line x1="152" y1="500" x2="872" y2="500"/>
    <line x1="512" y1="140" x2="512" y2="860"/>
  </g>

  <g fill="url(#silhouette)">
    <path d="M 180 1024
             C 180 810 300 700 512 700
             C 724 700 844 810 844 1024 Z"/>
    <ellipse cx="512" cy="440" rx="165" ry="195"/>
  </g>

  <g fill="#3d6ba8" opacity="0.55" filter="url(#glow)">
    <circle cx="512" cy="420" r="4"/>
  </g>

  <g fill="#4c84c9" opacity="0.35" font-family="monospace" font-size="14">
    <text x="512" y="950" text-anchor="middle">KYTRAN · CO-FOUNDER</text>
  </g>
</svg>
