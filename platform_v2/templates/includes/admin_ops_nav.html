<!-- ═══════════════════════════════════════════════════════════════════════════════
   Admin Operations Navigation Bar
   Shared component for Blueprint, Bridge, Team, Mind, HR, Pool, Goose, Projects
   Phase 30: UI Modernization
   ═══════════════════════════════════════════════════════════════════════════════ -->

<!-- Page Transition Overlay -->
<div class="page-transition-overlay" id="pageTransition">
    <div class="transition-content">
        <div class="transition-logo">A.R.C.H.I.E.</div>
        <div class="transition-bar">
            <div class="transition-progress"></div>
        </div>
        <div class="transition-text">LOADING MODULE...</div>
    </div>
</div>

<!-- Admin Operations Navigation -->
<nav class="admin-ops-nav">
    <div class="nav-left">
        <a href="{{ url_for('dashboard') }}" class="nav-back-btn" onclick="showTransition(event, this.href)">
            <i data-lucide="arrow-left"></i>
            <span>DASHBOARD</span>
        </a>
    </div>

    <div class="nav-center">
        <span class="nav-category-label">
            <i data-lucide="activity"></i>
            ADMIN OPERATIONS
        </span>
    </div>

    <div class="nav-right">
        <!-- Theme Controls -->
        <div class="theme-controls">
            <button class="nav-icon-btn" onclick="toggleTheme()" title="Toggle Light/Dark Mode">
                <i data-lucide="sun" id="themeIcon"></i>
            </button>
            <button class="nav-icon-btn" onclick="showLanguageMenu()" title="Language (Coming Soon)">
                <i data-lucide="globe"></i>
            </button>
        </div>
        <div class="nav-divider"></div>
        {% if current_user.is_authenticated and current_user.is_admin %}
        <a href="{{ url_for('dev_hq.index') }}"
           class="nav-module-btn {% if request.endpoint and 'dev_hq' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Dev HQ">
            <i data-lucide="compass"></i>
        </a>
        {% endif %}
        <a href="{{ url_for('bridge.bridge_dashboard') }}"
           class="nav-module-btn {% if request.endpoint and 'bridge' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Bridge Command">
            <i data-lucide="monitor"></i>
            <span>Bridge</span>
        </a>
        <a href="{{ url_for('team_management.index') }}"
           class="nav-module-btn {% if request.endpoint and 'team_management' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Team Management">
            <i data-lucide="users-round"></i>
            <span>Team</span>
        </a>
        <a href="{{ url_for('consciousness.index') }}"
           class="nav-module-btn {% if request.endpoint and 'consciousness' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Consciousness">
            <i data-lucide="brain"></i>
            <span>Mind</span>
        </a>
        <!-- HR Management merged into Team Management - 2026-02-03 -->
        <!-- HR features now at /tools/team-management/api/hr/* -->
        <a href="{{ url_for('pool_management.index') }}"
           class="nav-module-btn {% if request.endpoint and 'pool_management' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Pool Management">
            <i data-lucide="sliders"></i>
            <span>Pool</span>
        </a>
        <!-- Goose module not yet registered as blueprint -->
        <!--
        <a href="/tools/goose"
           class="nav-module-btn {% if request.endpoint and 'goose' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Goose Orchestration">
            <i data-lucide="bot"></i>
            <span>Goose</span>
        </a>
        -->
        <a href="{{ url_for('project_manager.dashboard') }}"
           class="nav-module-btn {% if request.endpoint and 'project_manager' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Project Manager">
            <i data-lucide="folder-kanban"></i>
            <span>Projects</span>
        </a>
    </div>
</nav>

<style>
/* ═══════════════════════════════════════════════════════════════════════════════
   PAGE TRANSITION OVERLAY
   ═══════════════════════════════════════════════════════════════════════════════ */
.page-transition-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
}

.page-transition-overlay.active {
    opacity: 1;
    visibility: visible;
}

.transition-content {
    text-align: center;
}

.transition-logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 0.2em;
    color: #FFAA00;
    text-shadow: 0 0 30px rgba(255, 170, 0, 0.5), 0 0 60px rgba(255, 170, 0, 0.3);
    margin-bottom: 24px;
    animation: transitionPulse 1s ease-in-out infinite;
}

@keyframes transitionPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

.transition-bar {
    width: 200px;
    height: 4px;
    background: rgba(255, 170, 0, 0.2);
    border-radius: 2px;
    margin: 0 auto 16px;
    overflow: hidden;
}

.transition-progress {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #FFAA00, #FF8C00);
    border-radius: 2px;
    animation: transitionLoad 0.8s ease-out forwards;
}

@keyframes transitionLoad {
    0% { width: 0; }
    100% { width: 100%; }
}

.transition-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: rgba(255, 170, 0, 0.7);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ADMIN OPERATIONS NAVIGATION BAR
   ═══════════════════════════════════════════════════════════════════════════════ */
.admin-ops-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 24px;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.85) 100%);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 170, 0, 0.2);
    margin-bottom: 24px;
}

.admin-ops-nav::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 170, 0, 0.5), transparent);
}

/* Nav Left - Back Button */
.nav-left {
    flex: 1;
}

.nav-back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: transparent;
    border: 1px solid rgba(0, 255, 65, 0.3);
    border-radius: 8px;
    color: #00FF41;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-decoration: none;
    text-transform: uppercase;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.nav-back-btn:hover {
    background: rgba(0, 255, 65, 0.1);
    border-color: rgba(0, 255, 65, 0.5);
    box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
    transform: translateX(-3px);
}

.nav-back-btn i {
    width: 16px;
    height: 16px;
}

/* Nav Center - Category Label */
.nav-center {
    flex: 1;
    text-align: center;
}

.nav-category-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: #FFAA00;
    text-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
}

.nav-category-label i {
    width: 18px;
    height: 18px;
}

/* Nav Right - Module Buttons */
.nav-right {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
}

/* Theme Controls */
.theme-controls {
    display: flex;
    gap: 4px;
}

.nav-icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: transparent;
    border: 1px solid rgba(255, 170, 0, 0.2);
    border-radius: 8px;
    color: rgba(255, 170, 0, 0.6);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.nav-icon-btn:hover {
    color: #FFAA00;
    border-color: rgba(255, 170, 0, 0.5);
    background: rgba(255, 170, 0, 0.1);
    box-shadow: 0 0 15px rgba(255, 170, 0, 0.15);
}

.nav-icon-btn i {
    width: 18px;
    height: 18px;
}

.nav-divider {
    width: 1px;
    height: 24px;
    background: rgba(255, 170, 0, 0.2);
    margin: 0 8px;
}

/* Light Mode - Admin Nav */
body.light-mode .admin-ops-nav {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 249, 250, 0.9) 100%);
    border-bottom: 1px solid rgba(204, 102, 0, 0.2);
}

body.light-mode .admin-ops-nav::after {
    background: linear-gradient(90deg, transparent, rgba(204, 102, 0, 0.4), transparent);
}

body.light-mode .nav-back-btn {
    color: #00aa33;
    border-color: rgba(0, 170, 51, 0.3);
}

body.light-mode .nav-back-btn:hover {
    background: rgba(0, 170, 51, 0.08);
    border-color: rgba(0, 170, 51, 0.5);
    box-shadow: 0 0 15px rgba(0, 170, 51, 0.15);
}

body.light-mode .nav-category-label {
    color: #cc6600;
    text-shadow: none;
}

body.light-mode .nav-module-btn {
    color: rgba(204, 102, 0, 0.7);
    border-color: rgba(204, 102, 0, 0.2);
}

body.light-mode .nav-module-btn:hover {
    color: #cc6600;
    border-color: rgba(204, 102, 0, 0.4);
    background: rgba(204, 102, 0, 0.05);
}

body.light-mode .nav-module-btn::before {
    background: #cc6600;
}

body.light-mode .nav-module-btn.active {
    color: #cc6600;
    border-color: rgba(204, 102, 0, 0.5);
    background: rgba(204, 102, 0, 0.08);
    box-shadow: 0 0 15px rgba(204, 102, 0, 0.1);
}

body.light-mode .nav-icon-btn {
    color: rgba(204, 102, 0, 0.6);
    border-color: rgba(204, 102, 0, 0.2);
}

body.light-mode .nav-icon-btn:hover {
    color: #cc6600;
    border-color: rgba(204, 102, 0, 0.5);
    background: rgba(204, 102, 0, 0.08);
    box-shadow: 0 0 15px rgba(204, 102, 0, 0.1);
}

body.light-mode .nav-divider {
    background: rgba(204, 102, 0, 0.2);
}

body.light-mode .page-transition-overlay {
    background: #f8f9fa;
}

body.light-mode .transition-logo {
    color: #cc6600;
    text-shadow: 0 0 20px rgba(204, 102, 0, 0.3);
}

body.light-mode .transition-bar {
    background: rgba(204, 102, 0, 0.1);
}

body.light-mode .transition-progress {
    background: linear-gradient(90deg, #cc6600, #ff8c00);
}

body.light-mode .transition-text {
    color: rgba(204, 102, 0, 0.7);
}

.nav-module-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: transparent;
    border: 1px solid rgba(255, 170, 0, 0.2);
    border-radius: 8px;
    color: rgba(255, 170, 0, 0.6);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.05em;
    text-decoration: none;
    text-transform: uppercase;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
}

.nav-module-btn::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: #FFAA00;
    transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.nav-module-btn:hover {
    color: #FFAA00;
    border-color: rgba(255, 170, 0, 0.4);
    background: rgba(255, 170, 0, 0.05);
}

.nav-module-btn:hover::before {
    width: 60%;
}

.nav-module-btn.active {
    color: #FFAA00;
    border-color: rgba(255, 170, 0, 0.5);
    background: rgba(255, 170, 0, 0.1);
    box-shadow: 0 0 15px rgba(255, 170, 0, 0.15);
}

.nav-module-btn.active::before {
    width: 80%;
}

.nav-module-btn i {
    width: 14px;
    height: 14px;
}

/* Responsive */
@media (max-width: 900px) {
    .admin-ops-nav {
        flex-wrap: wrap;
        gap: 12px;
        padding: 12px 16px;
    }

    .nav-left, .nav-center, .nav-right {
        flex: none;
    }

    .nav-center {
        order: -1;
        width: 100%;
        margin-bottom: 8px;
    }

    .nav-module-btn span {
        display: none;
    }

    .nav-module-btn {
        padding: 10px;
    }

    .nav-module-btn i {
        width: 18px;
        height: 18px;
    }
}

@media (max-width: 500px) {
    .nav-back-btn span {
        display: none;
    }

    .nav-back-btn {
        padding: 10px;
    }
}
</style>

<script>
// Page Transition Handler
function showTransition(event, targetUrl) {
    // Don't transition if clicking current page
    if (event.currentTarget.classList.contains('active')) {
        event.preventDefault();
        return;
    }

    event.preventDefault();
    const overlay = document.getElementById('pageTransition');
    overlay.classList.add('active');

    // Navigate after animation
    setTimeout(() => {
        window.location.href = targetUrl;
    }, 600);
}

// Initialize Lucide icons in nav
document.addEventListener('DOMContentLoaded', function() {
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
});

// Hide transition on page load (for back button)
window.addEventListener('pageshow', function(event) {
    const overlay = document.getElementById('pageTransition');
    if (overlay) {
        overlay.classList.remove('active');
    }
});
</script>
