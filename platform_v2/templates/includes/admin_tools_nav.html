<!-- ═══════════════════════════════════════════════════════════════════════════════
   Admin Tools Navigation Bar
   Shared component for Backup Manager, Security & Network, Account Center, Pool Management
   Phase 29.8: Category Navigation System
   ═══════════════════════════════════════════════════════════════════════════════ -->

<!-- Page Transition Overlay -->
<div class="page-transition-overlay admin-transition" id="pageTransition">
    <div class="transition-content">
        <div class="transition-logo">A.R.C.H.I.E.</div>
        <div class="transition-bar">
            <div class="transition-progress"></div>
        </div>
        <div class="transition-text">LOADING MODULE...</div>
    </div>
</div>

<!-- Admin Tools Navigation -->
<nav class="category-nav admin-tools-nav">
    <div class="nav-left">
        <a href="{{ url_for('dashboard') }}" class="nav-back-btn" onclick="showTransition(event, this.href)">
            <i data-lucide="arrow-left"></i>
            <span>DASHBOARD</span>
        </a>
    </div>

    <div class="nav-center">
        <span class="nav-category-label">
            <i data-lucide="settings-2"></i>
            ADMIN TOOLS
        </span>
    </div>

    <div class="nav-right">
        <!-- Theme Controls -->
        <div class="theme-controls">
            <button class="nav-icon-btn" onclick="toggleTheme()" title="Toggle Light/Dark Mode">
                <i data-lucide="sun" id="themeIcon"></i>
            </button>
            <button class="nav-icon-btn" onclick="showLanguageMenu()" title="Language (Coming Soon)">
                <i data-lucide="globe"></i>
            </button>
        </div>
        <div class="nav-divider"></div>
        <a href="{{ url_for('account_center.index') }}"
           class="nav-module-btn {% if request.endpoint and 'account_center' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Account Center">
            <i data-lucide="user"></i>
            <span>Accounts</span>
        </a>
        <a href="{{ url_for('system_operations.index') }}"
           class="nav-module-btn {% if request.endpoint and 'system_operations' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="System Operations">
            <i data-lucide="server"></i>
            <span>System Ops</span>
        </a>
    </div>
</nav>

<style>
/* ═══════════════════════════════════════════════════════════════════════════════
   PAGE TRANSITION OVERLAY - ADMIN TOOLS (RED THEME)
   ═══════════════════════════════════════════════════════════════════════════════ */
.admin-transition .transition-logo {
    color: #f97316;
    text-shadow: 0 0 30px rgba(255, 107, 107, 0.5), 0 0 60px rgba(255, 107, 107, 0.3);
}

.admin-transition .transition-bar {
    background: rgba(255, 107, 107, 0.2);
}

.admin-transition .transition-progress {
    background: linear-gradient(90deg, #f97316, #fb923c);
}

.admin-transition .transition-text {
    color: rgba(255, 107, 107, 0.7);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ADMIN TOOLS NAVIGATION BAR (RED THEME)
   ═══════════════════════════════════════════════════════════════════════════════ */
.admin-tools-nav {
    border-bottom: 1px solid rgba(255, 107, 107, 0.2);
}

.admin-tools-nav::after {
    background: linear-gradient(90deg, transparent, rgba(255, 107, 107, 0.5), transparent);
}

.admin-tools-nav .nav-category-label {
    color: #f97316;
    text-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
}

.admin-tools-nav .nav-module-btn {
    border-color: rgba(255, 107, 107, 0.2);
    color: rgba(255, 107, 107, 0.6);
}

.admin-tools-nav .nav-module-btn::before {
    background: #f97316;
}

.admin-tools-nav .nav-module-btn:hover {
    color: #f97316;
    border-color: rgba(255, 107, 107, 0.4);
    background: rgba(255, 107, 107, 0.05);
}

.admin-tools-nav .nav-module-btn.active {
    color: #f97316;
    border-color: rgba(255, 107, 107, 0.5);
    background: rgba(255, 107, 107, 0.1);
    box-shadow: 0 0 15px rgba(255, 107, 107, 0.15);
}

/* Theme Controls */
.admin-tools-nav .theme-controls {
    display: flex;
    gap: 4px;
}

.admin-tools-nav .nav-icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: transparent;
    border: 1px solid rgba(255, 107, 107, 0.2);
    border-radius: 8px;
    color: rgba(255, 107, 107, 0.6);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.admin-tools-nav .nav-icon-btn:hover {
    color: #f97316;
    border-color: rgba(255, 107, 107, 0.5);
    background: rgba(255, 107, 107, 0.1);
    box-shadow: 0 0 15px rgba(255, 107, 107, 0.15);
}

.admin-tools-nav .nav-icon-btn i {
    width: 18px;
    height: 18px;
}

.admin-tools-nav .nav-divider {
    width: 1px;
    height: 24px;
    background: rgba(255, 107, 107, 0.2);
    margin: 0 8px;
}

/* Light Mode - Admin Tools Nav */
body.light-mode .admin-tools-nav {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 249, 250, 0.9) 100%);
    border-bottom: 1px solid rgba(204, 34, 68, 0.2);
}

body.light-mode .admin-tools-nav::after {
    background: linear-gradient(90deg, transparent, rgba(204, 34, 68, 0.4), transparent);
}

body.light-mode .admin-tools-nav .nav-category-label {
    color: #ea580c;
    text-shadow: none;
}

body.light-mode .admin-tools-nav .nav-module-btn {
    color: rgba(204, 34, 68, 0.7);
    border-color: rgba(204, 34, 68, 0.2);
}

body.light-mode .admin-tools-nav .nav-module-btn:hover {
    color: #ea580c;
    border-color: rgba(204, 34, 68, 0.4);
    background: rgba(204, 34, 68, 0.05);
}

body.light-mode .admin-tools-nav .nav-module-btn::before {
    background: #ea580c;
}

body.light-mode .admin-tools-nav .nav-module-btn.active {
    color: #ea580c;
    border-color: rgba(204, 34, 68, 0.5);
    background: rgba(204, 34, 68, 0.08);
    box-shadow: 0 0 15px rgba(204, 34, 68, 0.1);
}

body.light-mode .admin-tools-nav .nav-icon-btn {
    color: rgba(204, 34, 68, 0.6);
    border-color: rgba(204, 34, 68, 0.2);
}

body.light-mode .admin-tools-nav .nav-icon-btn:hover {
    color: #ea580c;
    border-color: rgba(204, 34, 68, 0.5);
    background: rgba(204, 34, 68, 0.08);
    box-shadow: 0 0 15px rgba(204, 34, 68, 0.1);
}

body.light-mode .admin-tools-nav .nav-divider {
    background: rgba(204, 34, 68, 0.2);
}

body.light-mode .admin-transition .transition-logo {
    color: #ea580c;
    text-shadow: 0 0 20px rgba(204, 34, 68, 0.3);
}

body.light-mode .admin-transition .transition-bar {
    background: rgba(204, 34, 68, 0.1);
}

body.light-mode .admin-transition .transition-progress {
    background: linear-gradient(90deg, #ea580c, #fb923c);
}

body.light-mode .admin-transition .transition-text {
    color: rgba(204, 34, 68, 0.7);
}

body.light-mode .admin-transition {
    background: #f8f9fa;
}
</style>

<script>
// Page Transition Handler
function showTransition(event, targetUrl) {
    // Don't transition if clicking current page
    if (event.currentTarget.classList.contains('active')) {
        event.preventDefault();
        return;
    }

    event.preventDefault();
    const overlay = document.getElementById('pageTransition');
    overlay.classList.add('active');

    // Navigate after animation
    setTimeout(() => {
        window.location.href = targetUrl;
    }, 600);
}

// Initialize Lucide icons in nav
document.addEventListener('DOMContentLoaded', function() {
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
});

// Hide transition on page load (for back button)
window.addEventListener('pageshow', function(event) {
    const overlay = document.getElementById('pageTransition');
    if (overlay) {
        overlay.classList.remove('active');
    }
});
</script>
