<!-- ═══════════════════════════════════════════════════════════════════════════════
   Admin Tools Navigation Bar
   Shared component for Account Center, System Operations, Backup Manager, Security & Network
   Phase 29.8: Category Navigation System
   ═══════════════════════════════════════════════════════════════════════════════ -->

<!-- Page Transition Overlay -->
<div class="page-transition-overlay admin-transition" id="pageTransition">
    <div class="transition-content">
        <div class="transition-logo">A.R.C.H.I.E.</div>
        <div class="transition-bar">
            <div class="transition-progress"></div>
        </div>
        <div class="transition-text">LOADING MODULE...</div>
    </div>
</div>

<!-- Admin Tools Navigation -->
<nav class="category-nav admin-tools-nav">
    <div class="nav-left">
        <a href="{{ url_for('dashboard') }}" class="nav-back-btn" onclick="showTransition(event, this.href)">
            <i data-lucide="arrow-left"></i>
            <span>DASHBOARD</span>
        </a>
    </div>

    <div class="nav-center">
        <span class="nav-category-label">
            <i data-lucide="settings-2"></i>
            ADMIN TOOLS
        </span>
    </div>

    <div class="nav-right">
        <div class="nav-utils">
            <button class="nav-icon-btn" onclick="toggleTheme()" title="Toggle Light/Dark Mode">
                <i data-lucide="sun" id="themeIcon"></i>
            </button>
            <button class="nav-icon-btn" onclick="showLanguageMenu()" title="Language (Coming Soon)">
                <i data-lucide="globe"></i>
            </button>
            {% if current_user.is_authenticated and current_user.is_admin %}
            <a href="{{ url_for('dev_hq.index') }}"
               class="nav-icon-btn {% if request.endpoint and 'dev_hq' in request.endpoint %}active{% endif %}"
               onclick="showTransition(event, this.href)"
               title="Dev HQ">
                <i data-lucide="compass"></i>
            </a>
            {% endif %}
        </div>
        <div class="nav-modules">
        <a href="{{ url_for('account_center.index') }}"
           class="nav-module-btn {% if request.endpoint and 'account_center' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Account Center">
            <i data-lucide="user"></i>
            <span>Accounts</span>
        </a>
        <a href="{{ url_for('system_operations.index') }}"
           class="nav-module-btn {% if request.endpoint and 'system_operations' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="System Operations">
            <i data-lucide="server"></i>
            <span>System Ops</span>
        </a>
        <a href="{{ url_for('backup_manager.index') }}"
           class="nav-module-btn {% if request.endpoint and 'backup_manager' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Backup Manager">
            <i data-lucide="hard-drive"></i>
            <span>Backups</span>
        </a>
        <a href="{{ url_for('security_network.index') }}"
           class="nav-module-btn {% if request.endpoint and 'security_network' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Security & Network">
            <i data-lucide="shield"></i>
            <span>Security</span>
        </a>
        </div>
    </div>
</nav>

<style>
/* Admin Tools Nav — accent override */
.admin-tools-nav { --cat-accent: #f97316; --cat-accent-light: #ea580c; }
</style>

<script>
// Page Transition Handler
function showTransition(event, targetUrl) {
    // Don't transition if clicking current page
    if (event.currentTarget.classList.contains('active')) {
        event.preventDefault();
        return;
    }

    event.preventDefault();
    const overlay = document.getElementById('pageTransition');
    overlay.classList.add('active');

    // Navigate after animation
    setTimeout(() => {
        window.location.href = targetUrl;
    }, 600);
}

// Initialize Lucide icons in nav
document.addEventListener('DOMContentLoaded', function() {
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
});

// Hide transition on page load (for back button)
window.addEventListener('pageshow', function(event) {
    const overlay = document.getElementById('pageTransition');
    if (overlay) {
        overlay.classList.remove('active');
    }
});
</script>
