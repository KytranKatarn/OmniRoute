<!-- ═══════════════════════════════════════════════════════════════════════════════
   Creation Tools Navigation Bar — LCARS Command Bar Frame
   Shared component for Game Studio, Media Studio, Content Studio
   Matches Dashboard command bar pattern: sidebar + thin bar + body + footer bar
   ═══════════════════════════════════════════════════════════════════════════════ -->

<!-- Page Transition Overlay -->
<div class="page-transition-overlay creation-transition" id="pageTransition">
    <div class="transition-content">
        <div class="transition-logo">A.R.C.H.I.E.</div>
        <div class="transition-bar">
            <div class="transition-progress"></div>
        </div>
        <div class="transition-text">LOADING MODULE...</div>
    </div>
</div>

<!-- Creation Tools — LCARS Compact Command Bar Frame -->
<nav class="category-nav creation-tools-nav" style="padding: 0; background: transparent; border: none; box-shadow: none;">
    <div style="--frame-color: var(--cat-accent, #F59E0B); --frame-rgb: 245,158,11; width: 100%;">
        <div class="lcars-frame" style="display: flex !important; align-items: stretch !important;">
            <div class="lcars-sidebar" style="display: flex !important; flex-direction: column !important; flex-shrink: 0 !important; width: 48px !important; gap: 4px !important;">
                <div class="lcars-elbow-top" style="height: 52px !important; background: var(--cat-accent, #F59E0B) !important; border-radius: 20px 0 0 0 !important; position: relative !important; flex-shrink: 0 !important;"></div>
                <div class="lcars-elbow-bottom" style="height: 28px !important; background: var(--cat-accent, #F59E0B) !important; border-radius: 0 0 0 20px !important; position: relative !important; flex-shrink: 0 !important; transform: scaleY(-1) !important;"></div>
                <div class="lcars-seg" style="height: 12px !important; border-radius: 0 8px 8px 0 !important; background: var(--cat-accent, #F59E0B) !important; flex-shrink: 0 !important;"></div>
                <div class="lcars-seg" style="height: 12px !important; border-radius: 0 8px 8px 0 !important; background: #00ffff !important; flex-shrink: 0 !important;"></div>
                <div class="lcars-elbow-bottom" style="height: 36px !important; background: var(--cat-accent, #F59E0B) !important; border-radius: 0 0 0 20px !important; position: relative !important; flex-shrink: 0 !important;"></div>
            </div>
            <div class="lcars-content" style="flex: 1 !important; display: flex !important; flex-direction: column !important; margin-left: 8px !important; min-width: 0 !important;">
                <!-- Thin bar across the top -->
                <div class="lcars-bar" style="background: var(--cat-accent, #F59E0B) !important; height: 14px !important; min-height: 14px !important; flex-shrink: 0 !important; border-radius: 0 20px 20px 0 !important; padding: 0 !important;"></div>
                <!-- Nav body — same 3-zone layout as Dashboard command bar -->
                <div class="lcars-body" role="navigation" aria-label="Creation Tools navigation" style="display: flex !important; align-items: center !important; justify-content: space-between !important; gap: 12px !important; padding: 4px 16px !important; flex: 1 !important; font-family: var(--archie-font-mono, 'JetBrains Mono', monospace) !important;">
                    <!-- Left Zone: Dashboard back + Category label -->
                    <div class="nav-left" style="display: flex; align-items: center; gap: 8px;">
                        <a href="{{ url_for('dashboard') }}" class="nav-back-btn" onclick="showTransition(event, this.href)">
                            <i data-lucide="arrow-left"></i>
                            <span>DASHBOARD</span>
                        </a>
                        <span class="nav-category-label">
                            <i data-lucide="sparkles"></i>
                            CREATION TOOLS
                        </span>
                    </div>
                    <!-- Center Zone: Module buttons -->
                    <div class="nav-modules" style="display: flex; align-items: center; gap: 6px;">
                        <a href="/tools/game-studio"
                           class="nav-module-btn {% if request.endpoint and 'game_studio' in request.endpoint %}active{% endif %}"
                           onclick="showTransition(event, this.href)"
                           title="Game Studio">
                            <i data-lucide="gamepad-2"></i>
                            <span>Games</span>
                        </a>
                        <a href="/tools/media-studio"
                           class="nav-module-btn {% if request.endpoint and 'media_studio' in request.endpoint %}active{% endif %}"
                           onclick="showTransition(event, this.href)"
                           title="Media Studio">
                            <i data-lucide="palette"></i>
                            <span>Media</span>
                        </a>
                        <a href="/tools/content-studio"
                           class="nav-module-btn {% if request.endpoint and 'content_studio' in request.endpoint %}active{% endif %}"
                           onclick="showTransition(event, this.href)"
                           title="Content Studio">
                            <i data-lucide="file-text"></i>
                            <span>Content</span>
                        </a>
                    </div>
                    <!-- Right Zone: Utils -->
                    <div class="nav-utils" style="display: flex; align-items: center; gap: 6px;">
                        <!-- Theme toggle — cyan -->
                        <button class="nav-icon-btn" data-accent="cyan" onclick="toggleTheme()" title="Toggle Light/Dark Mode">
                            <svg id="navThemeIconSun" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><circle cx="12" cy="12" r="5"/><rect x="11" y="1" width="2" height="4" rx="1"/><rect x="11" y="19" width="2" height="4" rx="1"/><rect x="1" y="11" width="4" height="2" rx="1"/><rect x="19" y="11" width="4" height="2" rx="1"/></svg>
                            <svg id="navThemeIconMoon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
                        </button>
                        <!-- Language — purple -->
                        <div style="position:relative;">
                            <button class="nav-icon-btn" data-accent="purple" id="navLangBtn" onclick="toggleNavLangMenu()" title="Language">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
                            </button>
                            <div class="nav-lang-menu hidden" id="navLangMenu">
                                <button class="nav-lang-option active" data-lang="en">English</button>
                                <button class="nav-lang-option" data-lang="fr">Fran&ccedil;ais (QC)</button>
                                <button class="nav-lang-option" data-lang="es">Espa&ntilde;ol</button>
                                <button class="nav-lang-option" data-lang="pt">Portugu&ecirc;s</button>
                                <button class="nav-lang-option" data-lang="de">Deutsch</button>
                                <button class="nav-lang-option" data-lang="zh">&#x4E2D;&#x6587;</button>
                                <button class="nav-lang-option" data-lang="ar">&#x0627;&#x0644;&#x0639;&#x0631;&#x0628;&#x064A;&#x0629;</button>
                                <button class="nav-lang-option" data-lang="he">&#x05E2;&#x05D1;&#x05E8;&#x05D9;&#x05EA;</button>
                            </div>
                        </div>
                        <!-- Dev HQ — green -->
                        {% if current_user.is_authenticated and current_user.is_admin %}
                        <a href="{{ url_for('dev_hq.index') }}"
                           class="nav-icon-btn {% if request.endpoint and 'dev_hq' in request.endpoint %}active{% endif %}"
                           data-accent="green"
                           onclick="showTransition(event, this.href)"
                           title="Dev HQ">
                            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
                        </a>
                        {% endif %}
                    </div>
                </div>
                <!-- Footer bar -->
                <div class="lcars-footer-bar" style="background: var(--cat-accent, #F59E0B) !important; height: 10px !important; min-height: 10px !important; flex-shrink: 0 !important; display: flex !important; border-radius: 0 20px 20px 0 !important;"></div>
            </div>
        </div>
    </div>
</nav>

<style>
/* Creation Tools — Amber accent */
.creation-tools-nav { --cat-accent: #F59E0B; --cat-accent-light: #D97706; }
/* Reset nav background since LCARS frame provides the structure */
.creation-tools-nav.category-nav { background: transparent !important; border-bottom: none !important; box-shadow: none !important; min-height: auto !important; }
</style>

<script>
// Page Transition Handler
function showTransition(event, targetUrl) {
    if (event.currentTarget.classList.contains('active')) {
        event.preventDefault();
        return;
    }
    event.preventDefault();
    var overlay = document.getElementById('pageTransition');
    overlay.classList.add('active');
    setTimeout(function() {
        window.location.href = targetUrl;
    }, 600);
}

// Initialize Lucide icons in nav
document.addEventListener('DOMContentLoaded', function() {
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
});

// Hide transition on page load (for back button)
window.addEventListener('pageshow', function() {
    var overlay = document.getElementById('pageTransition');
    if (overlay) overlay.classList.remove('active');
});

// ═══════════════════════════════════════════════════════════════════════
// LANGUAGE DROPDOWN
// ═══════════════════════════════════════════════════════════════════════
function toggleNavLangMenu() {
    var menu = document.getElementById('navLangMenu');
    if (menu) menu.classList.toggle('hidden');
}

// Close on outside click
document.addEventListener('click', function(e) {
    var menu = document.getElementById('navLangMenu');
    var btn = document.getElementById('navLangBtn');
    if (!menu || menu.classList.contains('hidden')) return;
    if (!menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
        menu.classList.add('hidden');
    }
});

// Language selection
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.nav-lang-option').forEach(function(opt) {
        opt.addEventListener('click', function() {
            var lang = opt.getAttribute('data-lang');
            document.querySelectorAll('.nav-lang-option').forEach(function(o) { o.classList.remove('active'); });
            opt.classList.add('active');
            document.getElementById('navLangMenu').classList.add('hidden');
            if (window.archieI18n) {
                archieI18n.switchLanguage(lang);
            }
        });
    });

    // Sync active language on load
    if (window.archieI18n) {
        archieI18n.init();
        setTimeout(function() {
            var curLang = archieI18n.getCurrentLanguage();
            document.querySelectorAll('.nav-lang-option').forEach(function(o) {
                o.classList.toggle('active', o.getAttribute('data-lang') === curLang);
            });
        }, 600);
    }

    // Theme icon sync
    function syncNavThemeIcons() {
        var sunIcon = document.getElementById('navThemeIconSun');
        var moonIcon = document.getElementById('navThemeIconMoon');
        if (!sunIcon || !moonIcon) return;
        var isLight = document.documentElement.getAttribute('data-theme') === 'light' ||
                      document.body.classList.contains('light-mode');
        sunIcon.style.display = isLight ? 'none' : 'inline-block';
        moonIcon.style.display = isLight ? 'inline-block' : 'none';
    }
    syncNavThemeIcons();
    var navThemeObs = new MutationObserver(syncNavThemeIcons);
    navThemeObs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    navThemeObs.observe(document.body, { attributes: true, attributeFilter: ['class'] });
});
</script>
