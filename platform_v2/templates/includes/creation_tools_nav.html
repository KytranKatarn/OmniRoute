<!-- ═══════════════════════════════════════════════════════════════════════════════
   Creation Tools Navigation Bar
   Shared component for Project Builder, Game Studio, Media Studio, Content Studio
   Phase 5: Module Consolidation - CREATION Category
   ═══════════════════════════════════════════════════════════════════════════════ -->

<!-- Page Transition Overlay -->
<div class="page-transition-overlay creation-transition" id="pageTransition">
    <div class="transition-content">
        <div class="transition-logo">A.R.C.H.I.E.</div>
        <div class="transition-bar">
            <div class="transition-progress"></div>
        </div>
        <div class="transition-text">LOADING MODULE...</div>
    </div>
</div>

<!-- Creation Tools Navigation -->
<nav class="category-nav creation-tools-nav">
    <div class="nav-left">
        <a href="{{ url_for('dashboard') }}" class="nav-back-btn" onclick="showTransition(event, this.href)">
            <i data-lucide="arrow-left"></i>
            <span>DASHBOARD</span>
        </a>
    </div>

    <div class="nav-center">
        <span class="nav-category-label">
            <i data-lucide="sparkles"></i>
            CREATION TOOLS
        </span>
    </div>

    <div class="nav-right">
        <div class="nav-utils">
            <button class="nav-icon-btn" onclick="toggleTheme()" title="Toggle Light/Dark Mode">
                <i data-lucide="sun" id="themeIcon"></i>
            </button>
            <button class="nav-icon-btn" onclick="showLanguageMenu()" title="Language (Coming Soon)">
                <i data-lucide="globe"></i>
            </button>
            {% if current_user.is_authenticated and current_user.is_admin %}
            <a href="{{ url_for('dev_hq.index') }}"
               class="nav-icon-btn {% if request.endpoint and 'dev_hq' in request.endpoint %}active{% endif %}"
               onclick="showTransition(event, this.href)"
               title="Dev HQ">
                <i data-lucide="compass"></i>
            </a>
            {% endif %}
        </div>
        <div class="nav-modules">
        <a href="/tools/game-studio"
           class="nav-module-btn {% if request.endpoint and 'game_studio' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Game Studio">
            <i data-lucide="gamepad-2"></i>
            <span>Games</span>
        </a>
        <a href="/tools/media-studio"
           class="nav-module-btn {% if request.endpoint and 'media_studio' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Media Studio">
            <i data-lucide="palette"></i>
            <span>Media</span>
        </a>
        <a href="/tools/content-studio"
           class="nav-module-btn {% if request.endpoint and 'content_studio' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Content Studio">
            <i data-lucide="file-text"></i>
            <span>Content</span>
        </a>
        </div>
    </div>
</nav>

<style>
/* Creation Tools Nav — accent override */
.creation-tools-nav { --cat-accent: #F59E0B; --cat-accent-light: #D97706; }
</style>

<script>
// Page Transition Handler
function showTransition(event, targetUrl) {
    // Don't transition if clicking current page
    if (event.currentTarget.classList.contains('active')) {
        event.preventDefault();
        return;
    }

    event.preventDefault();
    const overlay = document.getElementById('pageTransition');
    overlay.classList.add('active');

    // Navigate after animation
    setTimeout(() => {
        window.location.href = targetUrl;
    }, 600);
}

// Language menu placeholder
function showLanguageMenu() {
    // Show toast notification
    if (typeof showToast === 'function') {
        showToast('Language selection coming soon!', 'info');
    } else {
        alert('Language selection coming soon!');
    }
}

// Initialize Lucide icons in nav
document.addEventListener('DOMContentLoaded', function() {
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
});

// Hide transition on page load (for back button)
window.addEventListener('pageshow', function(event) {
    const overlay = document.getElementById('pageTransition');
    if (overlay) {
        overlay.classList.remove('active');
    }
});
</script>
