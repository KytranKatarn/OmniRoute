<!-- ═══════════════════════════════════════════════════════════════════════════════
   Development Tools Navigation Bar
   Shared component for Code Editor, CodeRabbit, Improvements Lab, Sandbox Manager
   Phase 29.8: Category Navigation System
   ═══════════════════════════════════════════════════════════════════════════════ -->

<!-- Page Transition Overlay -->
<div class="page-transition-overlay dev-transition" id="pageTransition">
    <div class="transition-content">
        <div class="transition-logo">A.R.C.H.I.E.</div>
        <div class="transition-bar">
            <div class="transition-progress"></div>
        </div>
        <div class="transition-text">LOADING MODULE...</div>
    </div>
</div>

<!-- Development Tools Navigation -->
<nav class="category-nav dev-tools-nav">
    <div class="nav-left">
        <a href="{{ url_for('dashboard') }}" class="nav-back-btn" onclick="showTransition(event, this.href)">
            <i data-lucide="arrow-left"></i>
            <span>DASHBOARD</span>
        </a>
    </div>

    <div class="nav-center">
        <span class="nav-category-label">
            <i data-lucide="code-2"></i>
            DEVELOPMENT TOOLS
        </span>
    </div>

    <div class="nav-right">
        <!-- Theme Controls -->
        <div class="theme-controls">
            <button class="nav-icon-btn" onclick="toggleTheme()" title="Toggle Light/Dark Mode">
                <i data-lucide="sun" id="themeIcon"></i>
            </button>
            <button class="nav-icon-btn" onclick="showLanguageMenu()" title="Language (Coming Soon)">
                <i data-lucide="globe"></i>
            </button>
        </div>
        <div class="nav-divider"></div>
        <a href="{{ url_for('coderabbit.index') }}"
           class="nav-module-btn {% if request.endpoint and 'coderabbit' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="CodeRabbit">
            <i data-lucide="rabbit"></i>
            <span>CodeRabbit</span>
        </a>
        <a href="{{ url_for('improvements.index') }}"
           class="nav-module-btn {% if request.endpoint and 'improvements' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Improvements Lab">
            <i data-lucide="wrench"></i>
            <span>Improve</span>
        </a>
        <a href="{{ url_for('sandbox_manager.index') }}"
           class="nav-module-btn {% if request.endpoint and 'sandbox_manager' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Sandbox Manager">
            <i data-lucide="test-tube-2"></i>
            <span>Sandbox</span>
        </a>
    </div>
</nav>

<style>
/* ═══════════════════════════════════════════════════════════════════════════════
   PAGE TRANSITION OVERLAY - DEV TOOLS (CYAN THEME)
   ═══════════════════════════════════════════════════════════════════════════════ */
.dev-transition .transition-logo {
    color: #00FFFF;
    text-shadow: 0 0 30px rgba(0, 255, 255, 0.5), 0 0 60px rgba(0, 255, 255, 0.3);
}

.dev-transition .transition-bar {
    background: rgba(0, 255, 255, 0.2);
}

.dev-transition .transition-progress {
    background: linear-gradient(90deg, #00FFFF, #00CED1);
}

.dev-transition .transition-text {
    color: rgba(0, 255, 255, 0.7);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   DEVELOPMENT TOOLS NAVIGATION BAR (CYAN THEME)
   ═══════════════════════════════════════════════════════════════════════════════ */
.dev-tools-nav {
    border-bottom: 1px solid rgba(0, 255, 255, 0.2);
}

.dev-tools-nav::after {
    background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.5), transparent);
}

.dev-tools-nav .nav-category-label {
    color: #00FFFF;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
}

.dev-tools-nav .nav-module-btn {
    border-color: rgba(0, 255, 255, 0.2);
    color: rgba(0, 255, 255, 0.6);
}

.dev-tools-nav .nav-module-btn::before {
    background: #00FFFF;
}

.dev-tools-nav .nav-module-btn:hover {
    color: #00FFFF;
    border-color: rgba(0, 255, 255, 0.4);
    background: rgba(0, 255, 255, 0.05);
}

.dev-tools-nav .nav-module-btn.active {
    color: #00FFFF;
    border-color: rgba(0, 255, 255, 0.5);
    background: rgba(0, 255, 255, 0.1);
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.15);
}

/* Theme Controls */
.dev-tools-nav .theme-controls {
    display: flex;
    gap: 4px;
}

.dev-tools-nav .nav-icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: transparent;
    border: 1px solid rgba(0, 255, 255, 0.2);
    border-radius: 8px;
    color: rgba(0, 255, 255, 0.6);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.dev-tools-nav .nav-icon-btn:hover {
    color: #00FFFF;
    border-color: rgba(0, 255, 255, 0.5);
    background: rgba(0, 255, 255, 0.1);
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.15);
}

.dev-tools-nav .nav-icon-btn i {
    width: 18px;
    height: 18px;
}

.dev-tools-nav .nav-divider {
    width: 1px;
    height: 24px;
    background: rgba(0, 255, 255, 0.2);
    margin: 0 8px;
}

/* Light Mode - Dev Tools Nav */
body.light-mode .dev-tools-nav {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 249, 250, 0.9) 100%);
    border-bottom: 1px solid rgba(0, 128, 143, 0.2);
}

body.light-mode .dev-tools-nav::after {
    background: linear-gradient(90deg, transparent, rgba(0, 128, 143, 0.4), transparent);
}

body.light-mode .dev-tools-nav .nav-category-label {
    color: #00808f;
    text-shadow: none;
}

body.light-mode .dev-tools-nav .nav-module-btn {
    color: rgba(0, 128, 143, 0.7);
    border-color: rgba(0, 128, 143, 0.2);
}

body.light-mode .dev-tools-nav .nav-module-btn:hover {
    color: #00808f;
    border-color: rgba(0, 128, 143, 0.4);
    background: rgba(0, 128, 143, 0.05);
}

body.light-mode .dev-tools-nav .nav-module-btn::before {
    background: #00808f;
}

body.light-mode .dev-tools-nav .nav-module-btn.active {
    color: #00808f;
    border-color: rgba(0, 128, 143, 0.5);
    background: rgba(0, 128, 143, 0.08);
    box-shadow: 0 0 15px rgba(0, 128, 143, 0.1);
}

body.light-mode .dev-tools-nav .nav-icon-btn {
    color: rgba(0, 128, 143, 0.6);
    border-color: rgba(0, 128, 143, 0.2);
}

body.light-mode .dev-tools-nav .nav-icon-btn:hover {
    color: #00808f;
    border-color: rgba(0, 128, 143, 0.5);
    background: rgba(0, 128, 143, 0.08);
    box-shadow: 0 0 15px rgba(0, 128, 143, 0.1);
}

body.light-mode .dev-tools-nav .nav-divider {
    background: rgba(0, 128, 143, 0.2);
}

body.light-mode .dev-transition {
    background: #f8f9fa;
}

body.light-mode .dev-transition .transition-logo {
    color: #00808f;
    text-shadow: 0 0 20px rgba(0, 128, 143, 0.3);
}

body.light-mode .dev-transition .transition-bar {
    background: rgba(0, 128, 143, 0.1);
}

body.light-mode .dev-transition .transition-progress {
    background: linear-gradient(90deg, #00808f, #00a0a0);
}

body.light-mode .dev-transition .transition-text {
    color: rgba(0, 128, 143, 0.7);
}
</style>

<script>
// Page Transition Handler
function showTransition(event, targetUrl) {
    // Don't transition if clicking current page
    if (event.currentTarget.classList.contains('active')) {
        event.preventDefault();
        return;
    }

    event.preventDefault();
    const overlay = document.getElementById('pageTransition');
    overlay.classList.add('active');

    // Navigate after animation
    setTimeout(() => {
        window.location.href = targetUrl;
    }, 600);
}

// Initialize Lucide icons in nav
document.addEventListener('DOMContentLoaded', function() {
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
});

// Hide transition on page load (for back button)
window.addEventListener('pageshow', function(event) {
    const overlay = document.getElementById('pageTransition');
    if (overlay) {
        overlay.classList.remove('active');
    }
});
</script>
