<!-- ═══════════════════════════════════════════════════════════════════════════════
   Standalone Apps Navigation Bar
   Shared component for DOC, Therapy, Fitness, StockBot, Archie Pool
   Phase 7: Standalone Apps - Red Theme (#EF4444)
   ═══════════════════════════════════════════════════════════════════════════════ -->

<!-- Page Transition Overlay -->
<div class="page-transition-overlay standalone-transition" id="pageTransition">
    <div class="transition-content">
        <div class="transition-logo">A.R.C.H.I.E.</div>
        <div class="transition-bar">
            <div class="transition-progress"></div>
        </div>
        <div class="transition-text">LOADING MODULE...</div>
    </div>
</div>

<!-- Standalone Apps Navigation -->
<nav class="category-nav standalone-apps-nav">
    <div class="nav-left">
        <a href="{{ url_for('dashboard') }}" class="nav-back-btn" onclick="showTransition(event, this.href)">
            <i data-lucide="arrow-left"></i>
            <span>DASHBOARD</span>
        </a>
    </div>

    <div class="nav-center">
        <span class="nav-category-label">
            <i data-lucide="heart-pulse"></i>
            STANDALONE APPS
        </span>
    </div>

    <div class="nav-right">
        <div class="nav-utils">
            <!-- Theme toggle — cyan -->
            <button class="nav-icon-btn" data-accent="cyan" onclick="toggleTheme()" title="Toggle Light/Dark Mode">
                <svg id="navThemeIconSun" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><circle cx="12" cy="12" r="5"/><rect x="11" y="1" width="2" height="4" rx="1"/><rect x="11" y="19" width="2" height="4" rx="1"/><rect x="1" y="11" width="4" height="2" rx="1"/><rect x="19" y="11" width="4" height="2" rx="1"/></svg>
                <svg id="navThemeIconMoon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
            </button>
            <!-- Language — purple -->
            <button class="nav-icon-btn" data-accent="purple" onclick="showLanguageMenu()" title="Language (Coming Soon)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
            </button>
            <!-- Dev HQ — green -->
            {% if current_user.is_authenticated and current_user.is_admin %}
            <a href="{{ url_for('dev_hq.index') }}"
               class="nav-icon-btn {% if request.endpoint and 'dev_hq' in request.endpoint %}active{% endif %}"
               data-accent="green"
               onclick="showTransition(event, this.href)"
               title="Dev HQ">
                <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
            </a>
            {% endif %}
        </div>
        <div class="nav-modules">
        <a href="{{ url_for('doc.index') if 'doc' in url_for.__globals__['current_app'].blueprints else '#' }}"
           class="nav-module-btn {% if request.endpoint and 'doc' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Medical AI Assistant">
            <i data-lucide="stethoscope"></i>
            <span>DOC</span>
        </a>
        <a href="{{ url_for('therapy.index') if 'therapy' in url_for.__globals__['current_app'].blueprints else '#' }}"
           class="nav-module-btn {% if request.endpoint and 'therapy' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Mental Health AI">
            <i data-lucide="flower-2"></i>
            <span>Therapy</span>
        </a>
        <a href="{{ url_for('fitness.index') if 'fitness' in url_for.__globals__['current_app'].blueprints else '#' }}"
           class="nav-module-btn {% if request.endpoint and 'fitness' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="AI Fitness Coach">
            <i data-lucide="dumbbell"></i>
            <span>Fitness</span>
        </a>
        <a href="{{ url_for('stockbot.index') if 'stockbot' in url_for.__globals__['current_app'].blueprints else '#' }}"
           class="nav-module-btn {% if request.endpoint and 'stockbot' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="AI Stock Screener">
            <i data-lucide="trending-up"></i>
            <span>StockBot</span>
        </a>
        <a href="{{ url_for('archie_pool.index') if 'archie_pool' in url_for.__globals__['current_app'].blueprints else '#' }}"
           class="nav-module-btn {% if request.endpoint and 'archie_pool' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="RVN Mining Pool">
            <i data-lucide="pickaxe"></i>
            <span>Pool</span>
        </a>
        <a href="{{ url_for('plex_stack.index') if 'plex_stack' in url_for.__globals__['current_app'].blueprints else '#' }}"
           class="nav-module-btn {% if request.endpoint and 'plex_stack' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Plex Media Stack">
            <i data-lucide="clapperboard"></i>
            <span>Plex</span>
        </a>
        <a href="{{ url_for('media_hub.index') if 'media_hub' in url_for.__globals__['current_app'].blueprints else '#' }}"
           class="nav-module-btn {% if request.endpoint and 'media_hub' in request.endpoint %}active{% endif %}"
           onclick="showTransition(event, this.href)"
           title="Media Hub (Plex/Jellyfin)">
            <i data-lucide="tv-2"></i>
            <span>Hub</span>
        </a>
        </div>
    </div>
</nav>

<style>
/* Standalone Apps Nav — accent override */
.standalone-apps-nav { --cat-accent: #EF4444; --cat-accent-light: #DC2626; }
</style>

<script>
// Page Transition Handler
function showTransition(event, targetUrl) {
    // Don't transition if clicking current page
    if (event.currentTarget.classList.contains('active')) {
        event.preventDefault();
        return;
    }

    event.preventDefault();
    const overlay = document.getElementById('pageTransition');
    overlay.classList.add('active');

    // Navigate after animation
    setTimeout(() => {
        window.location.href = targetUrl;
    }, 600);
}

// Language menu placeholder
function showLanguageMenu() {
    // Show toast notification
    if (typeof showToast === 'function') {
        showToast('Language selection coming soon!', 'info');
    } else {
        alert('Language selection coming soon!');
    }
}

// Initialize Lucide icons in nav
document.addEventListener('DOMContentLoaded', function() {
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
});

// Hide transition on page load (for back button)
window.addEventListener('pageshow', function(event) {
    const overlay = document.getElementById('pageTransition');
    if (overlay) {
        overlay.classList.remove('active');
    }
});
</script>
