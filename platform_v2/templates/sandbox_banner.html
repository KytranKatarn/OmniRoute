<!-- Sandbox Mode Banner -->
{% if sandbox_mode %}
<div id="sandbox-banner" style="
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    background: linear-gradient(135deg, #FF6B00 0%, #FF0000 100%);
    color: white;
    padding: 12px 20px;
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 2px 10px rgba(255,0,0,0.5);
    border-bottom: 3px solid #FFD700;
    display: flex;
    justify-content: space-between;
    align-items: center;
">
    <div style="flex: 1; text-align: left;">
        <span style="font-size: 18px;">🧪</span>
    </div>

    <div style="flex: 3; text-align: center;">
        <span style="font-size: 16px; letter-spacing: 2px;">
            ⚠️ SANDBOX MODE ACTIVE ⚠️
        </span>
        <br>
        <span style="font-size: 11px; opacity: 0.9; letter-spacing: 1px;">
            Testing Environment • Schema: {{ schema_name or 'sandbox' }} • Changes Not Applied to Production
        </span>
    </div>

    <div style="flex: 1; text-align: right;">
        <a href="/sandbox/exit" style="
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.3s;
        " onmouseover="this.style.background='rgba(255,255,255,0.3)'"
           onmouseout="this.style.background='rgba(255,255,255,0.2)'">
            ← EXIT SANDBOX
        </a>
    </div>
</div>

<!-- Push content down to account for banner -->
<style>
    body {
        padding-top: 70px !important;
    }
</style>
{% endif %}
