<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — A.R.C.H.I.E.</title>
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">A.R.C.H.I.E.</div>
      <div class="login-subtitle">PASSWORD RESET</div>
    </div>
    <p style="color:#94a3b8;font-size:13px;margin-bottom:18px;text-align:center;">
      Enter your email address and we'll send you a reset link.
    </p>
    <form id="forgotForm">
      <div class="form-group">
        <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
      </div>
      <button type="submit" class="login-btn">Send Reset Link</button>
    </form>
    <div id="msg" style="margin-top:14px;font-size:13px;text-align:center;min-height:20px;"></div>
    <div style="text-align:center;margin-top:16px;">
      <a href="/login" style="color:#00d4ff;font-size:12px;text-decoration:none;">Back to login</a>
    </div>
  </div>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value;
      var msg = document.getElementById('msg');
      msg.style.color = '#94a3b8';
      msg.textContent = 'Sending...';
      fetch('/tools/account-center/forgot-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'email=' + encodeURIComponent(email)
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.success) {
          msg.style.color = '#22c55e';
          msg.textContent = d.message;
        } else {
          msg.style.color = '#f87171';
          msg.textContent = d.error || 'An error occurred.';
        }
      })
      .catch(function() {
        msg.style.color = '#f87171';
        msg.textContent = 'Network error. Please try again.';
      });
    });
  </script>
</body>
</html>
