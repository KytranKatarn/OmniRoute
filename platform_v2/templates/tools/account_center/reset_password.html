<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — A.R.C.H.I.E.</title>
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">A.R.C.H.I.E.</div>
      <div class="login-subtitle">SET NEW PASSWORD</div>
    </div>
    <form id="resetForm">
      <div class="form-group">
        <input type="password" id="pwd" class="form-input" placeholder="New password" required>
      </div>
      <div class="form-group">
        <input type="password" id="pwd2" class="form-input" placeholder="Confirm password" required>
      </div>
      <button type="submit" class="login-btn">Reset Password</button>
    </form>
    <div id="msg" style="margin-top:14px;font-size:13px;text-align:center;min-height:20px;"></div>
    <div style="text-align:center;margin-top:16px;">
      <a href="/login" style="color:#00d4ff;font-size:12px;text-decoration:none;">Back to login</a>
    </div>
  </div>
  <script>
    var token = {{ token | tojson }};
    document.getElementById('resetForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var pwd = document.getElementById('pwd').value;
      var pwd2 = document.getElementById('pwd2').value;
      var msg = document.getElementById('msg');
      if (pwd !== pwd2) {
        msg.style.color = '#f87171';
        msg.textContent = 'Passwords do not match.';
        return;
      }
      msg.style.color = '#94a3b8';
      msg.textContent = 'Updating...';
      fetch('/tools/account-center/reset-password/' + token, {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'password=' + encodeURIComponent(pwd)
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.success) {
          msg.style.color = '#22c55e';
          msg.textContent = d.message + ' Redirecting...';
          setTimeout(function() { window.location = '/login'; }, 2000);
        } else {
          msg.style.color = '#f87171';
          msg.textContent = d.error || 'An error occurred.';
        }
      })
      .catch(function() {
        msg.style.color = '#f87171';
        msg.textContent = 'Network error. Please try again.';
      });
    });
  </script>
</body>
</html>
