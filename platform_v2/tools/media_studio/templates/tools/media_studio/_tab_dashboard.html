<div id="ms-tab-dashboard" class="ms-tab-pane active">
  <div style="--frame-color: #ec4899; --frame-rgb: 0,255,255; margin-bottom: 20px;">
    <div class="lcars-frame" style="display: flex !important; align-items: stretch !important;">
      <div class="lcars-sidebar" style="display: flex !important; flex-direction: column !important; flex-shrink: 0 !important; width: 56px !important; gap: 4px !important;">
        <div style="height: 52px !important; background: #ec4899 !important; border-radius: 20px 0 0 0 !important; flex-shrink: 0 !important;"></div>
        <div style="height: 28px !important; border-radius: 0 8px 8px 0 !important; background: #ec4899 !important; flex-shrink: 0 !important;"></div>
        <div style="height: 28px !important; border-radius: 0 8px 8px 0 !important; background: #db2777 !important; opacity: 0.6 !important; flex-shrink: 0 !important;"></div>
        <div style="flex: 1 !important; background: rgba(236,72,153,0.2) !important; border-radius: 0 8px 8px 0 !important; min-height: 20px !important;"></div>
        <div style="height: 36px !important; background: #ec4899 !important; border-radius: 0 0 0 20px !important; flex-shrink: 0 !important;"></div>
      </div>
      <div style="flex: 1 !important; display: flex !important; flex-direction: column !important; margin-left: 8px !important; min-width: 0 !important;">
        <div style="height: 44px !important; background: #ec4899 !important; border-radius: 0 20px 20px 0 !important; display: flex !important; align-items: center !important; gap: 12px !important; padding: 0 16px !important; flex-shrink: 0 !important;">
          <span style="font-family: 'Antonio', sans-serif !important; font-size: 0.85rem !important; font-weight: 500 !important; letter-spacing: 2px !important; text-transform: uppercase !important; color: #010409 !important;">DASHBOARD</span>
          <div style="flex:1"></div>
          <div style="display: flex !important; align-items: center !important; gap: 4px !important;">
            <span style="width:20px; height:8px; border-radius:4px; background:rgba(0,0,0,0.3)"></span>
            <span style="width:35px; height:8px; border-radius:4px; background:rgba(0,0,0,0.2)"></span>
            <span style="width:14px; height:8px; border-radius:4px; background:rgba(0,0,0,0.3)"></span>
          </div>
        </div>
        <div style="flex: 1 !important; padding: 16px !important;">

          <div id="msDashUpdated" style="text-align:right;color:#64748b;font-size:0.62rem;margin-bottom:8px;">—</div>

          <!-- 5 stat counters (click to jump to the relevant tab) -->
          <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px;">
            <div class="ms-stat-card ms-jump" onclick="msDashboard.jumpTo('queue');" title="View generation queue">
              <div class="ms-stat-label">Generating</div>
              <div class="ms-stat-value" id="msDashStatGenerating">--</div>
              <div class="ms-stat-sub" id="msDashSubGenerating"></div>
              <i data-lucide="activity" class="ms-stat-icon"></i>
            </div>
            <div class="ms-stat-card ms-jump" onclick="msDashboard.jumpTo('portraits');" title="Review portraits">
              <div class="ms-stat-label">Needs Approval</div>
              <div class="ms-stat-value" id="msDashStatApprovals" style="color:#f59e0b;">--</div>
              <div class="ms-stat-sub" id="msDashSubApprovals"></div>
              <i data-lucide="check-circle" class="ms-stat-icon"></i>
            </div>
            <div class="ms-stat-card ms-jump" onclick="msDashboard.jumpTo('social-video');" title="View social queue">
              <div class="ms-stat-label">Social Queued</div>
              <div class="ms-stat-value" id="msDashStatSocial" style="color:#a78bfa;">--</div>
              <div class="ms-stat-sub" id="msDashSubSocial"></div>
              <i data-lucide="send" class="ms-stat-icon"></i>
            </div>
            <div class="ms-stat-card ms-jump" onclick="msDashboard.jumpTo('gallery');" title="Open gallery">
              <div class="ms-stat-label">Total Assets</div>
              <div class="ms-stat-value" id="msDashStatTotal">--</div>
              <div class="ms-stat-sub" id="msDashSubTotal"></div>
              <i data-lucide="layers" class="ms-stat-icon"></i>
            </div>
            <div class="ms-stat-card ms-jump" onclick="msDashboard.jumpTo('queue');" title="View failed jobs">
               <div class="ms-stat-label">Failed (all)</div>

              <div class="ms-stat-value" id="msDashStatFailed" style="color:#ef4444;">--</div>
              <div class="ms-stat-sub" id="msDashSubFailed"></div>
              <i data-lucide="alert-triangle" class="ms-stat-icon"></i>
            </div>
          </div>

          <!-- 3-column live ops panel -->
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;">
            <div style="background:rgba(0,229,255,0.04);border:1px solid rgba(0,229,255,0.15);border-radius:6px;padding:12px;">
              <div style="color:#ec4899;font-size:0.62rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;">&#x27F3; Generating Now</div>
              <div id="msDashGeneratingList"></div>
            </div>
            <div style="background:rgba(245,158,11,0.04);border:1px solid rgba(245,158,11,0.15);border-radius:6px;padding:12px;">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
                <div style="color:#f59e0b;font-size:0.62rem;letter-spacing:2px;text-transform:uppercase;">&#x2713; Needs Approval</div>
                <a href="#" id="msDashShowDismissed" onclick="msDashboard.toggleDismissed();return false;" style="color:#555;font-size:0.6rem;text-decoration:none;cursor:pointer;">Show dismissed</a>
              </div>
              <div id="msDashApprovalList"></div>
            </div>
            <div style="background:rgba(167,139,250,0.04);border:1px solid rgba(167,139,250,0.15);border-radius:6px;padding:12px;">
              <div style="color:#a78bfa;font-size:0.62rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;">&#x1F4E4; Social Queue</div>
              <div id="msDashSocialList"></div>
              <div style="margin-top:8px;">
                <a href="#social-video" onclick="switchMsTab('social-video');return false;" style="color:#a78bfa;font-size:0.62rem;text-decoration:none;">+ Create new &#x2192;</a>
              </div>
            </div>
          </div>

          <!-- Recent completions -->
          <div class="ms-section-header" style="margin-bottom:10px;">
            <div class="ms-section-cap"></div>
            <span class="ms-section-title">Recently Completed</span>
          </div>
          <div id="msDashRecentGrid" style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;"></div>

        </div>
        <div style="height: 6px !important; background: #ec4899 !important; border-radius: 0 0 20px 0 !important; flex-shrink: 0 !important;"></div>
      </div>
    </div>
  </div>
</div>
