<div id="ms-tab-gallery" class="ms-tab-pane">
  <div style="--frame-color: #ec4899; --frame-rgb: 34,197,94; margin-bottom: 20px;">
    <div class="lcars-frame" style="display:flex !important;align-items:stretch !important;">
      <div class="lcars-sidebar" style="display:flex !important;flex-direction:column !important;flex-shrink:0 !important;width:56px !important;gap:4px !important;">
        <div style="height:52px !important;background:#ec4899 !important;border-radius:20px 0 0 0 !important;flex-shrink:0 !important;"></div>
        <div style="height:28px !important;border-radius:0 8px 8px 0 !important;background:#ec4899 !important;flex-shrink:0 !important;"></div>
        <div style="height:28px !important;border-radius:0 8px 8px 0 !important;background:#db2777 !important;opacity:0.6 !important;flex-shrink:0 !important;"></div>
        <div style="flex:1 !important;background:rgba(236,72,153,0.2) !important;border-radius:0 8px 8px 0 !important;min-height:20px !important;"></div>
        <div style="height:36px !important;background:#ec4899 !important;border-radius:0 0 0 20px !important;flex-shrink:0 !important;"></div>
      </div>
      <div style="flex:1 !important;display:flex !important;flex-direction:column !important;margin-left:8px !important;min-width:0 !important;">
        <div style="height:44px !important;background:#ec4899 !important;border-radius:0 20px 20px 0 !important;display:flex !important;align-items:center !important;gap:12px !important;padding:0 16px !important;flex-shrink:0 !important;">
          <span style="font-family:'Antonio',sans-serif !important;font-size:0.85rem !important;font-weight:500 !important;letter-spacing:2px !important;text-transform:uppercase !important;color:#010409 !important;">GALLERY</span>
        </div>
        <div style="flex:1 !important;display:flex !important;min-height:0 !important;">
          <!-- Subject sidebar -->
          <div style="width:200px;flex-shrink:0;border-right:1px solid rgba(236,72,153,0.15);overflow-y:auto;padding:14px 10px;">
            <div id="msGallerySidebarSubjects"></div>
          </div>
          <!-- Main content -->
          <div style="flex:1;padding:16px;overflow-y:auto;min-width:0;">
            <div id="msGallerySubjectHeader"></div>
            <!-- Asset type filter tabs -->
            <div style="display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid rgba(236,72,153,0.15);padding-bottom:10px;flex-wrap:wrap;">
              <button class="ms-gallery-type-tab active" data-filter="all" onclick="msGallery.setFilter('all')">All</button>
              <button class="ms-gallery-type-tab" data-filter="portrait" onclick="msGallery.setFilter('portrait')">Portraits</button>
              <button class="ms-gallery-type-tab" data-filter="lifestyle" onclick="msGallery.setFilter('lifestyle')">Lifestyle</button>
              <button class="ms-gallery-type-tab" data-filter="social" onclick="msGallery.setFilter('social')">Social</button>
              <select id="msGallerySortSelect" class="ms-gallery-sort"
                      style="margin-left:auto;background:#0d1117;color:#c9d1d9;border:1px solid rgba(236,72,153,0.3);border-radius:6px;padding:4px 8px;font-size:0.75rem;cursor:pointer;"
                      onchange="msGallery.setSort(this.value)">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="favorites">Favorites first</option>
                <option value="cost">Highest cost</option>
              </select>
            </div>
            <!-- Publish approved portraits to the public sites -->
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
              <button id="msPublishSitesBtn" onclick="msGallery.publishPortraits()"
                      title="Queue a deploy of the public sites so approved portraits (and the director data) go live. Runs in the background; the site is also published automatically every 15 minutes."
                      style="background:#ec4899;color:#010409;border:none;border-radius:4px;padding:7px 16px;font-size:0.72rem;font-family:Antonio,sans-serif;letter-spacing:1.5px;cursor:pointer;font-weight:600;">PUBLISH PORTRAITS</button>
              <span id="msPublishSitesStatus" style="font-size:0.68rem;color:#9ca3af;font-family:'Share Tech Mono',monospace;">loading publish status…</span>
            </div>
            <!-- Image grid -->
            <div id="msGallerySubjectGrid" class="ms-gallery-subject-grid"></div>
            <!-- Brand theme library — shown when Brand subject selected -->
            <div id="msGalleryBrandThemes" style="display:none;padding-top:4px;">
              <div style="color:#ec4899;font-size:0.58rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;">CONTENT THEMES</div>
              <div id="msGalleryThemeCards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;"></div>
            </div>
          </div>
        </div>
        <div style="height:6px !important;background:#ec4899 !important;border-radius:0 0 20px 0 !important;flex-shrink:0 !important;"></div>
      </div>
    </div>
  </div>
</div>
