<div id="ms-tab-gallery" class="ms-tab-pane">
  <div style="--frame-color: #22c55e; --frame-rgb: 34,197,94; margin-bottom: 20px;">
    <div class="lcars-frame" style="display:flex !important;align-items:stretch !important;">
      <div class="lcars-sidebar" style="display:flex !important;flex-direction:column !important;flex-shrink:0 !important;width:56px !important;gap:4px !important;">
        <div style="height:52px !important;background:#22c55e !important;border-radius:20px 0 0 0 !important;flex-shrink:0 !important;"></div>
        <div style="height:28px !important;border-radius:0 8px 8px 0 !important;background:#22c55e !important;flex-shrink:0 !important;"></div>
        <div style="height:28px !important;border-radius:0 8px 8px 0 !important;background:#16a34a !important;opacity:0.6 !important;flex-shrink:0 !important;"></div>
        <div style="flex:1 !important;background:rgba(34,197,94,0.2) !important;border-radius:0 8px 8px 0 !important;min-height:20px !important;"></div>
        <div style="height:36px !important;background:#22c55e !important;border-radius:0 0 0 20px !important;flex-shrink:0 !important;"></div>
      </div>
      <div style="flex:1 !important;display:flex !important;flex-direction:column !important;margin-left:8px !important;min-width:0 !important;">
        <div style="height:44px !important;background:#22c55e !important;border-radius:0 20px 20px 0 !important;display:flex !important;align-items:center !important;gap:12px !important;padding:0 16px !important;flex-shrink:0 !important;">
          <span style="font-family:'Antonio',sans-serif !important;font-size:0.85rem !important;font-weight:500 !important;letter-spacing:2px !important;text-transform:uppercase !important;color:#010409 !important;">GALLERY</span>
        </div>
        <div style="flex:1 !important;display:flex !important;min-height:0 !important;">
          <!-- Subject sidebar -->
          <div style="width:200px;flex-shrink:0;border-right:1px solid rgba(34,197,94,0.15);overflow-y:auto;padding:14px 10px;">
            <div id="msGallerySidebarSubjects"></div>
          </div>
          <!-- Main content -->
          <div style="flex:1;padding:16px;overflow-y:auto;min-width:0;">
            <div id="msGallerySubjectHeader"></div>
            <!-- Asset type filter tabs -->
            <div style="display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid rgba(34,197,94,0.15);padding-bottom:10px;flex-wrap:wrap;">
              <button class="ms-gallery-type-tab active" data-filter="all" onclick="msGallery.setFilter('all')">All</button>
              <button class="ms-gallery-type-tab" data-filter="headshot" onclick="msGallery.setFilter('headshot')">Headshots</button>
              <button class="ms-gallery-type-tab" data-filter="lifestyle" onclick="msGallery.setFilter('lifestyle')">Lifestyle</button>
              <button class="ms-gallery-type-tab" data-filter="social" onclick="msGallery.setFilter('social')">Social</button>
              <button class="ms-gallery-type-tab" data-filter="portrait" onclick="msGallery.setFilter('portrait')">Portraits</button>
            </div>
            <!-- Image grid -->
            <div id="msGallerySubjectGrid" class="ms-gallery-subject-grid"></div>
            <!-- Brand theme library — shown when Brand subject selected -->
            <div id="msGalleryBrandThemes" style="display:none;padding-top:4px;">
              <div style="color:#22c55e;font-size:0.58rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;">CONTENT THEMES</div>
              <div id="msGalleryThemeCards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;"></div>
            </div>
          </div>
        </div>
        <div style="height:6px !important;background:#22c55e !important;border-radius:0 0 20px 0 !important;flex-shrink:0 !important;"></div>
      </div>
    </div>
  </div>
</div>
