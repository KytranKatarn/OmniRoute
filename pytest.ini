[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -m "not browser": tests/human_agents/ is a LIVE browser E2E suite (Playwright, real
# logins against ARCHIE_BASE_URL). Collected here only because it sits under testpaths.
# It hung `pytest tests/` INDEFINITELY — measured 2026-08-24: 21m43s, ~62%, a Playwright
# driver child alive the whole time, never finishing (#5990). pytest PRINTS the deselected
# count, so this is an announced exclusion, not a silent truncation.
# Run them deliberately:  pytest tests/human_agents -m browser
addopts = -v --tb=short -m "not browser"
markers =
    browser: drives a REAL browser via Playwright against a live platform — slow, and
        excluded from the default run. Opt in with -m browser.
    unit: fast unit tests with no external dependencies
    integration: tests requiring a live database or external service
    slow: tests taking more than 5 seconds
    db: tests that connect to a real database
    llm: tests that invoke a real LLM endpoint
