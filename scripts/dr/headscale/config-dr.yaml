# Headscale DR config — runs on boston-2 during hub outage
# Identical to hub config except DNS nameserver uses boston-2 (100.64.0.10)
# instead of hub LAN (192.168.1.200) which is unreachable during DR.
# Keys (noise_private.key, derp_server_private.key) are copied from hub backup
# so existing nodes trust this standby without re-enrollment.

server_url: https://mesh.kytranempowerment.com
listen_addr: 0.0.0.0:8095
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 900
    region_code: archie
    region_name: ARCHIE Hub (DR)
    private_key_path: /var/lib/headscale/derp_server_private.key
    stun_listen_addr: "0.0.0.0:3478"
    automatically_add_embedded_derp_region: true
  urls: []
  paths: []
  update_frequency: 24h

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

dns:
  magic_dns: true
  base_domain: mesh.archie
  nameservers:
    global:
      - 100.64.0.10   # boston-2 (hub LAN 192.168.1.200 unavailable in DR)
      - 1.1.1.1
  search_domains: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

log:
  format: text
  level: info

ephemeral_node_inactivity_timeout: 5m
node_update_check_interval: 10s

policy:
  mode: file
  path: ""
