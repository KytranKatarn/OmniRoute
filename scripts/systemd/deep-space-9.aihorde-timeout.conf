# #7424 — AI Horde needs a longer first-byte budget.
#
# WHY THIS EXISTS
# ---------------
# AI Horde is a shared volunteer GPU queue: requests sit until a worker picks
# them up, so latency is MINUTES, not seconds. The gateway's own registry entry
# already says so — `timeoutMs: 120_000` on the aihorde provider, with the
# comment "Requests sit in a shared volunteer queue, so latency is minutes".
#
# But a SECOND, lower layer was silently overriding that declared intent: the
# direct-response start timeout in open-sse/utils/directResponseStartTimeout.ts
# caps the wait for the upstream's first byte at 30s by default, and it is a
# FLOOR that only goes up for local targets (300s) or high-reasoning bodies.
# Measured 2026-10-22: the aihorde executor's very first tool-bearing request
# failed with
#
#   Direct response did not start within 30000ms — retrying on a fresh socket
#
# i.e. the gateway gave up on a provider it had itself declared as slow.
#
# 150s makes the floor sit just above aihorde's own 120s timeout, so the
# provider's declared intent is what actually governs. The retry ceiling is
# already 600s and the local-target floor is already 300s, so this is inside
# the range the gateway already uses.
#
# THE TRADE-OFF, STATED PLAINLY: this raises the first-byte budget for every
# provider, not just AI Horde — so a hung upstream now holds a request longer
# before the gateway fails over. That is a real cost, paid deliberately: the
# gateway's whole free tier is a queue of slow volunteer upstreams, and a
# 30s first-byte floor fails over on providers that were about to answer.
#
# Install to /etc/systemd/system/deep-space-9.service.d/91-aihorde-timeout.conf
# then: systemctl daemon-reload && systemctl restart deep-space-9.service
#
# The env var is read per request, so this can also be set in the panel's
# environment without a restart.

[Service]
Environment="OMNIROUTE_DIRECT_HEADERS_TIMEOUT_MS=150000"
