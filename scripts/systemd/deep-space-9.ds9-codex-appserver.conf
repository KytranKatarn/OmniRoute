# DS9 gateway adapter settings for the Codex app-server transport.
#
# Installed as a systemd DROP-IN, not by editing deep-space-9.service in place:
#   sudo install -m 644 scripts/systemd/deep-space-9.ds9-codex-appserver.conf \
#        /etc/systemd/system/deep-space-9.service.d/ds9-codex-appserver.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart deep-space-9.service
#
# ⚠️ RESTARTING deep-space-9 INTERRUPTS GATEWAY USERS. Schedule it.
# Recreate ONLY this service. Do not touch other platform services.
#
# The env var names are not invented — they are read by the installed gateway's
# own resolver, open-sse/executors/codex/appServerConfig.ts:
#   OMNIROUTE_CODEX_APPSERVER_WS            -> resolveAppServerConfig(): url
#   OMNIROUTE_CODEX_APPSERVER_WS_TOKEN_FILE -> resolveTokenWithSource(): token
#   OMNIROUTE_CODEX_APPSERVER_CWD           -> resolveAppServerConfig(): cwd
#   OMNIROUTE_CODEX_APPSERVER_SANDBOX       -> resolveThreadStartPolicy(): sandbox
#
# CREDENTIAL/URL BINDING (hardening after the gateway's #11205 security review):
# an env-sourced capability token is only ever paired with an env-sourced URL,
# or an operator-local host. BOTH of ours are env-sourced, so the pair is
# accepted. Do NOT later move the URL into a connection's providerSpecificData
# while the token stays env-sourced — the resolver then refuses the pair
# (returns null) and the provider silently stops being an app-server.
#
# The token arrives as a systemd CREDENTIAL (same file the sidecar reads), not
# as an environment value — so it is not visible in `systemctl show` output and
# not in the unit file.
#
# ⚠️ A drop-in is only honoured INSIDE a section header. Without the
# [Service] below, systemd parses the whole file as belonging to no section,
# silently ignores every directive in it, and the gateway starts with NO
# adapter configuration — which looks exactly like "the app-server is broken".
[Service]
LoadCredential=ws_token:/etc/ds9-codex/ws.token

Environment=OMNIROUTE_CODEX_APPSERVER_WS=ws://127.0.0.1:1456
Environment=OMNIROUTE_CODEX_APPSERVER_WS_TOKEN_FILE=/run/credentials/deep-space-9.service/ws_token
Environment=OMNIROUTE_CODEX_APPSERVER_CWD=/srv/ds9-codex/work
# Start with the upstream sandbox read-only: tool execution belongs to the
# OUTER Codex CLI, not to the upstream. The gateway's own adapter defaults to
# approvalPolicy "never" (non-interactive) and sandbox "workspace-write"; we
# pin the sandbox tighter. Widening either is a deliberate, separate decision.
Environment=OMNIROUTE_CODEX_APPSERVER_SANDBOX=read-only
