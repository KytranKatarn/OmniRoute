# #7397 — free-tier exploration rate for the Deep Space 9 gateway.
#
# Drop-in for deep-space-9.service. Install to
#   /etc/systemd/system/deep-space-9.service.d/90-free-exploration.conf
# then: systemctl daemon-reload && systemctl restart deep-space-9.service
#
# WHY THIS EXISTS
# The free tier's pool members are new upstreams with no quality history, and
# the quality signal is what decides the top tier. That is a cold-start trap:
# the one model that has been serving accumulates quality, wins the top tier,
# and therefore keeps serving — while every other model stays cold and can
# never overtake it. Exploration is the mechanism that breaks it: it samples the
# pool uniformly, so cold candidates get tried, accumulate quality, and become
# competitive.
#
# WHY 10% AND NOT MORE
# Measured on the live DS9 over 20 free-tier requests each:
#   25%  -> 6 distinct models, latency 4-26s, with one 138s outlier (a 120B
#           model in the pool; the Cloudflare Playground executor timed out and
#           its retry succeeded, so the client saw one slow 200).
#   10%  -> 5 distinct models, latency 4-13s, no outlier.
# 10% keeps the pool warm - roughly 1.4 calls a day per model at the probe's
# five-minute cadence - while keeping the latency tail tight. The free tier is
# the fallback for the app-server path, so its latency matters.
#
# 0 restores the code's 5% default. Higher values warm the pool faster at the
# cost of a longer tail.
[Service]
Environment="OMNIROUTE_AUTO_FREE_EXPLORATION_RATE=0.10"
