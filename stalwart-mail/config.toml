[server]
hostname = "mail.kytranempowerment.com"

[server.listener.smtp]
bind = "[::]:25"
protocol = "smtp"

[server.listener.submission]
bind = "[::]:587"
protocol = "smtp"

[server.listener.submissions]
bind = "[::]:465"
protocol = "smtp"
tls.implicit = true

[server.listener.imap]
bind = "[::]:143"
protocol = "imap"

[server.listener.imaptls]
bind = "[::]:993"
protocol = "imap"
tls.implicit = true

[server.listener.pop3]
bind = "[::]:110"
protocol = "pop3"

[server.listener.pop3s]
bind = "[::]:995"
protocol = "pop3"
tls.implicit = true

[server.listener.sieve]
bind = "[::]:4190"
protocol = "managesieve"

[server.listener.https]
protocol = "http"
bind = "[::]:443"
tls.implicit = true

[server.listener.http]
protocol = "http"
bind = "[::]:8080"

[storage]
data = "rocksdb"
fts = "rocksdb"
blob = "rocksdb"
lookup = "rocksdb"
directory = "internal"

[store.rocksdb]
type = "rocksdb"
path = "/opt/stalwart-mail/data"
compression = "lz4"

[directory.internal]
type = "internal"
store = "rocksdb"

[tracer.log]
type = "log"
level = "info"
path = "/opt/stalwart-mail/logs"
prefix = "stalwart.log"
rotate = "daily"
ansi = false
enable = true

[certificate.default]
cert = "%{file:/opt/stalwart-mail/certs/fullchain.pem}%"
private-key = "%{file:/opt/stalwart-mail/certs/privkey.pem}%"

[authentication.fallback-admin]
user = "admin"
secret = "%{env:STALWART_ADMIN_PASSWORD}%"

[signature.dkim.default]
algorithm = "rsa-sha256"
domain = "kytranempowerment.com"
selector = "stalwart"
headers = ["From", "To", "Date", "Subject", "Message-ID"]
set-body-length = false
report = true
private-key = "%{file:/opt/stalwart-mail/dkim/private.pem}%"

[auth.dkim]
sign = [ { if = "is_local_domain('*', sender_domain)", then = "['default']" },
         { else = false } ]

[session.auth]
mechanisms = [ { if = "listener != 'smtp'", then = "['plain', 'login']" },
               { else = false } ]

# Outbound routing — relay all external mail through US outpost VPS
[queue.strategy]
route = [ { if = "is_local_domain('', rcpt_domain)", then = "'local'" },
          { else = "'outpost-us'" } ]

[queue.route."outpost-us"]
type = "relay"
address = "100.64.0.1"
port = 25
protocol = "smtp"

[queue.route."outpost-us".tls]
implicit = false
allow-invalid-certs = true

[queue.route."local"]
type = "local"
