services:
  stalwart-mail:
    image: stalwartlabs/mail-server:v0.11.8
    container_name: stalwart_mail
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "993:993"
      - "4190:4190"
      - "8443:443"
    volumes:
      - stalwart-data:/opt/stalwart-mail
      - ./config.toml:/opt/stalwart-mail/etc/config.toml:ro
      - ./dkim:/opt/stalwart-mail/dkim:ro
      - ./certs:/opt/stalwart-mail/certs:ro
    extra_hosts:
      - "relay.kytranempowerment.com:100.64.0.1"
    # Mail servers do constant external MX + SPF + DKIM DNS lookups — a
    # SERVFAIL from the Tailscale-MagicDNS trap would kill delivery silently
    # (bounces on the outgoing side, rejected inbound mail). Pin AdGuard
    # first, Cloudflare fallback. See PR #258 for the trap pattern.
    dns:
      - 192.168.1.200
      - 1.1.1.1
    environment:
      - TZ=America/Toronto
      - STALWART_ADMIN_PASSWORD=${STALWART_ADMIN_PASSWORD:-KytranMail2026!}
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    networks:
      - stalwart_default
      - archie_network

volumes:
  stalwart-data:

networks:
  stalwart_default:
    driver: bridge
  archie_network:
    external: true
    name: archie_network
