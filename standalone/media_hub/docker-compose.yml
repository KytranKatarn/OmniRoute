# Media Hub standalone stack.
# Run from repo root: docker compose -f standalone/media_hub/docker-compose.yml up -d
#
# Ports: 8105 hub (host) — picked clear of existing platform ports per
# .claude/rules/operational-state.md.

services:
  mediahub_db:
    image: postgres:16.4-alpine
    container_name: mediahub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediahub
      POSTGRES_PASSWORD: ${MEDIA_HUB_DB_PASSWORD:?set in .env}
      POSTGRES_DB: mediahub
    volumes:
      - mediahub_pgdata:/var/lib/postgresql/data
      # One-shot schema bootstrap on first startup (postgres:16 runs *.sql in this dir).
      - ../../platform_v2/tools/media_hub/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # Compliance hardening per .claude/rules/compliance-standards.md
    cap_drop: ["ALL"]
    cap_add:  ["CHOWN", "SETGID", "SETUID", "DAC_OVERRIDE", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediahub -d mediahub"]
      interval: 10s
      timeout: 5s
      retries: 6

  mediahub_app:
    build:
      context: ../..
      dockerfile: standalone/media_hub/Dockerfile
    image: mediahub:standalone
    container_name: mediahub_app
    restart: unless-stopped
    depends_on:
      mediahub_db:
        condition: service_healthy
    # Bypass public DNS / NAT hairpin for hub-local media subdomains.
    # Container probes to plex.kytranempowerment.com / jellyfin.… resolve
    # directly to the LAN IP — no round-trip through AdGuard or Hostinger.
    extra_hosts:
      - "plex.kytranempowerment.com:192.168.1.200"
      - "jellyfin.kytranempowerment.com:192.168.1.200"
    environment:
      DATABASE_URL: postgresql://mediahub:${MEDIA_HUB_DB_PASSWORD}@mediahub_db:5432/mediahub
      MEDIA_HUB_SECRET_KEY: ${MEDIA_HUB_SECRET_KEY:?set in .env}
      MEDIA_HUB_ENCRYPTION_KEY: ${MEDIA_HUB_ENCRYPTION_KEY:?set in .env}
      MEDIA_HUB_ADMIN_PASSWORD: ${MEDIA_HUB_ADMIN_PASSWORD:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Kytran SSO — dual-mode auth (SSO primary, local password fallback for family)
      # Two client rows: public subdomain vs LAN IP. app.py swaps per request.host
      # because browser session cookies don't cross host boundaries (state param
      # verification fails otherwise).
      KYTRAN_CLIENT_ID: ${KYTRAN_CLIENT_ID:-media-hub-viewer}
      KYTRAN_CLIENT_SECRET: ${KYTRAN_CLIENT_SECRET:-}
      KYTRAN_CLIENT_ID_LAN: ${KYTRAN_CLIENT_ID_LAN:-media-hub-viewer-lan}
      KYTRAN_CLIENT_SECRET_LAN: ${KYTRAN_CLIENT_SECRET_LAN:-}
      # Public hub URL — must be reachable by the user's browser for the
      # OAuth redirect AND by this container for server-to-server token
      # exchange (container DNS override above handles the latter). ADR-001
      # (2026-04-08) split internal/external URLs in the full SDK; this copy
      # uses a single URL until #2064 SDK consolidation lands.
      KYTRAN_AUTH_URL: ${KYTRAN_AUTH_URL:-https://platform.kytranempowerment.com}
      KYTRAN_REDIRECT_URI: ${KYTRAN_REDIRECT_URI:-https://media.kytranempowerment.com/auth/kytran/callback}
      KYTRAN_REDIRECT_URI_LAN: ${KYTRAN_REDIRECT_URI_LAN:-http://192.168.1.200:8105/auth/kytran/callback}
      # Family-access: don't block on product entitlement; policy lives in on_login.
      KYTRAN_AUTH_ENFORCE_ENTITLEMENT: "false"
    # Container DNS override — host DNS is Tailscale-owned which SERVFAILs on
    # external hostnames inside Docker (discovered 2026-04-21 via Prowlarr).
    # Use AdGuard first, Cloudflare fallback.
    dns:
      - 192.168.1.200
      - 1.1.1.1
    ports:
      - "8105:8105"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0

volumes:
  mediahub_pgdata:
