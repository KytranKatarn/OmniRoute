<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} — Media Hub</title>
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='img/kytran-logo.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon-180.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tv-mode.css') }}">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0a0f1c; --surface: #0f172a; --border: #1e293b;
            --accent: #3b82f6; --text: #e2e8f0; --muted: #94a3b8;
            --err: #ef4444; --warn: #f59e0b;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh;
               background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               line-height: 1.55; display: grid; place-items: center; padding: 2rem 1rem; }
        .card { background: var(--surface); border: 1px solid var(--border);
                border-radius: 16px; padding: 2.5rem 2.75rem; max-width: 520px; width: 100%;
                box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .code { font-family: ui-monospace, Menlo, monospace;
                font-size: 0.85rem; letter-spacing: 0.15em;
                color: {% if code >= 500 %}var(--err){% elif code >= 400 %}var(--warn){% else %}var(--accent){% endif %};
                margin-bottom: 1rem; }
        h1 { margin: 0 0 0.5rem; font-size: 1.75rem; letter-spacing: -0.01em; }
        p.message { color: var(--text); margin: 0 0 1rem; }
        p.fix { color: var(--muted); font-size: 0.95rem; margin: 0 0 1.75rem;
                border-left: 3px solid var(--accent); padding: 0.6rem 0.9rem;
                background: rgba(59,130,246,0.08); border-radius: 6px; }
        .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        a.btn { display: inline-block; padding: 0.7rem 1.3rem; border-radius: 10px;
                font-weight: 600; text-decoration: none; font-size: 0.95rem; }
        a.btn.primary { background: var(--accent); color: #0a0f1c; }
        a.btn.primary:hover { background: #60a5fa; }
        a.btn.ghost { color: var(--text); border: 1px solid var(--border); }
        a.btn.ghost:hover { border-color: var(--accent); }
        img.mark { width: 48px; height: 48px; margin-bottom: 1.5rem; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <img src="{{ url_for('static', filename='img/kytran-logo.png') }}" alt="Kytran" class="mark">
        <div class="code">ERROR {{ code }}</div>
        <h1>{{ title }}</h1>
        <p class="message">{{ message }}</p>
        {% if fix %}<p class="fix">{{ fix }}</p>{% endif %}
        <div class="actions">
            <a class="btn primary" href="{{ url_for('root') }}">Home</a>
            {% if current_user.is_authenticated and current_user.is_admin %}
            <a class="btn ghost" href="/maven/troubleshoot">Troubleshoot</a>
            {% endif %}
            <a class="btn ghost" href="javascript:history.back()">Back</a>
        </div>
    </div>
</body>
</html>
