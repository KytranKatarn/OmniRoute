<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Hub — Sign In</title>
    <link rel="stylesheet" href="{{ url_for('media_hub.static', filename='standalone/lcars-frames.css') }}">
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            font-family: 'Antonio', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0f0ff;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        .login-card {
            background: linear-gradient(180deg, #0f1522 0%, #0a0a0f 100%);
            border: 2px solid #0ea5e9;
            border-radius: 24px;
            padding: 2.5rem 3rem;
            max-width: 380px;
            width: calc(100% - 2rem);
            box-shadow: 0 0 40px rgba(14, 165, 233, 0.2);
        }
        h1 {
            margin: 0 0 1.5rem;
            font-size: 1.4rem;
            letter-spacing: 0.1em;
            color: #0ea5e9;
            text-transform: uppercase;
        }
        label { display: block; margin: 1rem 0 0.25rem; font-size: 0.85rem; color: #94a3b8; }
        input[type="text"], input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 0.6rem 0.8rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #e0f0ff;
            font-family: inherit;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #0ea5e9; }
        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.75rem;
            background: #0ea5e9;
            color: #0a0a0f;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #0284c7; }
        .error {
            margin-top: 1rem;
            padding: 0.5rem 0.8rem;
            background: rgba(220, 38, 38, 0.1);
            border-left: 3px solid #dc2626;
            color: #fca5a5;
            font-size: 0.9rem;
        }
        .sso-note {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #1e293b;
            font-size: 0.8rem;
            color: #64748b;
        }
        .sso-note a { color: #0ea5e9; text-decoration: none; }
    </style>
</head>
<body>
    <form class="login-card" method="POST" action="{{ url_for('auth.login') }}">
        <h1>Media Hub</h1>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit">Sign In</button>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <div class="sso-note">
            Kytran SSO — <a href="{{ url_for('media_hub.sso_stub') }}">status</a>
        </div>
    </form>
</body>
</html>
