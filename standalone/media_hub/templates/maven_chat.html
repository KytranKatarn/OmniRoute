{% extends "maven_base.html" %}
{% block title %}Chat{% endblock %}
{% block content %}
<style>
    .chat-wrap {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 220px);
        min-height: 400px;
    }
    #chat-log {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.5rem 0 1rem;
        scroll-behavior: smooth;
    }
    .chat-input-row {
        display: flex;
        gap: 0.5rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--archie-border-subtle);
    }
    #chat-input {
        flex: 1;
        padding: 0.75rem 1rem;
        background: var(--archie-bg-elevated);
        color: var(--archie-text-primary);
        border: 1px solid var(--archie-border-subtle);
        border-radius: 10px;
        font-family: inherit;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.15s;
    }
    #chat-input:focus { border-color: var(--archie-blue, #3b82f6); }
    #chat-input::placeholder { color: var(--archie-text-muted); }

    .msg {
        max-width: 82%;
        padding: 0.7rem 1rem;
        border-radius: 14px;
        white-space: pre-wrap;
        word-wrap: break-word;
        line-height: 1.55;
        font-size: 0.95rem;
    }
    .msg.user {
        align-self: flex-end;
        background: var(--archie-blue, #3b82f6);
        color: #fff;
        border-bottom-right-radius: 4px;
    }
    .msg.maven {
        align-self: flex-start;
        background: var(--archie-bg-elevated);
        border: 1px solid var(--archie-border-subtle);
        color: var(--archie-text-primary);
        border-bottom-left-radius: 4px;
    }
    .msg.error {
        align-self: flex-start;
        background: rgba(239,68,68,0.1);
        border-left: 3px solid #ef4444;
        color: #fca5a5;
    }
    .msg.pending {
        align-self: flex-start;
        color: var(--archie-text-muted);
        font-style: italic;
        background: transparent;
        padding: 0.4rem 0;
    }
    .msg .meta {
        display: block;
        margin-top: 0.35rem;
        font-size: 0.7rem;
        color: var(--archie-text-muted);
    }
    .chat-hint { color: var(--archie-text-muted); font-size: 0.8rem; margin-top: 0.5rem; }
    code { background: var(--archie-bg-secondary); padding: 2px 6px; border-radius: 4px;
           font-size: 0.85em; color: var(--archie-gold, #f59e0b); }
</style>

<h1>Chat with M.A.V.E.N.</h1>
<p class="byline">Ask about your library, get recommendations, troubleshoot downloads.</p>

<div class="chat-wrap">
    <div id="chat-log"></div>

    <form id="chat-form" class="chat-input-row">
        <input type="text" id="chat-input" autofocus autocomplete="off"
               placeholder="e.g. What horror movies do we have?">
        <button type="submit" class="run-btn" id="chat-send">Send</button>
    </form>
    <p class="chat-hint">Running on <code>{{ default_model }}</code> · First response may take a few seconds (cold load)</p>
</div>

<script>
(function () {
    const log  = document.getElementById("chat-log");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("chat-input");
    const send  = document.getElementById("chat-send");
    const history = [];

    function addMsg(role, text, cls, meta) {
        const el = document.createElement("div");
        el.className = "msg " + (cls || role);
        el.textContent = text;
        if (meta) {
            const m = document.createElement("span");
            m.className = "meta";
            m.textContent = meta;
            el.appendChild(m);
        }
        log.appendChild(el);
        el.scrollIntoView({behavior: "smooth", block: "end"});
        return el;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMsg("user", text);
        history.push({role: "user", content: text});
        input.value = "";
        send.disabled = true;

        const pending = addMsg("maven", "M.A.V.E.N. is thinking…", "pending");

        try {
            const r = await fetch("/maven/api/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({messages: history}),
            });
            const j = await r.json();
            pending.remove();
            if (j.error) {
                addMsg("maven", j.error, "error");
            } else {
                const meta = j.model + (j.total_duration_ms
                    ? ` · ${(j.total_duration_ms / 1000).toFixed(1)}s` : "");
                addMsg("maven", j.reply, "maven", meta);
                history.push({role: "assistant", content: j.reply});
            }
        } catch (err) {
            pending.remove();
            addMsg("maven", "Network error: " + err.message, "error");
        } finally {
            send.disabled = false;
            input.focus();
        }
    });
})();
</script>
{% endblock %}
