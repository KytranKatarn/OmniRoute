# Tdarr — video health + transcode-for-space, M.A.V.E.N.-orchestrated (project #385 Phase 3).
#
# The all-in-one image runs the Tdarr SERVER + a built-in (internal) CPU NODE, so this one
# container gives the hub a working Server + a CPU transcode node. GPU nodes on the Starships
# (Phase B) are separate `tdarr_node` containers that connect to serverIP 100.64.0.4:8266.
#
# Cache + config live on /mnt/data2 (228 GB free) — NEVER the 87 GB-free media volume.
# The hub M4000 is Maxwell (H.264-only NVENC, no HEVC) + Ollama-saturated, so this node is
# CPU-only on purpose (no --gpus); HEVC space-optimizing runs on the Starship GPU nodes.
#
# Run:  cd standalone/tdarr && docker compose up -d
services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr@sha256:6153e00470667b5ed4f6f6f1bfaa016432efa4c20b1919de229d9b7265bff70b  # 2.82.02, digest-pinned (no :latest)
    container_name: tdarr
    restart: unless-stopped
    environment:
      TZ: America/Toronto
      PUID: "1000"
      PGID: "1000"
      UMASK_SET: "002"
      serverIP: 0.0.0.0
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "true"       # hub CPU node built-in
      inContainer: "true"
      nodeName: tdarr-hub-cpu
    ports:
      - "8265:8265"              # web UI + REST API
      - "8266:8266"              # server (Starship nodes connect here)
    volumes:
      - /mnt/data2/tdarr/server:/app/server
      - /mnt/data2/tdarr/configs:/app/configs
      - /mnt/data2/tdarr/logs:/app/logs
      # Repointed off the failing /dev/sdb 2026-09-22. No single healthy parent holds
      # the whole tree, so each child is bound explicitly.
      - /mnt/data2/plex/tv:/media/tv:rw
      - /mnt/data2/plex/music:/media/music:rw
      - /mnt/data2/plex/photos:/media/photos:rw
      # ⚠️ BEHAVIOUR DELIBERATELY UNCHANGED — /mnt/data2/plex/movies is EMPTY, so tdarr
      #    sees ZERO movies, exactly as it did before this change (verified in-container).
      #    The previous comment claimed the symlink pointed at /mnt/data2/plex/movies; it
      #    actually points at /mnt/fast/movies (47 titles, 205 GB), and binding the empty
      #    data2 dir over it SHADOWED the real library rather than exposing it. So tdarr
      #    has never transcoded a movie, despite the stated intent.
      #    The movie library MOVED to /mnt/data2/plex/movies on 2026-09-22, so binding
      #    that path would now expose all 47 titles and start a mass transcode. To keep
      #    tdarr's behaviour BYTE-IDENTICAL to what it has always actually done (0 movies),
      #    /media/movies points at a dedicated empty directory instead.
      #    ENABLING MOVIE TRANSCODING IS AN OWNER DECISION: change this one line to
      #    `- /mnt/data2/plex/movies:/media/movies:rw` and recreate the container.
      - /mnt/data2/tdarr/movies_disabled:/media/movies:rw
      - /mnt/data2/tdarr/transcode_cache:/temp       # roomy scratch, OFF the media volume
    mem_limit: 6g
    cpus: 4.0                     # cap so a CPU transcode never starves the platform
    security_opt: ["no-new-privileges:true"]
    networks:
      default:
      tdarr_net:                  # shared with mediahub_app for M.A.V.E.N. → Tdarr API (Phase C)

networks:
  default:
  tdarr_net:
    external: true
