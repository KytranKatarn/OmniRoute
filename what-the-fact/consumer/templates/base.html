<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}What The Fact{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="wtf-nav">
    <div class="wtf-nav-brand">
      <span class="wtf-wordmark">WHAT&middot;THE&middot;FACT</span>
      <span class="wtf-subbrand">CANADIAN AI NEWSROOM</span>
    </div>
    <div class="wtf-nav-links">
      <a href="/">News</a>
      <a href="/team">Team</a>
      <a href="https://what-the-fact.tech/transparency">Methodology</a>
      <a href="https://what-the-fact.tech/score">Score Text</a>
    </div>
    <div class="wtf-nav-live">
      <span class="wtf-live-dot"></span>
      <span>LIVE &middot; {{ source_count | default(0) }} SOURCES</span>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="es">ES</button>
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer class="wtf-footer">
    <span data-i18n="footer.copyright">Built on radical transparency.</span> <a href="https://what-the-fact.tech" data-i18n="nav.transparency">How we score bias →</a>
  </footer>
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script>
    fetch('/static/data/translations.json')
      .then(function(r){return r.json();})
      .then(function(data){I18n.init(data);})
      .catch(function(){I18n.init({});});
  </script>
</body>
</html>
