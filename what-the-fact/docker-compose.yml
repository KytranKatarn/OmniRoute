services:
  wtf-ingest:
    build: {context: ., dockerfile: Dockerfile.ingest}
    image: ghcr.io/kytrankatarn/wtf-ingest:0.1.0
    restart: unless-stopped
    env_file: [.env]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - hf_cache:/opt/hf-cache
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 1.0
    networks: [default, archie_net]
    environment:
      TZ: America/Toronto
      WTF_LLM_BACKLOG_ENABLED: "true"
      WTF_LLM_BACKLOG_MAX_AGE_DAYS: "30"
      WTF_LLM_BACKLOG_MAX_RUNS_PER_NIGHT: "5000"
      WTF_LLM_BACKLOG_CONCURRENCY: "4"
      WTF_LLM_BACKLOG_DISPATCH_SLEEP_SEC: "1"
      WTF_HUB_TIMEOUT: "240"
      WTF_BIAS_V2_ENABLED: "true"
      WTF_BIAS_V2_MAX_AGE_DAYS: "90"
      WTF_GEO_BACKLOG_MAX_RUNS_PER_NIGHT: "5000"
      WTF_GEO_LIVE_SKIP: "true"
      WTF_FACTCHECK_BACKLOG_ENABLED: "true"
      WTF_FACTCHECK_BACKLOG_MAX_RUNS_PER_NIGHT: "5000"
      WTF_FACTCHECK_BACKLOG_CONCURRENCY: "4"
  wtf-consumer:
    build: {context: ., dockerfile: Dockerfile.consumer}
    image: ghcr.io/kytrankatarn/wtf-consumer:0.1.0
    restart: unless-stopped
    env_file: [.env]
    ports: ["8103:8103"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - wtf_billing_data:/app/data
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    networks: [default, archie_net]
    environment:
      TZ: America/Toronto

  wtf-tech:
    build: {context: ., dockerfile: Dockerfile.tech}
    image: ghcr.io/kytrankatarn/wtf-tech:0.1.0
    restart: unless-stopped
    env_file: [.env]
    ports: ["8104:8104"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    networks: [default, archie_net]
    environment:
      TZ: America/Toronto

volumes:
  wtf_billing_data:
  hf_cache:

networks:
  archie_net:
    external: true
    name: archie-outpost_archie_net
