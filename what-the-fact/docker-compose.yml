services:
  wtf-ingest:
    build: {context: ., dockerfile: Dockerfile.ingest}
    image: ghcr.io/kytrankatarn/wtf-ingest:0.1.0
    restart: unless-stopped
    env_file: [.env]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - hf_cache:/opt/hf-cache
    cap_drop: [ALL]
    # 3g (was 2g): measured steady-state working set is ~2.0 GiB (1.16 GiB
    # anon + ~0.85 GiB hot mmapped model weights) — NOT a leak; 2g forced
    # permanent reclaim churn at the ceiling. Citadel has ~20 GiB free.
    # A memory change needs `docker compose up -d wtf-ingest` (recreate) —
    # `restart` does not apply HostConfig.Memory. #5716
    mem_limit: 3g
    cpus: 1.0
    networks: [default, archie_net]
    environment:
      TZ: America/Toronto
      WTF_LLM_BACKLOG_ENABLED: "true"
      WTF_LLM_BACKLOG_MAX_AGE_DAYS: "30"
      WTF_LLM_BACKLOG_MAX_RUNS_PER_NIGHT: "5000"
      WTF_LLM_BACKLOG_CONCURRENCY: "4"
      WTF_LLM_BACKLOG_DISPATCH_SLEEP_SEC: "1"
      WTF_HUB_TIMEOUT: "240"
      WTF_BIAS_V2_ENABLED: "true"
      WTF_BIAS_V2_MAX_AGE_DAYS: "90"
      WTF_GEO_BACKLOG_MAX_RUNS_PER_NIGHT: "5000"
      WTF_GEO_LIVE_SKIP: "true"
      WTF_FACTCHECK_BACKLOG_ENABLED: "true"
      WTF_FACTCHECK_BACKLOG_MAX_RUNS_PER_NIGHT: "5000"
      WTF_FACTCHECK_BACKLOG_CONCURRENCY: "4"
      # Dispute tracker (#6524) — deliberately capped low, NOT the 5000 sibling
      # default. A pre-enable test batch (2026-09-06) was read as V.E.R.I.F.Y.
      # "inventing a factual detail" on cluster 99442 (a "Five" vs "Three" MLA
      # count) — CORRECTED same day: the first real post-enable run reproduced
      # the identical disputed_point, and checking the actual headlines showed
      # CTV News/Global News/iPolitics genuinely say "5"/"Five" while Vancouver
      # Sun/Globe and Mail/Winnipeg Free Press genuinely say "Three" — a REAL
      # cross-outlet discrepancy, not a hallucination. That half of the concern
      # was a misdiagnosis (the earlier check only read one side's article).
      # The OTHER half is still open and NOT yet re-verified live: the same
      # test batch showed a confident verdict on a pure forecast question
      # ("will B.C. have a snap election") that the prompt says must stay
      # unscored (is_opinion=true, verdict=null). Keep the cap low and keep
      # spot-checking until a forecast-shaped dispute recurs and can be
      # re-checked against reality the same way. Raise
      # WTF_DISPUTE_BACKLOG_MAX_RUNS_PER_NIGHT only after that.
      WTF_DISPUTE_BACKLOG_ENABLED: "true"
      WTF_DISPUTE_BACKLOG_MAX_RUNS_PER_NIGHT: "8"
      # Beat classifier — coverage fix (audit 2026-07-14, #4897): at the old 50/run
      # + 5s sleep defaults the worker tagged ~110/day vs ~1,100 new articles/day.
      WTF_BEAT_BACKLOG_ENABLED: "true"
      WTF_BEAT_BACKLOG_MAX_PER_RUN: "200"
      WTF_BEAT_BACKLOG_DISPATCH_SLEEP_SEC: "1"
      # Weekly digest + KBS CRM sync (#4899) — secrets live in the deploy-host
      # .env (append-only); these passthroughs let compose interpolate them.
      WTF_WEEKLY_DIGEST_ENABLED: ${WTF_WEEKLY_DIGEST_ENABLED:-false}
      WTF_SMTP_HOST: ${WTF_SMTP_HOST:-100.64.0.10}
      WTF_SMTP_PORT: ${WTF_SMTP_PORT:-25}
      WTF_SMTP_USER: ${WTF_SMTP_USER:-}
      WTF_SMTP_FROM: ${WTF_SMTP_FROM:-}
      WTF_SMTP_PASS: ${WTF_SMTP_PASS:-}
      KBS_INTERNAL_URL: ${KBS_INTERNAL_URL:-http://100.64.0.4:8091}
      KBS_INTERNAL_KEY: ${KBS_INTERNAL_KEY:-}
  wtf-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: ghcr.io/kytrankatarn/wtf-consumer:0.1.0
    restart: unless-stopped
    env_file: [.env]
    ports: ["8103:8103"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - wtf_billing_data:/app/data
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    networks: [default, archie_net]
    environment:
      TZ: America/Toronto
      # Public-edge rate limiting (#5747/#5748). Buckets are per-gunicorn-worker,
      # so WTF_GUNICORN_WORKERS MUST match the --workers in Dockerfile.consumer (4)
      # or the advertised limit drifts from the enforced one again.
      WTF_GUNICORN_WORKERS: ${WTF_GUNICORN_WORKERS:-4}
      WTF_RATE_BUCKET_MAX_KEYS: ${WTF_RATE_BUCKET_MAX_KEYS:-20000}

  # Dedicated entity-graph INGEST API (#4195) — isolates the heavy ingest POST
  # endpoint off the PUBLIC wtf-consumer workers so a big backfill can never
  # starve what-the-fact.com /news (incident KB #273424). Same consumer image,
  # separate gunicorn + port; products POST here via ENTITY_INGEST_URL.
  wtf-ingest-api:
    # Shares Dockerfile.consumer AND the wtf-consumer:0.1.0 image tag, so it MUST pass the same
    # provenance build args: with `deploy.sh all` this service builds last and re-tags the image,
    # and without the args it overwrote the consumer's stamp with git_sha=unknown (2026-10-01).
    build:
      context: .
      dockerfile: Dockerfile.consumer
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: ghcr.io/kytrankatarn/wtf-consumer:0.1.0
    restart: unless-stopped
    env_file: [.env]
    command: ["gunicorn", "--bind", "0.0.0.0:8106", "--workers", "2", "--timeout", "240", "--access-logfile", "-", "consumer.app:create_app()"]
    ports: ["8106:8106"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0
    networks: [default, archie_net]
    environment:
      TZ: America/Toronto
      # ingest-api never serves billing; point the billing sqlite at tmpfs so
      # create_app()'s init_billing_table() works under the read-only rootfs
      # without needing the /app/data volume.
      WTF_BILLING_DB_PATH: /tmp/wtf_billing.db
      # This service runs the SAME consumer app on --workers 2 (not 4), so the
      # limiter's divisor must differ. The entity-graph ingest route lives in its
      # own blueprint gated by X-Internal-Key and is NOT rate-limited.
      WTF_GUNICORN_WORKERS: ${WTF_INGEST_API_WORKERS:-2}

  # WTF's own dedicated Postgres instance (task: DB separation from the hub, 2026-09-05).
  # Provisioned empty; populated via a one-time pg_dump/restore from the hub's "wtf"
  # database, then the 4 services above are cut over to WTF_DATABASE_URL pointing here.
  # Until that cutover, this container exists but nothing points at it yet.
  wtf-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    shm_size: 512m
    # NOT read_only + cap_drop here (unlike the hub's archie_database) — tested live:
    # under read_only:true + the same cap_add set the hub uses, first-time initdb fails
    # completely silently (exit 0, zero log output, instant restart loop). Confirmed by
    # running the identical image+volume+env without those restrictions: it initializes
    # and starts cleanly. Simplicity wins here — this is a new, less-tuned deployment,
    # not worth chasing the exact missing capability/tmpfs path right now.
    mem_limit: 2g
    cpus: 1.0
    environment:
      TZ: America/Toronto
      POSTGRES_USER: wtfuser
      POSTGRES_PASSWORD_FILE: /run/secrets/wtf_db_password
      POSTGRES_DB: wtf
      POSTGRES_HOST_AUTH_METHOD: md5
    secrets:
      - wtf_db_password
    # Mesh-only publish (task #6632 follow-on) — this instance (PR #3222) had NO
    # port exposed anywhere outside its own compose network. The hub's Playwright
    # scrapers (senate/lobbying/GIC — Chrome only installed on the hub, never in
    # wtf-ingest) had no path to the live DB at all: senate_votes_cron.sh kept
    # writing into the OLD hub `wtf` database for a full week post-cutover with
    # no error, because nothing failed — it just wrote somewhere nobody reads.
    # Binding to the mesh IP specifically (not 0.0.0.0) means the public interface
    # never sees this port even if the host UFW rule below were ever removed —
    # defense in depth, same reasoning as outpost-vps.md's Ollama :11434 rule.
    # 5433 is already a native (non-Docker) postgres on Citadel — 5434 confirmed free.
    ports:
      - "100.64.0.10:5434:5432"
    volumes:
      - wtf_pg_data:/var/lib/postgresql/data
    networks: [default]

  wtf-tech:
    build:
      context: .
      dockerfile: Dockerfile.tech
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: ghcr.io/kytrankatarn/wtf-tech:0.1.0
    restart: unless-stopped
    env_file: [.env]
    ports: ["8104:8104"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    networks: [default, archie_net]
    environment:
      TZ: America/Toronto
      # C.R.E.E.D. API base URL — server-side proxy only, never exposed to browser JS (KB #267314)
      # Override in VPS .env if creed.kytranempowerment.com is unreachable from the container.
      CREED_API_URL: ${CREED_API_URL:-https://creed.kytranempowerment.com}

volumes:
  wtf_billing_data:
  hf_cache:
  wtf_pg_data:

networks:
  archie_net:
    external: true
    name: archie-outpost_archie_net

secrets:
  wtf_db_password:
    file: ./secrets/wtf_db_password.txt
