<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What The Fact — Bias Ratings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 280px;
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #e2e8f0;
    }

    .header {
      background: #1e293b;
      padding: 14px 16px 12px;
      border-bottom: 2px solid #00ffff22;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00e5ff;
      box-shadow: 0 0 8px #00e5ff88;
      flex-shrink: 0;
    }

    .header-text h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: #00e5ff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header-text p {
      margin: 2px 0 0;
      font-size: 10px;
      color: #94a3b8;
    }

    .status-bar {
      padding: 10px 16px;
      background: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e88;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 11px;
      color: #86efac;
      font-weight: 600;
    }

    .legend {
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
    }

    .legend h2 {
      margin: 0 0 8px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      font-weight: 600;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
    }

    .dot-left    { background: #3b82f6; }
    .dot-centre  { background: #9ca3af; }
    .dot-right   { background: #ef4444; }
    .dot-unknown { background: #f59e0b; }

    .legend-label {
      font-size: 11px;
      color: #cbd5e1;
    }

    .sites {
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
    }

    .sites h2 {
      margin: 0 0 6px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      font-weight: 600;
    }

    .sites p {
      margin: 0;
      font-size: 10px;
      color: #94a3b8;
      line-height: 1.5;
    }

    .footer {
      padding: 10px 16px;
      text-align: center;
    }

    .footer a {
      font-size: 10px;
      color: #00e5ff;
      text-decoration: none;
      opacity: 0.8;
    }

    .footer a:hover {
      opacity: 1;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-dot"></div>
    <div class="header-text">
      <h1>What The Fact</h1>
      <p>Bias Ratings — Canadian News</p>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot"></div>
    <span class="status-text">Active — scanning links</span>
  </div>

  <div class="legend">
    <h2>Bias Indicator</h2>
    <div class="legend-item">
      <div class="legend-dot dot-left"></div>
      <span class="legend-label">Left-leaning</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot dot-centre"></div>
      <span class="legend-label">Centre / Balanced</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot dot-right"></div>
      <span class="legend-label">Right-leaning</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot dot-unknown"></div>
      <span class="legend-label">Unrated</span>
    </div>
  </div>

  <div class="sites">
    <h2>Active On</h2>
    <p>Twitter/X &middot; Facebook &middot; LinkedIn &middot; Reddit</p>
  </div>

  <div class="footer">
    <a href="https://what-the-fact.com" target="_blank" rel="noopener">
      what-the-fact.com
    </a>
  </div>
</body>
</html>
