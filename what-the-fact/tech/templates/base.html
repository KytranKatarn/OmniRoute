<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}What The Fact — Tech{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="wtf-header">
    <a href="/" class="wtf-brand">What The Fact · Tech</a>
    <nav>
      <a href="/" data-i18n="nav.home">Home</a>
      <a href="/dashboard" data-i18n="nav.dashboard">Dashboard</a>
      <a href="/transparency" data-i18n="nav.transparency">Transparency</a>
      <a href="/api" data-i18n="nav.api">API</a>
      <a href="https://what-the-fact.com">← Consumer site</a>
    </nav>
    <div class="lang-switcher" style="display:flex;gap:0.5rem;margin-left:1rem">
      <button class="lang-btn" data-lang="en" style="background:none;border:1px solid #30363d;color:#e6edf3;padding:0.2rem 0.5rem;border-radius:3px;cursor:pointer;font-size:0.75rem">EN</button>
      <button class="lang-btn" data-lang="fr" style="background:none;border:1px solid #30363d;color:#e6edf3;padding:0.2rem 0.5rem;border-radius:3px;cursor:pointer;font-size:0.75rem">FR</button>
      <button class="lang-btn" data-lang="es" style="background:none;border:1px solid #30363d;color:#e6edf3;padding:0.2rem 0.5rem;border-radius:3px;cursor:pointer;font-size:0.75rem">ES</button>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="wtf-footer">
    <span data-i18n="footer.copyright">© Kytran Empowerment Inc.</span> — Radical transparency in AI news. <a href="https://github.com/KytranKatarn/archie-platform">Source →</a>
  </footer>
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script>
    fetch('/static/data/translations.json')
      .then(function(r){return r.json();})
      .then(function(data){I18n.init(data);})
      .catch(function(){I18n.init({});});
  </script>
</body>
</html>
