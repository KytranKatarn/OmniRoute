services:
  www:
    image: nginx:alpine
    container_name: archie_www
    restart: unless-stopped
    ports:
      - "8091:80"
      - "8092:443"
    volumes:
      - /mnt/archie_brain/repos/website/kytranempowerment-site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - archie_network

    environment:
      TZ: America/Toronto
networks:
  archie_network:
    external: true
