server {
    listen 80;
    server_name www.kytranempowerment.com kytranempowerment.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name www.kytranempowerment.com kytranempowerment.com;

    ssl_certificate /etc/nginx/ssl/www.crt;
    ssl_certificate_key /etc/nginx/ssl/www.key;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to platform (same origin = no CORS)
    location /api/ {
        proxy_pass http://192.168.1.200:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy platform static assets (portraits, CSS, JS)
    location /static/ {
        proxy_pass http://192.168.1.200:3000;
        proxy_set_header Host $host;
    }

    # Serve static files, support clean URLs
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
